<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>재의 서약 · Ashen Oath</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071316;color:#e4dfce;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;outline:none}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#071316;z-index:2}h1{font-size:36px;letter-spacing:.12em;font-weight:500}p{color:#ada381;font-size:14px;letter-spacing:.15em}progress{width:300px;height:4px;accent-color:#bbab7a;border:0}#error{max-width:620px;line-height:1.6;white-space:pre-wrap}#fullscreen{position:fixed;right:12px;bottom:8px;background:#071316bb;color:#9b9e8e;border:1px solid #344341;padding:5px 9px;font-size:11px;cursor:pointer}</style></head>
<body><canvas id="unity-canvas" tabindex="0" aria-label="재의 서약 게임 화면"></canvas><div id="loading"><p>ASHEN OATH</p><h1>재의 서약</h1><p>서약의 문을 여는 중</p><progress id="progress" max="1" value="0"></progress><p id="error"></p></div><button id="fullscreen" aria-label="전체 화면">전체 화면</button>
<script>const canvas=document.getElementById('unity-canvas');function sizeCanvas(){canvas.style.width=(window.innerWidth||1280)+'px';canvas.style.height=(window.innerHeight||720)+'px'}sizeCanvas();window.addEventListener('resize',sizeCanvas);const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onload=()=>createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'AshenOath',productName:'Ashen Oath',productVersion:'0.2.0',matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio,1.5)},p=>document.getElementById('progress').value=p).then(game=>{document.getElementById('loading').remove();document.getElementById('fullscreen').onclick=()=>game.SetFullscreen(1);canvas.focus()}).catch(e=>document.getElementById('error').textContent=String(e));document.body.appendChild(script);</script></body></html>
