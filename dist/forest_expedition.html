        const res = u.def.interruptResist || (u.size > 1 ? CONST.INTERRUPT_RESIST : CONST.INTERRUPT_RESIST_SMALL);
        const got = u.intr ? Math.min(res, u.intr.pts) : 0;
        const cy = top - 24, w = res * 18 + 8;
        ctx.fillStyle = 'rgba(10,16,30,0.75)'; ctx.beginPath(); ctx.roundRect(x - w / 2, cy - 10, w, 20, 10); ctx.fill();
        for (let i = 0; i < res; i++) {
          const cx = x + (i - (res - 1) / 2) * 18;
          ctx.beginPath(); ctx.arc(cx, cy, 6.5, 0, Math.PI * 2);
          ctx.fillStyle = i < got ? '#9fd0ff' : 'rgba(40,60,90,0.9)'; ctx.fill();
          ctx.lineWidth = 2; ctx.strokeStyle = i < got ? '#ffffff' : '#9fd0ff'; ctx.stroke();
        }
      }
    }
    if (u.casting) { // 긴 시전 (이동 불가)
      const pf = 1 - u.casting.t / u.casting.total;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - 30, top - 26, 60, 7);
      ctx.fillStyle = '#ffd34a'; ctx.fillRect(x - 29, top - 25, 58 * pf, 5);
      ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = '#1a0f08';
      ctx.strokeText(u.casting.name, x, top - 30); ctx.fillStyle = '#fff6c0'; ctx.fillText(u.casting.name, x, top - 30);
    }
    if (u.broken > 0) {
      for (let i = 0; i < 4; i++) { const a = t * 4 + i * 1.57; ctx.fillStyle = i % 2 ? '#ffd34a' : '#fff6c0'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('★', x + Math.cos(a) * 22, top - 18 + Math.sin(a) * 5); }
      ctx.font = '900 14px sans-serif'; ctx.lineWidth = 3; ctx.strokeStyle = '#1a0f08'; ctx.strokeText('그로기', x, top - 30); ctx.fillStyle = '#ffd34a'; ctx.fillText('그로기', x, top - 30);
    }
    const cast = u.charge || u.call;
    if (cast) {
      const prog = 1 - cast.t / cast.total;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - 22, top - 20, 44, 7);
      ctx.fillStyle = u.charge ? '#ff5a3a' : '#ffb04a'; ctx.fillRect(x - 21, top - 19, 42 * prog, 5);
      ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = '#3a0000'; ctx.fillText('!', x + 1, top - 25); ctx.fillStyle = Math.floor(t * 8) % 2 ? '#ff5a3a' : '#ffd34a'; ctx.fillText('!', x, top - 26);
    }
    if (!enemy && u.statuses.guard) { ctx.strokeStyle = 'rgba(122,184,240,0.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y - s.h * sc * 0.5, s.h * sc * 0.6, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    if (!enemy && u.statuses.regen && Math.random() < 0.15) this.sparkle(x, y - 20, '#9cf0a8', 1);
  },

  drawTargetArc(ctx, from, to, t) {
    const x0 = from.x, y0 = this.unitTop(from) + 10, x1 = to.x, y1 = this.unitTop(to) - 4;
    ctx.strokeStyle = '#ffd34a'; ctx.lineWidth = 3; ctx.setLineDash([8, 7]); ctx.lineDashOffset = -t * 40;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo((x0 + x1) / 2, Math.min(y0, y1) - 70, x1, y1); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#ffd34a'; ctx.beginPath(); ctx.moveTo(x1, y1 + 2); ctx.lineTo(x1 - 7, y1 - 10); ctx.lineTo(x1 + 7, y1 - 10); ctx.fill();
  },

  drawFx(ctx) {
    for (const f of this.fx) {
      if (f.t < 0) continue;
      const k = f.t / f.dur;
      switch (f.type) {
        case 'spark': ctx.fillStyle = f.color; ctx.globalAlpha = 1 - k; ctx.fillRect(f.x - 2, f.y - 2, 4, 4); ctx.globalAlpha = 1; break;
        case 'sparkle': ctx.fillStyle = f.color; ctx.globalAlpha = 1 - k; ctx.fillRect(f.x - 1, f.y - 4, 2, 8); ctx.fillRect(f.x - 4, f.y - 1, 8, 2); ctx.globalAlpha = 1; break;
        case 'smoke': ctx.fillStyle = `rgba(200,190,210,${0.55 * (1 - k)})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.6 + k), 0, Math.PI * 2); ctx.fill(); break;
        case 'dust': ctx.fillStyle = `rgba(160,130,110,${0.7 * (1 - k)})`; ctx.fillRect(f.x - 3, f.y - 3, 6, 6); break;
        case 'zone': ctx.strokeStyle = `rgba(${f.color},${1 - k})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(f.x, f.y, f.r * (0.4 + k * 0.6), f.r / CONST.Y_WEIGHT * (0.4 + k * 0.6), 0, 0, Math.PI * 2); ctx.stroke(); break;
        case 'proj': {
          if (!f.to) break;
          const x1 = f.to.x, y1 = f.to.y - 30 * (f.to.size || 1);
          const x = lerp(f.x0, x1, k), y = lerp(f.y0, y1, k) - Math.sin(k * Math.PI) * (f.kind === 'bori' ? 30 : 12);
          const ang = Math.atan2(y1 - f.y0, x1 - f.x0);
          if (f.kind === 'byeolbi' || f.kind === 'pierce' || f.kind === 'snipe') {
            ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
            ctx.strokeStyle = f.kind === 'snipe' ? '#ffd34a' : '#f3dcb4'; ctx.lineWidth = f.big ? 4 : 2;
            ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(4, 0); ctx.stroke(); ctx.fillStyle = '#c9d0d8'; ctx.fillRect(3, -2, 4, 4);
            if (f.big) { ctx.fillStyle = 'rgba(255,230,120,0.5)'; ctx.fillRect(-40, -1, 30, 2); }
            ctx.restore();
          } else if (f.kind === 'soldam' || f.kind === 'starbolt') {
            const r = f.big ? 7 : 4;
            ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,200,90,0.4)'; ctx.beginPath(); ctx.arc(x - Math.cos(ang) * 8, y - Math.sin(ang) * 8, r * 0.8, 0, Math.PI * 2); ctx.fill();
          } else { ctx.fillStyle = '#9fe0ff'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill(); }
          break;
        }
        case 'slash': {
          ctx.strokeStyle = f.color; ctx.lineWidth = 4 * (1 - k) + 1;
          const n = f.multi ? 6 : 1;
          for (let i = 0; i < n; i++) { const kk = f.multi ? clamp(k * n - i, 0, 1) : k; if (kk <= 0 || kk >= 1) continue; const a0 = -1.2 + i * 0.7, r = 34 + (i % 2) * 8; ctx.beginPath(); ctx.arc(f.x, f.y, r, a0, a0 + kk * 2.2); ctx.stroke(); }
          break;
        }
        case 'spin': ctx.strokeStyle = `rgba(255,255,255,${1 - k})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(f.x, f.y - 24, f.r * (0.5 + k * 0.5), f.r / CONST.Y_WEIGHT * (0.5 + k * 0.5) + 6, 0, k * 8, k * 8 + 4.5); ctx.stroke(); break;
        case 'meteor': {
          const x = f.tx + (1 - k) * 120, y = lerp(-20, f.ty, k);
          ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(x, y, f.big ? 9 : 7, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = 'rgba(255,150,60,0.7)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 30, y - 40); ctx.stroke();
          if (k > 0.9) { ctx.fillStyle = 'rgba(255,200,90,0.6)'; this.floorEllipse(ctx, f.tx, f.ty, 26, 8); }
          break;
        }
        case 'arrowdrop': { const y = lerp(40, f.ty, k); ctx.strokeStyle = '#f3dcb4'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(f.tx, y - 16); ctx.lineTo(f.tx, y); ctx.stroke(); ctx.fillStyle = '#c9d0d8'; ctx.fillRect(f.tx - 2, y, 4, 4); break; }
        case 'shield': { const u = f.unit; const s = getSprite(u.sprite); ctx.strokeStyle = `rgba(122,184,240,${1 - k})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(u.x, u.y - s.h * 1.5, s.h * 1.8 * (0.8 + k * 0.3), Math.PI, 0); ctx.stroke(); break; }
        case 'tree': {
          const h = Math.min(1, k * 2) * 140;
          ctx.globalAlpha = k < 0.8 ? 0.85 : (1 - k) * 4;
          ctx.fillStyle = '#6e4724'; ctx.fillRect(f.x - 8, f.y - h, 16, h);
          ctx.fillStyle = '#64b84e';
          for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(f.x + Math.cos(i) * 40 * (h / 140), f.y - h + Math.sin(i * 2) * 18, 26 * (h / 140), 0, Math.PI * 2); ctx.fill(); }
          ctx.globalAlpha = 1; break;
        }
        default: break;
      }
    }
  },

  statusIcons(u) {
    let s = '';
    for (const k in u.statuses) {
      const st = STATUS[k];
      if (!st) continue;
      const t = u.statuses[k].t;
      const n = u.statuses[k].n; // 스택형(짓누름)은 남은 시간 대신 겹 수
      s += `<span class="sti" style="background:${st.color}">${st.short}${n ? `<i>${n}</i>` : isFinite(t) ? `<i>${Math.ceil(t)}</i>` : ''}</span>`;
    }
    return s;
  },


  drawPopups(ctx) {
    ctx.textAlign = 'center';
    for (const p of this.popups) {
      const k = p.t / p.dur;
      const sc = p.crit ? (k < 0.15 ? 0.6 + k / 0.15 * 0.8 : 1.4 - Math.min(0.4, (k - 0.15) * 2)) : (k < 0.1 ? 0.7 + k * 3 : 1);
      ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
      ctx.font = `900 ${Math.round(p.size * sc)}px "Trebuchet MS", sans-serif`;
      ctx.lineWidth = 4; ctx.strokeStyle = '#1a0f08';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  },

  drawBanner(ctx) {
    const b = this.banner;
    if (!b) return;
    const k = b.t / b.dur;
    const a = k < 0.15 ? k / 0.15 : k > 0.8 ? (1 - k) / 0.2 : 1;
    ctx.globalAlpha = a;
    ctx.fillStyle = b.danger ? 'rgba(90,10,10,0.75)' : 'rgba(20,14,30,0.7)';
    ctx.fillRect(0, 196, 960, 74);
    ctx.fillStyle = b.danger ? '#ff8a6a' : '#ffd34a';
    ctx.fillRect(0, 196, 960, 2); ctx.fillRect(0, 268, 960, 2);
    ctx.textAlign = 'center';
    ctx.font = '900 32px sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = '#1a0f08';
    const dx = (1 - easeOutCubic(Math.min(1, k * 5))) * 80;
    ctx.strokeText(b.text, 480 + dx, 240); ctx.fillStyle = '#fff6e6'; ctx.fillText(b.text, 480 + dx, 240);
    if (b.sub) { ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#e0d0f0'; ctx.fillText(b.sub, 480 + dx, 262); }
    ctx.globalAlpha = 1;
  },

  drawCutin(ctx) {
    const c = this.cutin;
    if (!c) return;
    const k = c.t / c.dur;
    const slide = k < 0.2 ? easeOutBack(k / 0.2) : k > 0.8 ? 1 - (k - 0.8) / 0.2 : 1;
    ctx.save();
    ctx.globalAlpha = Math.min(1, slide * 1.2);
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, 960, 540);
    ctx.translate(0, 270);
    ctx.rotate(-0.08);
    ctx.fillStyle = c.hero.def.accent; ctx.fillRect(-50, -70, 1100 * slide, 140);
    ctx.fillStyle = '#fff6e6'; ctx.fillRect(-50, -70, 1100 * slide, 6); ctx.fillRect(-50, 64, 1100 * slide, 6);
    for (let i = 0; i < 10; i++) { ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(((c.t * 1400 + i * 137) % 1100) - 50, -60 + (i * 31) % 120, 60, 2); }
    drawSprite(ctx, c.hero.sprite, 220 * slide - 20, 76, { scale: 7, t: c.t });
    ctx.textAlign = 'left'; ctx.font = '900 46px sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = '#1a0f08';
    ctx.strokeText(c.name, 400 * slide + 40, 16); ctx.fillStyle = '#fff6e6'; ctx.fillText(c.name, 400 * slide + 40, 16);
    ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#1a0f08'; ctx.fillText(`${c.hero.name}의 필살기`, 400 * slide + 44, 46);
    ctx.restore();
  },
};

// 스킬 아이콘 (인라인 SVG, fx 키 기준)
function skillGlyph(sk) {
  const P = {
    taunt: '<path d="M12 3c5 0 8 1 8 3 0 7-3 12-8 15C7 18 4 13 4 6c0-2 3-3 8-3z" fill="currentColor"/>',

    bash: '<path d="M5 19L16 8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="7" r="4.5" fill="currentColor"/>',
    slash: '<path d="M4 20L20 4M9 4c7 1 11 5 11 12" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/>',
    spin: '<path d="M19 12a7 7 0 1 1-3-5.7" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M17 3l1 5-5 0z" fill="currentColor"/>',
    flurry: '<path d="M3 17L13 5M8 20L18 8M13 21L21 11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
    pierce: '<path d="M4 20L19 5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M20 4l-7 1 6 6z" fill="currentColor"/>',
    snipe: '<circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="2.2" fill="none"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6" stroke="currentColor" stroke-width="2.2"/>',
    arrowrain: '<path d="M6 3v12M12 5v14M18 3v12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M3 14l3 5 3-5zM9 18l3 5 3-5zM15 14l3 5 3-5z" fill="currentColor"/>',
    starbolt: '<path d="M12 2l2.6 6.3L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.7z" fill="currentColor"/>',
    meteor: '<circle cx="9" cy="15" r="5" fill="currentColor"/><path d="M12 11l8-8M14 15l7-5M9 9l5-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    nova: '<circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5M4 4l3.5 3.5M16.5 16.5L20 20M4 20l3.5-3.5M16.5 7.5L20 4" stroke="currentColor" stroke-width="2"/>',
    heal: '<path d="M9.5 3h5v6.5H21v5h-6.5V21h-5v-6.5H3v-5h6.5z" fill="currentColor"/>',
    aoeheal: '<path d="M6 5h3v3h3v3H9v3H6v-3H3V8h3zM15 10h3v3h3v3h-3v3h-3v-3h-3v-3h3z" fill="currentColor"/>',
    tree: '<path d="M12 21V11" stroke="currentColor" stroke-width="2.4"/><path d="M12 2c5 3 6 9 0 12C6 11 7 5 12 2z" fill="currentColor"/>',
  };
  return '<svg viewBox="0 0 24 24" width="30" height="30">' + (P[sk.fx] || P.slash) + '</svg>';
}

// ===== 08_field.js : 마을 (쿼터뷰 숲속 마을 광장: 대장간·보관함·원정 포털) =====
const FIELD = {
  W: 1600, H: 1000,
  start: { x: 520, y: 640 },
  portal: { x: 1290, y: 300, r: 60 },
  guide: { x: 760, y: 560 },
  chest: { x: 610, y: 470 },
  trees: [[260, 300, 1.3], [180, 720, 1.0], [980, 210, 1.5], [1460, 640, 1.2], [1180, 820, 1.0], [420, 900, 0.9], [80, 470, 1.1], [1520, 220, 1.0], [880, 900, 1.1]],
  houses: [[420, 330, 0], [960, 430, 1]],
  well: { x: 700, y: 700 },
  smith: { x: 430, y: 540 },
  storage: { x: 930, y: 610 },
  altar: { x: 1130, y: 560 },
};

const FieldScene = {
  enter() {
    const run = Game.run;
    this.t = 0;
    this.leader = { x: FIELD.start.x, y: FIELD.start.y, flip: false, moving: false };
    this.trail = [];
    for (let i = 0; i < 200; i++) this.trail.push({ x: this.leader.x - i * 1.5, y: this.leader.y + i * 0.5 });
    this.rebuildParty();
    this.target = null;
    this.pendingInteract = null;
    this.joy = null;
    this.cam = { x: 0, y: 0 };
    this.tapMark = null;
    this.dusts = [];
    this.flies = [];
    for (let i = 0; i < 40; i++) this.flies.push({ x: Math.random() * FIELD.W, y: Math.random() * FIELD.H, p: Math.random() * 10, s: 0.5 + Math.random() });
    this.birds = [];
    this.birdTimer = 2;
    this.grass = [];
    const rng = makeRng(hashSeed('field-grass'));
    for (let i = 0; i < 380; i++) this.grass.push({ x: rng() * FIELD.W, y: rng() * FIELD.H, h: 6 + rng() * 8, c: rng() });
    this.flowers = [];
    for (let i = 0; i < 90; i++) this.flowers.push({ x: rng() * FIELD.W, y: rng() * FIELD.H, c: ['#ffd34a', '#f4a7a0', '#e8e8ff', '#c89af0'][Math.floor(rng() * 4)], p: rng() * 6 });
    this.obstacles = FIELD.trees.map(([x, y, s]) => ({ x, y, r: 26 * s }))
      .concat(FIELD.houses.map(([x, y]) => ({ x, y: y - 10, r: 70 })))
      .concat([{ x: FIELD.well.x, y: FIELD.well.y, r: 34 }, { x: FIELD.smith.x + 34, y: FIELD.smith.y, r: 22 }, { x: FIELD.storage.x, y: FIELD.storage.y, r: 24 }, { x: FIELD.altar.x, y: FIELD.altar.y, r: 26 }]);
    this.buildGround();
    const ui = Game.ui;
    const top = el('div', 'f-top');
    top.appendChild(el('div', 'f-title', '🌲 숲속 마을'));
    const r = el('div', 'f-right');
    r.appendChild(btn('던전 입구로 ▶', 'primary small', () => this.autoMove('portal'), { id: 'btn-automove' }));
    r.appendChild(btn('✨ 소환', 'small', () => openGacha(() => this.refreshRes()), { id: 'btn-gacha' }));
    r.appendChild(btn('🧑 캐릭터', 'small', () => openRoster({ onClose: () => this.refreshRes() }), { id: 'btn-roster' }));
    r.appendChild(btn('🎒 장비', 'small', () => openInventory({ onClose: () => this.refreshRes() }), { id: 'btn-inv' }));
    r.appendChild(btn('👥 파티 편성', 'small', () => openPartySelect(Game.run, () => this.rebuildParty()), { id: 'btn-party' }));
    r.appendChild(btn('⚙ 전략', 'small', () => openStrategyEditor(Game.run), { id: 'btn-f-strategy' }));
    top.appendChild(r);
    ui.appendChild(top);
    this.resBox = el('div', 'f-res');
    ui.appendChild(this.resBox);
    this.actBtn = btn('', 'primary f-act hidden', () => this.interact(this.nearby), { id: 'btn-interact' });
    ui.appendChild(this.actBtn);
    this.refreshRes();
    Game.hint('field');
  },

  rebuildParty() {
    const L = this.leader;
    this.followers = partyIds(Game.run).slice(1).map((id, i) => ({ id, x: L.x - 30 * (i + 1), y: L.y + 8, flip: false, moving: false }));
    if (this.resBox) this.refreshRes();
  },

  refreshRes() {
    const run = Game.run;
    const p = Game.profile;
    this.resBox.innerHTML = `<span>● ${p.gold}</span><span>💎 ${p.stones}</span><span>🎟 ${p.tickets}</span><span>🍞 ${run.food}</span><span>난이도 ${EQ.tierInfo(p.tier).name}</span><span>파티 ${partyIds(run).map((id) => HEROES[id].name).join('·')}</span>`;
  },

  interactables() {
    return [
      { key: 'portal', x: FIELD.portal.x, y: FIELD.portal.y + 40, label: '던전 입장' },
      { key: 'guide', x: FIELD.guide.x, y: FIELD.guide.y, label: '대화' },
      { key: 'chest', x: FIELD.chest.x, y: FIELD.chest.y, label: Game.run.gotSupply ? '빈 상자' : '열기' },
      { key: 'smith', x: FIELD.smith.x, y: FIELD.smith.y, label: '강화' },
      { key: 'storage', x: FIELD.storage.x, y: FIELD.storage.y, label: '장비' },
      { key: 'altar', x: FIELD.altar.x, y: FIELD.altar.y, label: '소환' },
    ];
  },

  autoMove(key) {
    const it = this.interactables().find((i) => i.key === key);
    this.target = { x: it.x - 30, y: it.y + 30 };
    this.pendingInteract = key;
    this.tapMark = { x: this.target.x, y: this.target.y, t: 0 };
  },

  interact(it) {
    if (!it) return;
    this.target = null;
    this.pendingInteract = null;
    const run = Game.run;
    if (it.key === 'chest') {
      if (run.gotSupply) { Game.toast('상자는 비어 있다.'); return; }
      run.gotSupply = true;
      run.food += CONST.SUPPLY_BOX_FOOD;
      run.potions += 1;
      Sfx.play('coin');
      Game.toast(`보급 상자: 식량 +${CONST.SUPPLY_BOX_FOOD}, 회복약 +1`, 2200);
      this.refreshRes();
    } else if (it.key === 'smith') {
      openBlacksmith(() => this.refreshRes());
    } else if (it.key === 'altar') {
      openGacha(() => this.refreshRes());
    } else if (it.key === 'storage') {
      openInventory({ onClose: () => this.refreshRes() });
    } else if (it.key === 'guide') {
      this.openGuide(0);
    } else if (it.key === 'portal') {
      const box = el('div', 'confirm-box');
      box.appendChild(el('div', 'modal-title', '고블린 굴에 들어갈까요?'));
      box.appendChild(this.tierPicker(() => this.interact(it)));
      box.appendChild(el('div', 'portal-party', partyIds(run).map((id) => `<span>${HEROES[id].name}<small>${HEROES[id].roleName}</small></span>`).join('')));
      box.appendChild(el('p', '', `파티 ${partyAlive(run).length}/${CONST.PARTY_SIZE}명 · 식량 ${run.food} · 회복약 ${run.potions} · 골드 ${run.gold}` + (run.gotSupply ? '' : '<br><b class="warn">보급 상자를 아직 열지 않았어요!</b>')));
      const row = el('div', 'btn-row');
      row.appendChild(btn('조금 더 둘러보기', 'ghost', () => Game.closeModal(), { sfx: 'back', id: 'portal-no' }));
      row.appendChild(btn('👥 편성', '', () => openPartySelect(run, () => { this.rebuildParty(); this.interact(it); }), { id: 'portal-party' }));
      row.appendChild(btn('입장!', 'primary', () => { Game.closeModal(); Sfx.play('door'); run.tier = Game.profile.tier; refreshRunLoadout(run); Game.go('map'); }, { id: 'portal-yes' }));
      box.appendChild(row);
      Game.modal(box, { dim: true, closeOnBg: true });
    }
  },

  // 난이도 선택: 보스를 잡으면 다음 단계 해금
  tierPicker(onChange) {
    const p = Game.profile;
    const wrap = el('div', 'tier-pick');
    for (let t = 0; t <= Math.min(p.unlockedTier, EQ.DB.tiers.length); t++) {
      const ti = EQ.tierInfo(t);
      const b = btn(`${ti.name}${t ? `<small>T${t}</small>` : ''}`, 'tier-btn' + (p.tier === t ? ' on' : ''), () => { p.tier = t; Game.run.tier = t; saveProfile(); this.refreshRes(); onChange(); }, { id: 'tier-' + t });
      wrap.appendChild(b);
    }
    const ti = EQ.tierInfo(p.tier);
    const ids = partyIds(Game.run), lv = Math.round(ids.reduce((a, id) => a + EQ.heroLevel(p, id), 0) / Math.max(1, ids.length)), dl = EQ.tierLevel(p.tier);
    const gap = lv - dl, gm = levelGapMult(gap);
    const gapTxt = gap === 0 ? '레벨 같음' : `레벨 차 ${gap > 0 ? '+' : ''}${gap}: 주는 피해 ${Math.round((gm.dealt - 1) * 100) >= 0 ? '+' : ''}${Math.round((gm.dealt - 1) * 100)}% · 받는 피해 ${Math.round((gm.taken - 1) * 100) >= 0 ? '+' : ''}${Math.round((gm.taken - 1) * 100)}%`;
    wrap.appendChild(el('div', 'tier-desc', `던전 Lv ${dl} · 파티 Lv ${lv} (${gapTxt})<br>` + (p.tier ? `적 체력·공격력 ×${ti.hp} · 권장 장비 ${ti.recGrade}` : '기본 난이도') + (gap < 20 && !ids.some((id) => HEROES[id].role === 'tank') ? '<br><b class="warn">탱커 없이는 보스를 버티기 어려워요</b>' : '')));
    return wrap;
  },

  openGuide(page) {
    const pages = [
      { t: '어서 오게, 원정대.', b: '광장 북동쪽 동굴이 <b>고블린 굴</b>이라네. 다섯 개의 방을 지나면 굴의 주인이 기다리지. 원정마다 다른 놈이 나오니 상대를 보고 동료를 고르게.<br><br>떠나기 전에 내 옆 <b>보급 상자</b>를 챙기게. 식량이 없으면 캠프에서 제대로 쉴 수 없어.' },
      { t: '지도 읽는 법', b: '굴 안은 갈림길투성이야. <b>다음 방은 같은 줄이거나 바로 위·아래 줄</b>만 갈 수 있지. 방 종류는 미리 보이니 길을 잘 고르게.<br><br>횃불은 방을 옮길 때마다 줄어든다네. 꺼지면 어둠 속에서 정예가 덮칠 수도 있어.' },
      { t: '전투 요령', b: '덩치 큰 놈들은 단단해서 칼이 잘 안 박혀. <b>기절</b>로 흔들어 놓고 비틀거릴 때 몰아치게.<br><br>오우거가 힘을 모으면 <b>토비의 방패 강타</b>로 끊거나 붉은 원 밖으로 피하게. 쓰러진 동료는... 이번 원정에선 돌아오지 못하네.' },
    ];

    box.appendChild(head);
    box.appendChild(el('div', 'dlg-title', p.t));
    box.appendChild(el('div', 'dlg-body', p.b));
    const row = el('div', 'btn-row');
    row.appendChild(btn('닫기', 'ghost', () => Game.closeModal(), { sfx: 'back', id: 'guide-close' }));
    if (page < pages.length - 1) row.appendChild(btn('다음 ▶', 'primary', () => this.openGuide(page + 1), { id: 'guide-next' }));
    box.appendChild(row);
    Game.modal(box, { dim: true, closeOnBg: true });
  },

  // ------------------------------------------------------------ 입력
  joyBase() { return { x: 104, y: 432 }; },
  pointerDown(p) {
    Sfx.init();
    const jb = this.joyBase();
    if (dist2(p.x, p.y, jb.x, jb.y) < 95 * 95) {
      this.joy = { dx: 0, dy: 0 };
      this.target = null; this.pendingInteract = null;
      this.pointerMove(p);
      return;
    }
    const wx = p.x + this.cam.x, wy = p.y + this.cam.y;
    // 상호작용 대상을 탭하면 그쪽으로 걸어가서 실행
    for (const it of this.interactables()) {
      if (dist2(wx, wy, it.x, it.y - 30) < 55 * 55) { this.autoMove(it.key); return; }
    }
    this.target = { x: clamp(wx, 20, FIELD.W - 20), y: clamp(wy, 60, FIELD.H - 20) };
    this.pendingInteract = null;
    this.tapMark = { x: this.target.x, y: this.target.y, t: 0 };
  },
  pointerMove(p) {
    if (!this.joy) return;
    const jb = this.joyBase();
    let dx = p.x - jb.x, dy = p.y - jb.y;
    const d = Math.hypot(dx, dy);
    if (d > 56) { dx = dx / d * 56; dy = dy / d * 56; }
    this.joy.dx = dx; this.joy.dy = dy;
  },
  pointerUp() { this.joy = null; },

  // ------------------------------------------------------------ 진행
  update(dt) {
    this.t += dt;
    const L = this.leader;
    let vx = 0, vy = 0;
    const speed = 190;
    if (this.joy && (Math.abs(this.joy.dx) > 6 || Math.abs(this.joy.dy) > 6)) {
      vx = this.joy.dx / 56 * speed; vy = this.joy.dy / 56 * speed;
    } else if (this.target) {
      const dx = this.target.x - L.x, dy = this.target.y - L.y;
      const d = Math.hypot(dx, dy);
      if (d < 6) {
        this.target = null;
        if (this.pendingInteract) { const it = this.interactables().find((i) => i.key === this.pendingInteract); this.pendingInteract = null; this.interact(it); }
      } else { vx = dx / d * speed; vy = dy / d * speed; }
    }
    if (Game.modalOpen) { vx = 0; vy = 0; }
    L.moving = vx !== 0 || vy !== 0;
    if (L.moving) {
      const ox = L.x, oy = L.y;
      L.x = clamp(L.x + vx * dt, 20, FIELD.W - 20);
      L.y = clamp(L.y + vy * dt, 60, FIELD.H - 20);
      for (const o of this.obstacles) {
        const d = Math.hypot(L.x - o.x, L.y - o.y);
        if (d < o.r + 12) { const k = (o.r + 12) / (d || 1); L.x = o.x + (L.x - o.x) * k; L.y = o.y + (L.y - o.y) * k; }
      }
      // 끼임 방지: 목표 이동 중 거의 못 움직이면 목표 해제
      if (this.target && Math.hypot(L.x - ox, L.y - oy) < speed * dt * 0.15) { this.stuck = (this.stuck || 0) + dt; if (this.stuck > 0.6) { this.target = null; this.stuck = 0; } } else this.stuck = 0;
      if (Math.abs(vx) > 5) L.flip = vx < 0;
      this.trail.unshift({ x: L.x, y: L.y });
      if (this.trail.length > 300) this.trail.pop();
      if (Math.random() < dt * 8) this.dusts.push({ x: L.x + (Math.random() - 0.5) * 10, y: L.y, t: 0 });
      Sfx.play('step');
    }
    // 뒤따르는 파티원
    this.followers.forEach((f, i) => {
      const idx = Math.min(this.trail.length - 1, (i + 1) * 14);
      const p = this.trail[idx];
      const dx = p.x - f.x, dy = p.y - f.y;
      const d = Math.hypot(dx, dy);
      f.moving = d > 2;
      if (Math.abs(dx) > 1) f.flip = dx < 0;
      f.x += dx * Math.min(1, dt * 10); f.y += dy * Math.min(1, dt * 10);
      if (f.moving && Math.random() < dt * 4) this.dusts.push({ x: f.x, y: f.y, t: 0 });
    });
    for (let i = this.dusts.length - 1; i >= 0; i--) { this.dusts[i].t += dt; if (this.dusts[i].t > 0.5) this.dusts.splice(i, 1); }
    // 새 그림자
    this.birdTimer -= dt;
    if (this.birdTimer <= 0) { this.birdTimer = 4 + Math.random() * 5; this.birds.push({ x: this.cam.x - 60, y: this.cam.y + 80 + Math.random() * 300, vx: 160 + Math.random() * 60, vy: 30 + Math.random() * 30, t: 0 }); }
    for (let i = this.birds.length - 1; i >= 0; i--) { const b = this.birds[i]; b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; if (b.t > 9) this.birds.splice(i, 1); }
    if (this.tapMark) { this.tapMark.t += dt; if (this.tapMark.t > 0.6) this.tapMark = null; }
    // 카메라
    const cx = clamp(L.x - 480, 0, FIELD.W - 960), cy = clamp(L.y - 300, 0, FIELD.H - 540);
    this.cam.x += (cx - this.cam.x) * Math.min(1, dt * 6);
    this.cam.y += (cy - this.cam.y) * Math.min(1, dt * 6);
    // 근처 상호작용
    let near = null;
    for (const it of this.interactables()) if (dist2(L.x, L.y, it.x, it.y) < 85 * 85) near = it;
    this.nearby = near;
    if (near) { this.actBtn.classList.remove('hidden'); this.actBtn.innerHTML = near.label; } else this.actBtn.classList.add('hidden');
  },

  // 땅은 한 번만 그려서 캐시
  buildGround() {
    const cv = document.createElement('canvas');
    cv.width = FIELD.W; cv.height = FIELD.H;
    const g = cv.getContext('2d');
    const rng = makeRng(hashSeed('ground'));
    g.fillStyle = '#2f8a6a'; g.fillRect(0, 0, FIELD.W, FIELD.H);
    for (let i = 0; i < 500; i++) {
      g.fillStyle = ['#2a7e60', '#358f6e', '#3c9a74', '#287058'][Math.floor(rng() * 4)];
      g.beginPath(); g.ellipse(rng() * FIELD.W, rng() * FIELD.H, 20 + rng() * 60, 10 + rng() * 30, 0, 0, Math.PI * 2); g.fill();
    }
    // 흙길: 광장 → 포털
    g.strokeStyle = '#8a9a78'; g.lineCap = 'round'; g.lineWidth = 70;
    g.beginPath(); g.moveTo(640, 620); g.quadraticCurveTo(1000, 560, 1270, 360); g.stroke();
    g.strokeStyle = '#a3ae8a'; g.lineWidth = 50; g.stroke();
    g.lineWidth = 50; g.strokeStyle = '#a3ae8a';
    g.beginPath(); g.moveTo(640, 620); g.quadraticCurveTo(400, 700, 200, 980); g.stroke();
    // 광장 돌바닥
    g.fillStyle = '#9a9a8a'; g.beginPath(); g.ellipse(660, 600, 230, 150, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#b4b2a0'; g.beginPath(); g.ellipse(660, 596, 220, 142, 0, 0, Math.PI * 2); g.fill();
    for (let i = 0; i < 260; i++) {
      const a = rng() * Math.PI * 2, r = Math.sqrt(rng());
      const x = 660 + Math.cos(a) * 205 * r, y = 596 + Math.sin(a) * 130 * r;
      g.fillStyle = rng() < 0.5 ? '#a6a492' : '#c2c0ae';
      g.fillRect(Math.round(x), Math.round(y), 14, 8);
    }
    // 절벽 + 동굴
    g.fillStyle = '#4a5560';
    g.beginPath(); g.moveTo(1100, 0); g.lineTo(1600, 0); g.lineTo(1600, 380); g.lineTo(1420, 360); g.lineTo(1360, 330); g.lineTo(1200, 340); g.lineTo(1120, 240); g.closePath(); g.fill();
    g.fillStyle = '#5c6874';
    g.beginPath(); g.moveTo(1110, 0); g.lineTo(1600, 0); g.lineTo(1600, 300); g.lineTo(1400, 290); g.lineTo(1180, 270); g.lineTo(1130, 200); g.closePath(); g.fill();
    g.fillStyle = '#1a1424';
    g.beginPath(); g.ellipse(FIELD.portal.x, FIELD.portal.y + 10, 66, 76, 0, Math.PI, 0); g.lineTo(FIELD.portal.x + 66, FIELD.portal.y + 40); g.lineTo(FIELD.portal.x - 66, FIELD.portal.y + 40); g.fill();
    this.groundCv = cv;
  },

  render(ctx) {
    const t = this.t;
    const cam = this.cam;
    ctx.save();
    ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
    ctx.drawImage(this.groundCv, 0, 0);
    // 포털 소용돌이
    const P = FIELD.portal;
    for (let i = 0; i < 5; i++) {
      ctx.strokeStyle = `rgba(${170 + i * 15},${110 + i * 20},255,${0.7 - i * 0.1})`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(P.x, P.y + 4, 46 - i * 8, 56 - i * 9, 0, t * (1 + i * 0.4), t * (1 + i * 0.4) + 4.4); ctx.stroke();
    }
    const pg = ctx.createRadialGradient(P.x, P.y, 5, P.x, P.y, 120);
    pg.addColorStop(0, 'rgba(190,140,255,0.45)'); pg.addColorStop(1, 'rgba(190,140,255,0)');
    ctx.fillStyle = pg; ctx.fillRect(P.x - 120, P.y - 120, 240, 240);
    // 꽃
    for (const f of this.flowers) {
      const sw = Math.sin(t * 2 + f.p) * 1.5;
      ctx.fillStyle = '#2a6a4a'; ctx.fillRect(f.x, f.y - 6, 2, 6);
      ctx.fillStyle = f.c; ctx.fillRect(f.x - 2 + sw, f.y - 10, 5, 5);
    }
    // 풀 (흔들림)
    for (const gr of this.grass) {
      if (gr.x < cam.x - 20 || gr.x > cam.x + 980 || gr.y < cam.y - 20 || gr.y > cam.y + 560) continue;
      const sw = Math.sin(t * 2.2 + gr.x * 0.05) * 3;
      ctx.strokeStyle = gr.c < 0.5 ? '#4fb07e' : '#3c9a6a';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(gr.x, gr.y); ctx.quadraticCurveTo(gr.x + sw * 0.4, gr.y - gr.h * 0.6, gr.x + sw, gr.y - gr.h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gr.x + 3, gr.y); ctx.quadraticCurveTo(gr.x + 3 + sw * 0.3, gr.y - gr.h * 0.4, gr.x + 5 + sw, gr.y - gr.h * 0.75); ctx.stroke();
    }
    // 먼지
    for (const d of this.dusts) { ctx.fillStyle = `rgba(220,215,190,${0.5 * (1 - d.t / 0.5)})`; ctx.beginPath(); ctx.arc(d.x, d.y - d.t * 10, 3 + d.t * 8, 0, Math.PI * 2); ctx.fill(); }
    // 깊이 정렬 객체
    const objs = [];
    const run = Game.run;
    const L = this.leader;
    for (const [x, y, s] of FIELD.trees) objs.push({ y, draw: () => this.drawTrunk(ctx, x, y, s) });
    for (const [x, y, v] of FIELD.houses) objs.push({ y, draw: () => this.drawHouse(ctx, x, y, v) });
    objs.push({ y: FIELD.well.y, draw: () => this.drawWell(ctx, FIELD.well.x, FIELD.well.y) });
    objs.push({ y: FIELD.chest.y, draw: () => this.drawChest(ctx, FIELD.chest.x, FIELD.chest.y, run.gotSupply) });
    objs.push({ y: FIELD.smith.y, draw: () => this.drawSmith(ctx, FIELD.smith.x, FIELD.smith.y, t, L) });
    objs.push({ y: FIELD.storage.y, draw: () => this.drawStorage(ctx, FIELD.storage.x, FIELD.storage.y) });
    objs.push({ y: FIELD.altar.y, draw: () => this.drawAltar(ctx, FIELD.altar.x, FIELD.altar.y, t) });
    objs.push({ y: FIELD.guide.y, draw: () => { this.shadow(ctx, FIELD.guide.x, FIELD.guide.y, 16); drawSprite(ctx, 'guide', FIELD.guide.x, FIELD.guide.y, { scale: 2, t, flip: L.x < FIELD.guide.x, blinking: (t % 4) < 0.12 }); } });
    this.followers.forEach((f) => {
      const h = HEROES[f.id];
      objs.push({ y: f.y, draw: () => this.drawWalker(ctx, f.id, f, t, false) });
    });
    objs.push({ y: L.y, draw: () => this.drawWalker(ctx, partyIds(run)[0], L, t, true) });
    objs.sort((a, b) => a.y - b.y);
    for (const o of objs) o.draw();
    // 상호작용 표시
    for (const it of this.interactables()) {
      const near = this.nearby === it || (this.nearby && this.nearby.key === it.key);
      const bob = Math.sin(t * 4) * 3;
      if (it.key === 'chest' && run.gotSupply) continue;
      ctx.fillStyle = near ? '#ffd34a' : 'rgba(255,255,255,0.85)';
      ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      const label = { portal: '고블린 굴', guide: '길잡이', chest: '보급 상자', smith: '대장간', storage: '보관함', altar: '소환의 제단' }[it.key];
      const ly = it.key === 'portal' ? it.y - 150 : it.y - 62;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(label, it.x, ly + bob); ctx.fillText(label, it.x, ly + bob);
      if (it.key !== 'portal') { ctx.fillText('▼', it.x, ly + 14 + bob); }
    }
    // 탭 마커
    if (this.tapMark) { const k = this.tapMark.t / 0.6; ctx.strokeStyle = `rgba(255,255,255,${1 - k})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(this.tapMark.x, this.tapMark.y, 10 + k * 14, 5 + k * 7, 0, 0, Math.PI * 2); ctx.stroke(); }
    // 나무 그늘 (캐노피) — 캐릭터 위에 덮인다
    for (const [x, y, s] of FIELD.trees) this.drawCanopy(ctx, x, y, s, t);
    // 새 그림자
    for (const b of this.birds) {
      ctx.fillStyle = 'rgba(10,30,30,0.25)';
      const flap = Math.sin(b.t * 12) * 6;
      ctx.beginPath(); ctx.moveTo(b.x - 14, b.y + flap); ctx.lineTo(b.x, b.y); ctx.lineTo(b.x + 14, b.y + flap); ctx.lineTo(b.x, b.y + 5); ctx.fill();
    }
    // 반딧불
    for (const f of this.flies) {
      const x = f.x + Math.sin(t * 0.7 * f.s + f.p) * 30, y = f.y + Math.cos(t * 0.5 * f.s + f.p * 2) * 20;
      const a = 0.4 + 0.4 * Math.sin(t * 3 * f.s + f.p);
      const g = ctx.createRadialGradient(x, y, 0, x, y, 9);
      g.addColorStop(0, `rgba(230,255,140,${a})`); g.addColorStop(1, 'rgba(230,255,140,0)');
      ctx.fillStyle = g; ctx.fillRect(x - 9, y - 9, 18, 18);
    }
    ctx.restore();
    // 숲 비네트
    const vg = ctx.createRadialGradient(480, 270, 250, 480, 270, 620);
    vg.addColorStop(0, 'rgba(0,20,30,0)'); vg.addColorStop(1, 'rgba(0,20,30,0.45)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, 960, 540);
    // 조이스틱
    const jb = this.joyBase();
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); ctx.arc(jb.x, jb.y, 62, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.stroke();
    const kx = jb.x + (this.joy ? this.joy.dx : 0), ky = jb.y + (this.joy ? this.joy.dy : 0);
    ctx.fillStyle = this.joy ? 'rgba(255,230,150,0.75)' : 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.arc(kx, ky, 28, 0, Math.PI * 2); ctx.fill();
  },

  shadow(ctx, x, y, r) { ctx.fillStyle = 'rgba(0,30,20,0.35)'; ctx.beginPath(); ctx.ellipse(x, y + 2, r, r * 0.4, 0, 0, Math.PI * 2); ctx.fill(); },

  drawWalker(ctx, heroId, w, t, isLeader) {
    const sprite = HEROES[heroId].sprite;
    const bob = w.moving ? Math.abs(Math.sin(t * 12 + w.x * 0.01)) * 3 : 0;
    this.shadow(ctx, w.x, w.y, 16);
    if (isLeader) {
      ctx.strokeStyle = '#7dff8a'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(w.x, w.y + 2, 22 + Math.sin(t * 5) * 1.5, 9, 0, 0, Math.PI * 2); ctx.stroke();
    }
    drawSprite(ctx, sprite, w.x, w.y - bob, { scale: 2, t, flip: w.flip, phase: w.x * 0.01, blinking: ((t + w.x * 0.003) % 3.4) < 0.12, squash: w.moving ? 1 + Math.sin(t * 24) * 0.03 : 1 });
  },
  // 대장간: 모루 + 화로 + 대장장이 (임시로 길잡이 스프라이트 사용)
  drawSmith(ctx, x, y, t, L) {
    this.shadow(ctx, x + 34, y, 26);
    ctx.fillStyle = '#5a4a44'; ctx.fillRect(x - 70, y - 60, 40, 56);           // 화로
    ctx.fillStyle = '#2a1e1a'; ctx.fillRect(x - 64, y - 40, 28, 22);
    const fl = 0.6 + Math.sin(t * 9) * 0.25 + Math.sin(t * 13) * 0.15;
    const g = ctx.createRadialGradient(x - 50, y - 30, 2, x - 50, y - 30, 40);
    g.addColorStop(0, `rgba(255,170,60,${fl})`); g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 100, y - 70, 100, 80);
    ctx.fillStyle = '#ffb040'; ctx.fillRect(x - 60, y - 32, 20, 10);
    ctx.fillStyle = '#3c3c46'; ctx.fillRect(x + 20, y - 24, 30, 10); ctx.fillRect(x + 28, y - 14, 14, 14); ctx.fillRect(x + 22, y, 26, 4); // 모루
    ctx.fillStyle = '#5c5c6a'; ctx.fillRect(x + 20, y - 24, 30, 3);
    if ((t % 1.4) < 0.08) { ctx.fillStyle = '#fff2a0'; for (let i = 0; i < 5; i++) ctx.fillRect(x + 34 + Math.cos(i) * 10, y - 30 - Math.sin(i * 2) * 8, 2, 2); }
    drawSprite(ctx, 'guide', x, y, { scale: 2, t, flip: L.x < x, blinking: (t % 3.7) < 0.12 });
  },
  drawAltar(ctx, x, y, t) {
    this.shadow(ctx, x, y, 30);
    ctx.fillStyle = '#6a6478'; ctx.fillRect(x - 26, y - 22, 52, 22); ctx.fillStyle = '#8a8498'; ctx.fillRect(x - 30, y - 28, 60, 8);
    const by = y - 58 + Math.sin(t * 2) * 4;
    const g = ctx.createRadialGradient(x, by, 2, x, by, 46);
    g.addColorStop(0, `rgba(200,160,255,${0.55 + Math.sin(t * 3) * 0.15})`); g.addColorStop(1, 'rgba(200,160,255,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 50, by - 50, 100, 100);
    ctx.fillStyle = '#d8c0ff'; ctx.beginPath(); ctx.moveTo(x, by - 18); ctx.lineTo(x + 10, by); ctx.lineTo(x, by + 18); ctx.lineTo(x - 10, by); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.moveTo(x, by - 14); ctx.lineTo(x + 4, by - 2); ctx.lineTo(x - 3, by); ctx.closePath(); ctx.fill();
  },
  drawStorage(ctx, x, y) {
    this.shadow(ctx, x, y, 26);
    ctx.fillStyle = '#4a3a6a'; ctx.fillRect(x - 26, y - 34, 52, 34);
    ctx.fillStyle = '#6a5a9a'; ctx.fillRect(x - 28, y - 42, 56, 12);
    ctx.fillStyle = '#f0c860'; ctx.fillRect(x - 4, y - 32, 8, 10); ctx.fillRect(x - 26, y - 20, 52, 3);
  },
  drawTrunk(ctx, x, y, s) {
    ctx.fillStyle = 'rgba(0,30,20,0.3)'; ctx.beginPath(); ctx.ellipse(x + 10, y + 4, 34 * s, 12 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a3326'; ctx.fillRect(x - 12 * s, y - 150 * s, 24 * s, 150 * s);
    ctx.fillStyle = '#5e4232'; ctx.fillRect(x - 12 * s, y - 150 * s, 8 * s, 150 * s);
    ctx.fillStyle = '#3a271c';
    for (let i = 0; i < 6; i++) ctx.fillRect(x - 6 * s + (i % 2) * 8 * s, y - 140 * s + i * 22 * s, 6 * s, 10 * s);
  },
  drawCanopy(ctx, x, y, s, t) {
    const sw = Math.sin(t * 0.8 + x) * 3 * s;
    const cy = y - 170 * s;
    ctx.fillStyle = 'rgba(0,25,30,0.28)';
    ctx.beginPath(); ctx.ellipse(x + 60 * s, y + 10, 120 * s, 50 * s, 0, 0, Math.PI * 2); ctx.fill();
    const blobs = [[-50, 10, 60], [40, 20, 64], [0, -30, 70], [-20, 40, 56], [60, -20, 50], [-70, -20, 44]];
    for (const [bx, by, r] of blobs) { ctx.fillStyle = '#1f5a50'; ctx.beginPath(); ctx.arc(x + bx * s + sw, cy + by * s + 6, r * s, 0, Math.PI * 2); ctx.fill(); }
    for (const [bx, by, r] of blobs) { ctx.fillStyle = '#2c7462'; ctx.beginPath(); ctx.arc(x + bx * s + sw - 6, cy + by * s - 4, r * s * 0.8, 0, Math.PI * 2); ctx.fill(); }
    for (const [bx, by, r] of blobs) { ctx.fillStyle = '#3f8f72'; ctx.beginPath(); ctx.arc(x + bx * s + sw - 14, cy + by * s - 14, r * s * 0.42, 0, Math.PI * 2); ctx.fill(); }
  },
  drawHouse(ctx, x, y, v) {
    ctx.fillStyle = 'rgba(0,30,20,0.3)'; ctx.fillRect(x - 70, y - 6, 150, 18);
    ctx.fillStyle = v ? '#d8c8a8' : '#e4d4b0'; ctx.fillRect(x - 64, y - 90, 128, 90);
    ctx.fillStyle = '#6e4a32'; for (const dx of [-64, -4, 58]) ctx.fillRect(x + dx, y - 90, 6, 90);
    ctx.fillStyle = '#5a3a28'; ctx.fillRect(x - 14, y - 46, 28, 46);
    ctx.fillStyle = '#ffd88a'; ctx.fillRect(x - 46, y - 64, 20, 18); ctx.fillRect(x + 26, y - 64, 20, 18);
    ctx.fillStyle = v ? '#8a3a32' : '#3a5a8a';
    ctx.beginPath(); ctx.moveTo(x - 84, y - 86); ctx.lineTo(x, y - 150); ctx.lineTo(x + 84, y - 86); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.moveTo(x, y - 150); ctx.lineTo(x + 84, y - 86); ctx.lineTo(x, y - 86); ctx.fill();
  },
  drawWell(ctx, x, y) {
    ctx.fillStyle = 'rgba(0,30,20,0.3)'; ctx.beginPath(); ctx.ellipse(x, y + 4, 40, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7a7a80'; ctx.fillRect(x - 32, y - 30, 64, 30);
    ctx.fillStyle = '#2a3a4a'; ctx.beginPath(); ctx.ellipse(x, y - 30, 32, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5e4024'; ctx.fillRect(x - 30, y - 80, 6, 50); ctx.fillRect(x + 24, y - 80, 6, 50);
    ctx.fillStyle = '#8a3a32'; ctx.beginPath(); ctx.moveTo(x - 40, y - 76); ctx.lineTo(x, y - 100); ctx.lineTo(x + 40, y - 76); ctx.fill();
  },
  drawChest(ctx, x, y, open) {
    this.shadow(ctx, x, y, 24);
    ctx.fillStyle = '#7a4e2a'; ctx.fillRect(x - 22, y - 26, 44, 26);
    ctx.fillStyle = '#d0a645'; ctx.fillRect(x - 22, y - 16, 44, 4); ctx.fillRect(x - 4, y - 20, 8, 10);
    ctx.fillStyle = '#2b1d16'; ctx.lineWidth = 2; ctx.strokeStyle = '#2b1d16'; ctx.strokeRect(x - 22, y - 26, 44, 26);
    if (open) { ctx.fillStyle = '#5e3a20'; ctx.fillRect(x - 22, y - 40, 44, 14); ctx.strokeRect(x - 22, y - 40, 44, 14); }
    else {
      ctx.fillStyle = '#8a5a34'; ctx.beginPath(); ctx.ellipse(x, y - 26, 22, 10, 0, Math.PI, 0); ctx.fill(); ctx.stroke();
      const a = 0.4 + Math.sin(this.t * 4) * 0.3;
      ctx.fillStyle = `rgba(255,230,120,${a})`; ctx.fillRect(x - 2, y - 44, 4, 8);
    }
  },
};

// ---------- 09_scenes.js
// ===== 09_scenes.js : 타이틀 / 전투 전 팝업 / 보상 / 이벤트 / 상점 / 휴식 / 고목 / 결과 / 전략 편집 =====

function randomSeed() { return (Math.random() * 1e9) >>> 0; }

// ---------------------------------------------------------------- 타이틀
const TitleScene = {
  enter() {
    this.t = 0;
    this.seed = randomSeed();
    const ui = Game.ui;
    const box = el('div', 'title-box');
    box.appendChild(el('div', 'title-logo', '숲속 원정대'));
    box.appendChild(el('div', 'title-sub', '고블린 굴의 주인들'));
    const col = el('div', 'btn-col');
    col.appendChild(btn('원정 시작', 'primary big', () => this.start(this.seed), { id: 'btn-start' }));
    col.appendChild(btn('시드 입력', '', () => this.seedDialog(), { id: 'btn-seed' }));
    col.appendChild(btn('규칙 안내', '', () => showRulesHelp(), { id: 'btn-title-help' }));
    this.soundBtn = btn(`효과음: ${Game.settings.sound ? '켬' : '끔'}`, '', () => {
      Game.settings.sound = !Game.settings.sound; Sfx.enabled = Game.settings.sound; Game.saveSettings();
      this.soundBtn.innerHTML = `효과음: ${Game.settings.sound ? '켬' : '끔'}`;
    }, { id: 'btn-sound' });
    col.appendChild(this.soundBtn);
    box.appendChild(col);
    this.seedLabel = el('div', 'title-seed', `시드 ${this.seed}`);
    box.appendChild(this.seedLabel);
    ui.appendChild(box);
  },
  seedDialog() {
    const box = el('div', 'confirm-box');
    box.appendChild(el('div', 'modal-title', '시드 입력'));
    box.appendChild(el('p', '', '같은 시드는 같은 지도·전투 결과를 만듭니다.'));
    const inp = el('input', 'seed-input');
    inp.type = 'number'; inp.value = this.seed; inp.id = 'seed-input';
    box.appendChild(inp);
    const row = el('div', 'btn-row');
    row.appendChild(btn('취소', 'ghost', () => Game.closeModal(), { sfx: 'back', id: 'seed-cancel' }));
    row.appendChild(btn('적용', 'primary', () => {
      const v = parseInt(inp.value, 10);
      if (!isFinite(v) || v < 0) { Game.toast('0 이상의 숫자를 입력하세요.'); return; }
      this.seed = v >>> 0; this.seedLabel.textContent = `시드 ${this.seed}`; Game.closeModal();
    }, { id: 'seed-ok' }));
    box.appendChild(row);
    Game.modal(box, { dim: true, closeOnBg: true });
  },
  start(seed) {
    Sfx.init(); Sfx.resume();
    Game.run = newRun(seed);
    Game.go('field');
  },
  update(dt) { this.t += dt; },
  render(ctx) {
    const t = this.t;
    drawDungeonBackdrop(ctx, t, 0.1);
    const g = ctx.createLinearGradient(0, 300, 0, 540);
    g.addColorStop(0, 'rgba(30,80,70,0)'); g.addColorStop(1, 'rgba(30,80,70,0.7)');
    ctx.fillStyle = g; ctx.fillRect(0, 300, 960, 240);
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(480, 470, 360, 26, 0, 0, Math.PI * 2); ctx.fill();
    const order = ['priest', 'mage', 'archer', 'sword', 'knight'];
    order.forEach((sp, i) => drawSprite(ctx, sp, 200 + i * 75, 470, { scale: 3, t, phase: i, blinking: ((t + i * 0.7) % 3.5) < 0.12 }));
    drawSprite(ctx, 'goblin', 650, 470, { scale: 3, t, flip: true, phase: 2 });
    drawSprite(ctx, 'ogreChief', 760, 470, { scale: 4, t, flip: true, phase: 5 });
  },
};

// ---------------------------------------------------------------- 전투 전 팝업
function openPreBattle(node) {
  const run = Game.run;
  const waves = encounterFor(node);
  const box = el('div', 'prebattle-box');
  box.appendChild(el('div', 'modal-title', node.type === 'boss' ? '보스 — ' + ENEMIES[encounterFor(node)[0][0]].name : node.type === 'elite' ? '정예 전투' : '전투'));
  const wl = el('div', 'pb-waves');
  waves.forEach((w, i) => {
    const row = el('div', 'pb-wave');
    row.appendChild(el('span', 'pb-wlab', `${i + 1}웨이브`));
    for (const id of w) {
      const c = el('div', 'pb-enemy');
      c.appendChild(portraitCanvas(ENEMIES[id].sprite, 34, { flip: true }));
      c.appendChild(el('span', '', ENEMIES[id].name));
      row.appendChild(c);
    }
    wl.appendChild(row);
  });
  box.appendChild(wl);
  const tips = [];
  if (waves.flat().some((id) => ENEMIES[id].abilities.includes('charge'))) tips.push('차지 공격: 기절로 끊을 수 있다');
  if (waves.flat().includes('goblin_caller')) tips.push('나팔수: 동료를 부른다');
  if (run.fruit) tips.push(`고목의 열매: 공격력 +${Math.round(run.fruit.bonus * 100)}% (남은 전투 ${run.fruit.battles})`);
  if (run.torch <= 0) tips.push('횃불이 꺼졌다: 치명타 확률 감소');
  if (tips.length) box.appendChild(el('div', 'pb-tips', tips.map((x) => '• ' + x).join('<br>')));
  const mode = el('div', 'pb-mode');
  mode.appendChild(el('span', '', '전투 방식'));
  const seg = el('div', 'seg');
  const a = btn('자동', 'seg-btn' + (run.autoMode ? ' on' : ''), () => { run.autoMode = true; a.classList.add('on'); m.classList.remove('on'); }, { id: 'pb-auto' });
  const m = btn('수동', 'seg-btn' + (!run.autoMode ? ' on' : ''), () => { run.autoMode = false; m.classList.add('on'); a.classList.remove('on'); }, { id: 'pb-manual' });
  seg.appendChild(a); seg.appendChild(m);
  mode.appendChild(seg);
  box.appendChild(mode);
  const row = el('div', 'btn-row');
  row.appendChild(btn('⚙ 전략 편집', '', () => openStrategyEditor(run, () => openPreBattle(node)), { id: 'pb-strategy' }));
  row.appendChild(btn('⚔ 전투 시작', 'primary', () => { Game.closeModal(); Game.go('battle', { node }); }, { id: 'pb-start', sfx: 'skill' }));
  box.appendChild(row);
  Game.modal(box, { dim: true });
}

// ---------------------------------------------------------------- 보상 (3택1)
const RewardScene = {
  enter(params) {
    const run = Game.run;
    const node = params.node;
    const rng = makeRng(hashSeed(run.seed, 'reward', node.stage, node.row, run.stats.battles));
    const gr = node.type === 'elite' ? REWARD.goldElite : REWARD.goldBattle;
    const gold = rng.int(gr[0], gr[1]) + (params.bonusGold || 0);
    run.gold += gold;
    this.t = 0;
    const ui = Game.ui;
    const box = el('div', 'reward-box');
    box.appendChild(el('div', 'scene-title', node.type === 'elite' ? '정예 격파!' : '전투 승리!'));
    box.appendChild(el('div', 'reward-gold', `골드 +${gold} <small>(보유 ${run.gold})</small>`));
    if (run.lastLoot) { box.appendChild(el('div', 'reward-loot', `💎 강화석 +${run.lastLoot.stones}${run.lastLoot.got.length ? ' · 획득 ' + lootHtml(run.lastLoot.got) : ''}`)); run.lastLoot = null; }
    if (params.goldOnly) {
      box.appendChild(el('p', 'muted', '고블린의 보따리에서 골드를 챙겼다.'));
      box.appendChild(btn('계속 ▶', 'primary big', () => Game.go('map'), { id: 'btn-continue' }));
      ui.appendChild(box);
      return;
    }
    box.appendChild(el('div', 'reward-sub', '보상을 하나 고르세요'));
    const options = this.makeOptions(run, rng, node.type === 'elite');
    const cards = el('div', 'reward-cards');
    let chosen = null;
    const confirm = btn('선택 확정', 'primary big', () => {
      if (!chosen) return;
      chosen.apply();
      Sfx.play('coin');
      Game.toast(chosen.title + ' 획득!');
      Game.go('map');
    }, { id: 'btn-reward-confirm' });
    confirm.disabled = true;
    options.forEach((o, i) => {
      const c = el('button', 'rcard rc-' + o.kind);
      c.type = 'button';
      c.id = 'reward-' + i;
      c.innerHTML = `<div class="rc-kind">${o.kindName}</div><div class="rc-icon">${o.icon}</div><div class="rc-title">${o.title}</div><div class="rc-desc">${o.desc}</div>`;
      if (o.item) { const ic = c.querySelector('.rc-icon'); ic.innerHTML = ''; ic.appendChild(itemIcon(o.item, 44)); }
      c.addEventListener('click', () => {
        Sfx.play('click');
        chosen = o;
        cards.querySelectorAll('.rcard').forEach((x) => x.classList.remove('sel'));
        c.classList.add('sel');
        confirm.disabled = false;
      });
      cards.appendChild(c);
    });
    box.appendChild(cards);
    const row = el('div', 'btn-row');
    row.appendChild(btn('건너뛰기', 'ghost', () => Game.go('map'), { sfx: 'back', id: 'btn-reward-skip' }));
    row.appendChild(confirm);
    box.appendChild(row);
    ui.appendChild(box);
    ui.appendChild(partyPanel(run, { compact: true }));
  },
  makeOptions(run, rng, elite) {
    const opts = [];
    // 1) 스킬 강화
    const alive = partyIds(run).filter((id) => !run.heroes[id].dead);
    if (alive.length) {
      const hid = rng.pick(alive);
      const slot = rng.pick(['s1', 's2', 'ult']);
      const kind = slot === 'ult' || rng() < 0.5 ? 'power' : 'cd';
      const def = HEROES[hid];
      const sk = SKILLS[slot === 'ult' ? def.ult : def.skills[slot === 's1' ? 0 : 1]];
      opts.push({
        kind: 'skill', kindName: '스킬 강화', icon: '★',
        title: `${def.name}: ${sk.name}`,
        desc: kind === 'power' ? `위력/회복 +${REWARD.skillUpgradePower * 100}%` : `쿨타임 -${Math.round((1 - REWARD.skillUpgradeCd) * 100)}%`,
        apply: () => { const u = run.heroes[hid].upgrades[slot] || (run.heroes[hid].upgrades[slot] = { power: 0, cd: 0 }); u[kind]++; },
      });
    }
    // 2) 유물
    const avail = Object.keys(RELICS).filter((r) => !run.relics.includes(r));
    if (avail.length) {
      const rid = rng.pick(avail);
      opts.push({ kind: 'relic', kindName: '유물', icon: RELICS[rid].icon, title: RELICS[rid].name, desc: RELICS[rid].desc, apply: () => run.relics.push(rid) });
    } else opts.push({ kind: 'gold', kindName: '골드', icon: '●', title: '금화 주머니', desc: '골드 +60', apply: () => { run.gold += 60; } });
    // 3) 장비 (일반 전투 절반 확률) 또는 회복약
    if (!elite && rng() < 0.5) {
      const p = Game.profile;
      const it = EQ.dropItem(rng, p, 'battle', run.tier, partyIds(run));
      const base = EQ.BASE[it.base];
      opts.push({ kind: 'equip', kindName: `장비 · ${it.grade}`, icon: '', item: it, title: EQ.itemName(it),
        desc: `${EQ.SLOT_NAME[base.slot]} · ${EQ.mainStats(it).map((m) => EQ.fmtStat(m.stat, m.v)).join(', ')}${it.opts.length ? ` 외 옵션 ${it.opts.length}` : ''}${it.passive ? `<br>「${EQ.PASSIVE[it.passive.key].name}」` : ''}`,
        apply: () => { p.inv.push(it); run.loot.push({ kind: 'item', uid: it.uid }); saveProfile(); } });
      return opts;
    }
    const n = elite ? 2 : 1;
    opts.push({ kind: 'potion', kindName: '회복약', icon: '🧪', title: `회복약 ×${n}`, desc: `아군 1명 HP ${REWARD.potionHealPct * 100}% 회복. 전투 중에도 사용 가능.`, apply: () => { run.potions += n; } });
    return opts;
  },
  update(dt) { this.t += dt; },
  render(ctx) { drawDungeonBackdrop(ctx, this.t, 0.6); },
};

// ---------------------------------------------------------------- 이벤트
const EVENT_EFFECTS = {
  leave: () => ({ text: '조용히 발걸음을 옮겼다.' }),
  cart_search: (run, rng) => {
    if (rng() < 0.55) { run.food += 2; run.gold += 30; return { text: '짐칸 밑에서 보급품을 찾았다! 식량 +2, 골드 +30', good: true }; }
    const h = frontAliveHero(run);
    const dmg = Math.round(h.maxHp * 0.25);
    h.hp = Math.max(1, h.hp - dmg);
    return { text: `찰칵! 덫이 튀어나왔다. ${HEROES[h.id].name} HP -${dmg}`, bad: true };
  },
  cart_tank: (run) => {
    const h = run.heroes.tobi;
    const dmg = Math.round(h.maxHp * 0.12);
    h.hp = Math.max(1, h.hp - dmg);
    run.food += 2; run.gold += 30;
    return { text: `토비가 방패로 덫을 막아냈다 (HP -${dmg}). 식량 +2, 골드 +30`, good: true };
  },
  well_coin: (run, rng) => {
    run.gold -= 20;
    const r = rng();
    const avail = Object.keys(RELICS).filter((x) => !run.relics.includes(x));
    if (r < 0.35 && avail.length) { const id = rng.pick(avail); run.relics.push(id); return { text: `우물 바닥이 빛났다. 유물 「${RELICS[id].name}」 획득!`, good: true }; }
    if (r < 0.75) { const h = rng.pick(partyAlive(run)); h.hp = h.maxHp; return { text: `${HEROES[h.id].name}의 상처가 씻은 듯 나았다! (HP 최대)`, good: true }; }
    return { text: '퐁당… 아무 일도 일어나지 않았다.' };
  },
  well_drink: (run, rng) => {
    if (rng() < 0.55) { for (const h of partyAlive(run)) h.hp = Math.min(h.maxHp, h.hp + h.maxHp * 0.25); return { text: '맑고 시원한 물! 파티 HP 25% 회복', good: true }; }
    const h = rng.pick(partyAlive(run));
    const dmg = Math.round(h.maxHp * 0.18);
    h.hp = Math.max(1, h.hp - dmg);
    return { text: `차가운 저주가 스며들었다… ${HEROES[h.id].name} HP -${dmg}`, bad: true };
  },
  gm_trade: (run, rng) => {
    run.gold -= 45;
    const avail = Object.keys(RELICS).filter((x) => !run.relics.includes(x));
    if (avail.length) { const id = rng.pick(avail); run.relics.push(id); return { text: `"반짝이! 좋은 거래!" 유물 「${RELICS[id].name}」 획득`, good: true }; }
    run.potions += 2;
    return { text: '"반짝이 다 팔림! 대신 물약!" 회복약 +2', good: true };
  },
  gm_fight: () => ({ text: '"싸움! 좋아!" 고블린이 호루라기를 불었다!', battle: [['goblin', 'goblin_caller', 'goblin']] }),
  wd_food: (run) => {
    run.food -= 1; run.potions += 1; run.gold += 40; run.torch = Math.min(CONST.TORCH_MAX, run.torch + 30);
    return { text: '정찰병이 고마워하며 짐을 나눠줬다. 회복약 +1, 골드 +40, 횃불 +30', good: true };
  },
  wd_heal: (run, rng) => {
    const b = run.heroes.bori;
    const cost = Math.round(b.maxHp * 0.2);
    b.hp = Math.max(1, b.hp - cost);
    const alive = partyIds(run).filter((id) => !run.heroes[id].dead);
    const hid = rng.pick(alive);
    const slot = rng.pick(['s1', 's2']);
    const u = run.heroes[hid].upgrades[slot] || (run.heroes[hid].upgrades[slot] = { power: 0, cd: 0 });
    u.power++;
    const sk = SKILLS[HEROES[hid].skills[slot === 's1' ? 0 : 1]];
    return { text: `보리의 치유 (HP -${cost}). 정찰병이 비법을 알려줬다: ${HEROES[hid].name}「${sk.name}」 위력 +30%`, good: true };
  },
};
function frontAliveHero(run) { return partyAlive(run)[0] || null; }

const EventScene = {
  enter(params) {
    const run = Game.run;
    this.node = params.node;
    this.ev = EVENTS[params.node.event];
    this.t = 0;
    const ui = Game.ui;
    const box = el('div', 'event-box');

    box.appendChild(el('div', 'event-text', this.ev.text));
    const col = el('div', 'btn-col event-choices');

      if (c.require && (!run.party.includes(c.require) || run.heroes[c.require].dead)) why = `${HEROES[c.require].name}이(가) 파티에 없다`;
      if (c.cost && c.cost.gold && run.gold < c.cost.gold) why = '골드 부족';
      if (c.cost && c.cost.food && run.food < c.cost.food) why = '식량 부족';
      const b = btn(`${c.label}${c.hint ? `<small>${c.hint}</small>` : ''}${why ? `<small class="warn">${why}</small>` : ''}`, 'choice', () => this.choose(c), { id: 'event-choice-' + i });

      col.appendChild(b);
    });
    box.appendChild(col);
    ui.appendChild(box);
    ui.appendChild(resourceBar(run));
  },
  choose(c) {
    const run = Game.run;
    const rng = makeRng(hashSeed(run.seed, 'event', this.node.stage, this.node.row, c.outcome));
    const res = EVENT_EFFECTS[c.outcome](run, rng);

    ui.innerHTML = '';

      box.appendChild(btn('⚔ 전투!', 'primary big', () => {

    ui.appendChild(box);
    ui.appendChild(resourceBar(run));
    ui.appendChild(partyPanel(run, { compact: true }));
    Sfx.play(res.bad ? 'hit' : 'coin');
  },
  update(dt) { this.t += dt; },
  render(ctx) {
    drawDungeonBackdrop(ctx, this.t, 0.4);
    drawEventArt(ctx, this.ev.art, 230, 400, this.t);

};

function drawEventArt(ctx, art, x, y, t) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(x, y + 4, 150, 22, 0, 0, Math.PI * 2); ctx.fill();
  if (art === 'cart') {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.12);
    ctx.fillStyle = '#7a4e2a'; ctx.fillRect(-110, -90, 200, 60);
    ctx.fillStyle = '#5e3a20'; for (let i = 0; i < 5; i++) ctx.fillRect(-110 + i * 44, -90, 6, 60);
    ctx.fillStyle = '#c9a77a'; ctx.fillRect(-90, -120, 60, 32); ctx.fillRect(-20, -112, 50, 24);
    ctx.restore();
    ctx.strokeStyle = '#3a2418'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(x - 70, y - 20, 26, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 80, y - 6, 26, 0.4, Math.PI * 1.2); ctx.stroke();
    ctx.fillStyle = `rgba(255,220,120,${0.5 + Math.sin(t * 5) * 0.4})`; ctx.fillRect(x - 40, y - 128, 6, 6);
  } else if (art === 'well') {
    ctx.fillStyle = '#6a6a74'; ctx.fillRect(x - 80, y - 70, 160, 70);
    ctx.fillStyle = '#4e4e58'; for (let i = 0; i < 4; i++) ctx.fillRect(x - 80, y - 70 + i * 18, 160, 3);
    ctx.fillStyle = '#10202a'; ctx.beginPath(); ctx.ellipse(x, y - 70, 80, 20, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(120,220,200,${0.3 + Math.sin(t * 2) * 0.2})`; ctx.beginPath(); ctx.ellipse(x, y - 70, 50, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a7a4a'; ctx.fillRect(x - 84, y - 74, 30, 8); ctx.fillRect(x + 40, y - 30, 26, 6);
    ctx.font = 'italic 16px serif'; ctx.fillStyle = `rgba(180,240,230,${0.4 + Math.sin(t * 1.3) * 0.4})`; ctx.textAlign = 'center'; ctx.fillText('…소원…', x + Math.sin(t) * 10, y - 120);
  } else if (art === 'gmerchant') {
    ctx.fillStyle = '#8a6448'; ctx.beginPath(); ctx.ellipse(x + 50, y - 40, 50, 42, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d0a645'; ctx.fillRect(x + 30, y - 70, 8, 8); ctx.fillRect(x + 60, y - 50, 6, 6);
    drawSprite(ctx, 'goblin', x - 40, y, { scale: 5, t, flip: true });
  } else if (art === 'wounded') {
    drawSprite(ctx, 'archer', x, y, { scale: 5, t: t * 0.3, blinking: (t % 3) < 1.2, squash: 0.9 });
    ctx.fillStyle = '#efe6d4'; ctx.fillRect(x - 30, y - 60, 22, 6);
    ctx.fillStyle = '#b8403a'; ctx.fillRect(x - 24, y - 60, 6, 6);
  }
}

const ShopScene = {
  enter(params) {
    const run = Game.run;
    this.node = params.node;
    this.t = 0;
    const rng = makeRng(hashSeed(run.seed, 'shop', params.node.stage, params.node.row));
    const relicPool = rng.shuffle(Object.keys(RELICS).filter((r) => !run.relics.includes(r)));
    this.stock = [
      { key: 'potion', name: SHOP_ITEMS.potion.name, icon: '🧪', price: SHOP_ITEMS.potion.price, desc: SHOP_ITEMS.potion.desc, qty: 3 },
      { key: 'food', name: SHOP_ITEMS.food.name, icon: '🍞', price: SHOP_ITEMS.food.price, desc: SHOP_ITEMS.food.desc, qty: 3 },
      { key: 'torch', name: SHOP_ITEMS.torch.name, icon: '🔥', price: SHOP_ITEMS.torch.price, desc: SHOP_ITEMS.torch.desc, qty: 2 },
    ];
    for (const rid of relicPool.slice(0, 2)) this.stock.push({ key: 'relic', relic: rid, name: RELICS[rid].name, icon: RELICS[rid].icon, price: RELICS[rid].price, desc: RELICS[rid].desc, qty: 1 });
    this.build();
  },
  build() {
    const run = Game.run;
    const ui = Game.ui;
    ui.innerHTML = '';
    const box = el('div', 'shop-box');
    box.appendChild(el('div', 'scene-title', '던전 상인 <small>"골드만 있으면 뭐든지!"</small>'));
    const list = el('div', 'shop-list');
    this.stock.forEach((it, i) => {
      const row = el('div', 'shop-item' + (it.qty <= 0 ? ' soldout' : ''));
      row.appendChild(el('div', 'si-icon', it.icon));
      row.appendChild(el('div', 'si-info', `<b>${it.name}</b><small>${it.desc}</small>`));
      const b = btn(it.qty <= 0 ? '품절' : `● ${it.price}`, 'buy', () => this.buy(it), { id: 'shop-buy-' + i, sfx: 'coin' });
      if (it.qty <= 0 || run.gold < it.price) b.disabled = true;
      row.appendChild(b);
      list.appendChild(row);
    });
    box.appendChild(list);
    const row = el('div', 'btn-row');
    row.appendChild(btn('🧪 회복약 사용', '', () => usePotionFlow(run, () => this.build()), { id: 'shop-usepotion' }));
    row.appendChild(btn('떠나기 ▶', 'primary', () => Game.go('map'), { id: 'btn-continue' }));
    box.appendChild(row);
    ui.appendChild(box);
    ui.appendChild(resourceBar(run));
  },
  buy(it) {
    const run = Game.run;
    if (run.gold < it.price || it.qty <= 0) return;
    run.gold -= it.price;
    it.qty--;
    if (it.key === 'potion') run.potions++;
    else if (it.key === 'food') run.food++;
    else if (it.key === 'torch') run.torch = Math.min(CONST.TORCH_MAX, run.torch + 40);
    else if (it.key === 'relic') run.relics.push(it.relic);
    Game.toast(`${it.name} 구입!`, 1000);
    this.build();
  },
  update(dt) { this.t += dt; },
  render(ctx) {
    drawDungeonBackdrop(ctx, this.t, 0.4);
    ctx.fillStyle = '#5e4024'; ctx.fillRect(40, 380, 250, 20);
    drawSprite(ctx, 'goblinHorn', 165, 382, { scale: 5, t: this.t, blinking: (this.t % 4) < 0.12 });
    ctx.fillStyle = '#7a4e2a'; ctx.fillRect(40, 392, 250, 70);
    ctx.fillStyle = '#d0a645'; ctx.fillRect(40, 392, 250, 6);
  },
};

const RestScene = {
  enter() {
    this.t = 0;
    this.rested = false;
    this.build();
  },
  build() {
    const run = Game.run;
    const ui = Game.ui;
    ui.innerHTML = '';
    const box = el('div', 'rest-box');
    box.appendChild(el('div', 'scene-title', '캠프 <small>모닥불 앞에서 잠시 쉬어간다</small>'));
    if (!this.rested) {
      const col = el('div', 'btn-col');
      const eat = btn(`🍞 식량 1개로 휴식 <small>살아있는 동료 HP ${CONST.REST_HEAL_PCT * 100}% 회복 · 횃불 +${CONST.TORCH_REST_GAIN}</small>`, 'choice', () => this.rest(true), { id: 'rest-food' });
      if (run.food <= 0) eat.disabled = true;
      col.appendChild(eat);
      col.appendChild(btn(`굶고 쉬기 <small>HP ${CONST.REST_HUNGRY_HEAL_PCT * 100}% 회복 · 횃불 +${CONST.TORCH_REST_GAIN}</small>`, 'choice', () => this.rest(false), { id: 'rest-hungry' }));
      box.appendChild(col);
    } else box.appendChild(el('div', 'event-result good', this.msg));
    const row = el('div', 'btn-row');
    row.appendChild(btn('⚙ 전략 편집', '', () => openStrategyEditor(run), { id: 'rest-strategy' }));
    row.appendChild(btn('🎒 장비', '', () => openInventory({ onClose: () => this.build() }), { id: 'rest-inv' }));
    row.appendChild(btn('🧪 회복약', '', () => usePotionFlow(run, () => this.build()), { id: 'rest-potion' }));
    row.appendChild(btn(this.rested ? '출발 ▶' : '쉬지 않고 출발', this.rested ? 'primary' : 'ghost', () => Game.go('map'), { id: 'btn-continue' }));
    box.appendChild(row);
    ui.appendChild(box);
    ui.appendChild(resourceBar(run));
    ui.appendChild(partyPanel(run, { compact: true }));
  },
  rest(withFood) {
    const run = Game.run;
    const pct = withFood ? CONST.REST_HEAL_PCT : CONST.REST_HUNGRY_HEAL_PCT;
    if (withFood) run.food--;
    for (const h of partyAlive(run)) h.hp = Math.min(h.maxHp, h.hp + h.maxHp * pct);
    run.torch = Math.min(CONST.TORCH_MAX, run.torch + CONST.TORCH_REST_GAIN);
    this.rested = true;
    this.msg = withFood ? `따뜻한 식사와 휴식. HP ${pct * 100}% 회복!` : `배가 고프지만 눈을 붙였다. HP ${pct * 100}% 회복`;
    Sfx.play('heal');
    this.build();
  },
  update(dt) { this.t += dt; },
  render(ctx) {
    const t = this.t;
    drawDungeonBackdrop(ctx, t, 0.7);
    const fx = 200, fy = 430;
    const g = ctx.createRadialGradient(fx, fy - 20, 10, fx, fy - 20, 220);
    g.addColorStop(0, 'rgba(255,170,80,0.5)'); g.addColorStop(1, 'rgba(255,170,80,0)');
    ctx.fillStyle = g; ctx.fillRect(fx - 220, fy - 240, 440, 440);
    ctx.fillStyle = '#5e4024'; ctx.fillRect(fx - 30, fy - 6, 60, 10);
    for (let i = 0; i < 6; i++) {
      const h = 20 + Math.sin(t * 10 + i * 1.7) * 8 + (i % 3) * 6;
      ctx.fillStyle = i % 2 ? '#ff9a3a' : '#ffd34a';
      ctx.fillRect(fx - 18 + i * 6, fy - 6 - h, 7, h);
    }
    const ids = partyIds(Game.run).filter((id) => !Game.run.heroes[id].dead);
    const seats = [[-105, 6, false], [95, 6, true], [-60, 34, false]]; // 모닥불 둘레 자리
    ids.forEach((id, i) => {
      const [dx, dy, flip] = seats[i % seats.length];
      drawSprite(ctx, HEROES[id].sprite, fx + dx, fy + dy, { scale: 3, t: t * 0.6, phase: i, flip, blinking: ((t + i) % 5) < 0.6 });
    });
  },
};

const TreeScene = {
  enter() {
    this.t = 0;
    this.deal = null;
    this.hero = null;
    this.done = false;
    this.build();
  },
  build() {
    const run = Game.run;
    const ui = Game.ui;
    ui.innerHTML = '';
    const box = el('div', 'tree-box');
    box.appendChild(el('div', 'scene-title', '피를 원하는 고목 <small>"피를… 나누면… 열매를…"</small>'));
    if (this.done) {
      box.appendChild(el('div', 'event-result good', this.msg));
      box.appendChild(btn('계속 ▶', 'primary big', () => Game.go('map'), { id: 'btn-continue' }));
    } else {
      const deals = el('div', 'tree-deals');
      TREE_DEALS.forEach((d) => {
        const b = btn(`<b>${d.label}</b><small>HP ${d.hpCost * 100}% 희생 → 공격력 +${d.atkBonus * 100}% (전투 ${d.battles}회)</small>`, 'choice' + (this.deal === d ? ' sel' : ''), () => { this.deal = d; this.hero = null; this.build(); }, { id: 'tree-deal-' + d.id });
        deals.appendChild(b);
      });
      box.appendChild(deals);
      if (this.deal) {
        box.appendChild(el('div', 'reward-sub', '누구의 피를 바칠까?'));
        const pp = partyPanel(run, { compact: true, onSelect: (id) => {
          const h = run.heroes[id];
          if (h.hp <= h.maxHp * this.deal.hpCost + 1) { Game.toast('HP가 부족해 거래할 수 없다.'); return; }
          this.hero = id; this.build();
        } });
        if (this.hero) pp.querySelector(`[data-hero="${this.hero}"]`).classList.add('sel');
        box.appendChild(pp);
      }
      const row = el('div', 'btn-row');
      row.appendChild(btn('떠난다', 'ghost', () => Game.go('map'), { sfx: 'back', id: 'tree-leave' }));
      const ok = btn('피의 거래', 'danger', () => this.confirm(), { id: 'tree-confirm' });
      if (!this.deal || !this.hero) ok.disabled = true;
      row.appendChild(ok);
      box.appendChild(row);
      if (run.fruit) box.appendChild(el('div', 'muted', `이미 열매 효과가 있다(+${Math.round(run.fruit.bonus * 100)}%, ${run.fruit.battles}회). 더 강한 효과만 남는다.`));
    }
    ui.appendChild(box);
    ui.appendChild(resourceBar(run));
  },
  confirm() {
    const run = Game.run;
    const h = run.heroes[this.hero];
    const cost = Math.round(h.maxHp * this.deal.hpCost);
    h.hp = Math.max(1, h.hp - cost);
    const prev = run.fruit;
    run.fruit = { bonus: Math.max(this.deal.atkBonus, prev ? prev.bonus : 0), battles: Math.max(this.deal.battles, prev ? prev.battles : 0) };
    this.msg = `${HEROES[this.hero].name}의 피(HP -${cost})를 마신 고목이 붉은 열매를 떨어뜨렸다. 다음 전투 ${run.fruit.battles}회 동안 공격력 +${Math.round(run.fruit.bonus * 100)}%!`;
    this.done = true;
    Sfx.play('phase');
    this.build();
  },
  update(dt) { this.t += dt; },
  render(ctx) {
    const t = this.t;
    drawDungeonBackdrop(ctx, t, 0.75);
    const x = 210, y = 470;
    ctx.fillStyle = 'rgba(120,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(x, y, 170, 30, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a2418'; ctx.fillRect(x - 30, y - 240, 60, 240);
    ctx.fillStyle = '#4e2e1c'; ctx.fillRect(x - 30, y - 240, 16, 240);
    for (const [bx, by, r] of [[-80, -250, 50], [60, -270, 60], [0, -300, 70], [-30, -220, 40], [90, -220, 40]]) {
      ctx.fillStyle = '#4a2030'; ctx.beginPath(); ctx.arc(x + bx + Math.sin(t + bx) * 3, y + by, r, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = 0; i < 6; i++) { const a = 0.6 + Math.sin(t * 3 + i) * 0.4; ctx.fillStyle = `rgba(230,40,60,${a})`; ctx.beginPath(); ctx.arc(x - 90 + i * 36, y - 230 + (i % 2) * 40, 7, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#ffd34a'; ctx.fillRect(x - 14, y - 150, 8, 4); ctx.fillRect(x + 8, y - 150, 8, 4);
    ctx.fillStyle = '#1a0a0a'; ctx.fillRect(x - 10, y - 120, 22, 8 + Math.sin(t * 2) * 3);
  },
};

    row.appendChild(btn('새 원정', 'primary', () => { Game.run = newRun(randomSeed()); Game.go('field'); }, { id: 'res-new' }));
    box.appendChild(row);
    ui.appendChild(box);
  },
  update(dt) { this.t += dt; },
  render(ctx) {
    const run = Game.run;
    drawDungeonBackdrop(ctx, this.t, 0.75);
    if (run.result === 'victory') {
      for (let i = 0; i < 30; i++) {
        const x = (i * 97 + this.t * 60 * (1 + i % 3)) % 960, y = (i * 53 + this.t * 90) % 540;
        ctx.fillStyle = ['#ffd34a', '#f4a7a0', '#7fd0b0', '#9fbaf0'][i % 4]; ctx.fillRect(x, y, 6, 4);

    }
  },
};

// ---------------------------------------------------------------- 자동 전략 편집
function openStrategyEditor(run, onClose) {
  let cur = partyIds(run).find((id) => !run.heroes[id].dead) || partyIds(run)[0];
  const box = el('div', 'strat-box');
  const render = () => {
    box.innerHTML = '';
    box.appendChild(el('div', 'modal-title', '자동 전략'));
    const tabs = el('div', 'strat-tabs');
    for (const id of partyIds(run)) {

      t.appendChild(el('span', '', `${HEROES[id].name} <small>${HEROES[id].roleName}</small>`));
      t.addEventListener('click', () => { Sfx.play('click'); cur = id; render(); });
