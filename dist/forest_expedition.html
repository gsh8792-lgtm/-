<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120e18">
<title>숲속 원정대: 고블린 굴</title>
<style>
/* ===== 숲속 원정대 : UI 스타일 (논리 해상도 960×540 기준) ===== */
:root {
  --bg: #120e18; --panel: #231c33; --panel2: #2e2545; --line: #4a3f68;
  --text: #f3ead8; --muted: #a99cc0; --gold: #ffd34a; --gold2: #c8962a;
  --red: #d6504a; --green: #6fd86a; --blue: #7ab8f0; --purple: #8a6af0;
  --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; overscroll-behavior: none; }
body { font-family: var(--font); color: var(--text); -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
#app { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: radial-gradient(ellipse at center, #1c1626 0%, #0b0810 100%); }
#stage { position: absolute; left: 0; top: 0; width: 960px; height: 540px; transform-origin: 0 0; overflow: hidden; background: #1d1828; box-shadow: 0 0 40px rgba(0,0,0,.6); }
#cv { position: absolute; inset: 0; width: 960px; height: 540px; touch-action: none; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui button, #ui select, #ui input, #ui .pcard, #ui .scroll { pointer-events: auto; }
canvas.pcv { display: block; }
#rotate { display: none; position: fixed; inset: 0; z-index: 99; background: rgba(10,8,16,.94); color: var(--text); font-size: 22px; text-align: center; padding-top: 40vh; line-height: 1.6; }
body.portrait #rotate { display: block; }
.hidden { display: none !important; }
.muted { color: var(--muted); font-size: 13px; }
.warn { color: #ff9a7a; }
small { font-size: .78em; color: var(--muted); font-weight: 500; }

/* ---------- 버튼 */
.btn { font-family: var(--font); font-size: 16px; font-weight: 700; color: var(--text); background: linear-gradient(#3a3058, #2b2343); border: 2px solid var(--line); border-radius: 12px; min-height: 64px; min-width: 64px; padding: 6px 16px; cursor: pointer; box-shadow: 0 3px 0 #120e1c; transition: transform .06s, filter .1s; touch-action: manipulation; white-space: nowrap; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #120e1c; }
.btn:disabled { opacity: .45; cursor: default; filter: grayscale(.6); }
.btn.primary { background: linear-gradient(#ffd96a, #e8a83a); color: #2b1d10; border-color: #fff0a0; }
.btn.danger { background: linear-gradient(#e0645a, #a8382f); border-color: #ff9a8a; }
.btn.ghost { background: rgba(30,24,46,.7); }
.btn.small { min-height: 64px; font-size: 15px; padding: 4px 14px; }
.btn.big { min-height: 68px; font-size: 19px; padding: 8px 26px; }
.btn.choice { display: flex; flex-direction: column; align-items: flex-start; text-align: left; white-space: normal; width: 100%; min-height: 64px; padding: 8px 16px; }
.btn.choice small { display: block; margin-top: 2px; }
.btn.choice.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
.btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.btn-col { display: flex; flex-direction: column; gap: 10px; }
.seg { display: inline-flex; background: #15111f; border: 2px solid var(--line); border-radius: 12px; padding: 2px; gap: 2px; }
.seg-btn { min-height: 64px; min-width: 66px; border: none; box-shadow: none; background: transparent; border-radius: 9px; padding: 4px 12px; color: var(--muted); }
.seg-btn.on { background: linear-gradient(#ffd96a, #e8a83a); color: #2b1d10; }

/* ---------- 바 */
.bar { height: 8px; background: rgba(0,0,0,.55); border-radius: 4px; overflow: hidden; border: 1px solid rgba(0,0,0,.6); }
.bar .fill { height: 100%; background: var(--green); transition: width .15s; }
.bar.hp.low .fill { background: #e0a040; }
.bar.hp.enemy .fill { background: #e0524a; }
.bar.ult .fill { background: #7ad0ff; }
.bar.ult.ready .fill { background: linear-gradient(90deg, #ffd34a, #fff0a0, #ffd34a); animation: glow 1s infinite alternate; }
.bar.torch { width: 70px; height: 10px; }
.bar.torch .fill { background: linear-gradient(90deg, #ff6a2a, #ffd34a); }
.bar.charge { height: 5px; }
.bar.charge .fill { background: #ff5a3a; transition: none; }
@keyframes glow { from { filter: brightness(1); } to { filter: brightness(1.5); } }

/* ---------- 모달 / 오버레이 */
.overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20; }
.overlay.show { display: flex; }
.overlay.dim { background: rgba(8,6,14,.62); }
.modal { box-sizing: border-box; max-width: 930px !important; background: linear-gradient(#2c2442, #1f1930); border: 2px solid var(--line); border-radius: 16px; padding: 16px 20px; max-width: 900px; max-height: 520px; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.6); animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-title { font-size: 21px; font-weight: 900; color: var(--gold); margin-bottom: 10px; }
.modal-title small { margin-left: 8px; }
.hint-box { width: 520px; }
.hint-title { color: var(--gold); font-weight: 900; font-size: 18px; margin-bottom: 6px; }
.hint-text { font-size: 17px; line-height: 1.55; margin-bottom: 14px; }
.hint-box .btn { width: 100%; }
.confirm-box { width: 460px; text-align: center; }
.confirm-box p { line-height: 1.5; font-size: 16px; }
.help-box { width: 820px; }
.help-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 15px; line-height: 1.5; }
.help-cols h4 { margin: 4px 0; color: var(--blue); }
.help-cols ul { margin: 0; padding-left: 18px; }
.help-box > .btn { display: block; margin: 12px auto 0; min-width: 160px; }
.pick-box { width: 640px; }
.pick-box > .btn { display: block; margin: 12px auto 0; }
.pause-box { width: 420px; }
.pause-box .btn-col .btn { width: 100%; }
.pause-stats { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
.seed-input { width: 100%; font-size: 22px; padding: 10px; border-radius: 10px; border: 2px solid var(--line); background: #15111f; color: var(--text); text-align: center; font-family: var(--font); }

/* 토스트 */
#toasts { position: absolute; left: 0; right: 0; top: 76px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 30; }
.toast { background: rgba(20,14,30,.92); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; font-size: 15px; font-weight: 700; animation: pop .15s; transition: opacity .4s, transform .4s; max-width: 640px; text-align: center; }
.toast.out { opacity: 0; transform: translateY(-10px); }

/* ---------- 파티 패널 / 자원 */
.party-panel { display: flex; gap: 6px; }
.pcard { position: relative; display: flex; align-items: center; gap: 6px; background: rgba(28,22,42,.92); border: 2px solid var(--line); border-radius: 10px; padding: 4px 8px 4px 4px; min-width: 150px; min-height: 52px; }
.pcard canvas { background: #3a3052; border-radius: 6px; }
.pcard .pinfo { flex: 1; min-width: 0; }
.pcard .pname { font-size: 13px; font-weight: 800; white-space: nowrap; }
.pcard .prole { font-size: 11px; color: var(--muted); margin-left: 4px; font-weight: 500; }
.pcard .bar { margin: 3px 0 2px; }
.pcard .php { font-size: 11px; color: var(--muted); }
.pcard .pup { position: absolute; right: 4px; top: 2px; font-size: 11px; color: var(--gold); }
.pcard.dead { opacity: .55; }
.pcard.dead .pname { text-decoration: line-through; }
.pcard.selectable { cursor: pointer; }
.pcard.selectable:hover, .pcard.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
.party-panel.compact .pcard { min-width: 0; flex: 1; }
.res-bar { display: flex; gap: 8px; align-items: center; }
.res { display: flex; align-items: center; gap: 5px; background: rgba(15,11,22,.85); border: 1px solid var(--line); border-radius: 9px; padding: 3px 9px; font-size: 15px; font-weight: 800; min-height: 32px; }
.res i { font-style: normal; font-size: 14px; }
.res.gold i { color: var(--gold); }
.res.torch.low .fill { background: #ff6a2a; }
.res.torch.dark { border-color: #ff5a3a; animation: glow .6s infinite alternate; }
.res.relics { gap: 3px; }
.relic-ic { font-size: 18px; cursor: pointer; pointer-events: auto; padding: 0 2px; position: relative; }
.relic-ic::after { content: ''; position: absolute; inset: -18px -8px; } /* 터치 영역 확장 */
.fruit-ic { font-size: 13px; color: #ff9ad0; }

/* ---------- 지도 */
.map-top { position: absolute; left: 10px; right: 10px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
.map-hdr { display: flex; justify-content: space-between; align-items: center; }
.map-title { font-size: 19px; font-weight: 900; color: var(--gold); text-shadow: 0 2px 0 #000; }
.map-nodes { position: absolute; inset: 0; }
.map-node { position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); background: var(--nc); color: #fff; font-family: var(--font); font-size: 22px; font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,.5); cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.4); }
.map-node.t-boss { width: 88px; height: 88px; margin: -44px 0 0 -44px; font-size: 32px; border-color: #ffb0a0; }
.map-node.locked { filter: brightness(.55) saturate(.6); }
.map-node.visited { filter: brightness(.7); border-color: var(--gold); }
.map-node.current { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255,211,74,.4), 0 4px 0 rgba(0,0,0,.4); filter: none; }
.map-node.reachable { border-color: #fff0a0; animation: nodePulse 1.1s infinite; filter: none; }
@keyframes nodePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,230,140,.7), 0 4px 0 rgba(0,0,0,.4); } 50% { box-shadow: 0 0 0 9px rgba(255,230,140,0), 0 4px 0 rgba(0,0,0,.4); } }
.stage-num { position: absolute; top: 156px; transform: translateX(-50%); font-size: 18px; font-weight: 900; color: var(--muted); }
.stage-num.next { color: var(--gold); }
.map-legend { position: absolute; left: 12px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); max-width: 640px; }
.map-legend b { display: inline-block; width: 20px; height: 20px; border-radius: 50%; text-align: center; color: #fff; line-height: 20px; font-size: 12px; margin-right: 4px; }
.map-actions { position: absolute; right: 10px; bottom: 8px; display: flex; gap: 6px; }
.map-info { position: absolute; right: 10px; top: 168px; width: 300px; background: rgba(28,22,42,.96); border: 2px solid var(--gold2); border-radius: 12px; padding: 10px 12px; pointer-events: auto; box-shadow: 0 8px 20px rgba(0,0,0,.5); z-index: 5; }
.map-info.left { right: auto; left: 10px; }
.mi-title { font-size: 18px; font-weight: 900; }
.mi-title b { display: inline-block; width: 28px; height: 28px; border-radius: 50%; text-align: center; line-height: 28px; margin-right: 4px; }
.mi-desc { font-size: 14px; line-height: 1.45; margin: 6px 0; color: #e6dcf0; }
.mi-warn { color: #ff9a7a; font-size: 13px; margin-bottom: 4px; }
.mi-locked { color: var(--muted); font-size: 13px; align-self: center; }
.mi-btns { display: flex; gap: 8px; justify-content: flex-end; }

/* ---------- 전투 */
.b-top { position: absolute; left: 0; right: 0; top: 0; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: linear-gradient(rgba(14,10,22,.92), rgba(14,10,22,.6)); }
.b-stage { font-size: 16px; font-weight: 800; min-width: 220px; }
.b-pause { min-height: 64px; font-size: 16px; background: transparent; border-color: transparent; box-shadow: none; }
.b-pause .pz { letter-spacing: -2px; margin-right: 4px; }
.b-right { display: flex; gap: 6px; align-items: center; min-width: 220px; justify-content: flex-end; }
.b-right .btn.small { min-height: 64px; min-width: 64px; padding: 2px 10px; }
.b-speed.on { border-color: var(--gold); color: var(--gold); }
.b-chips { position: absolute; top: 72px; right: 8px; left: 230px; display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
.chips-label { font-size: 14px; font-weight: 800; color: var(--muted); margin-right: 4px; order: -1; }
.chip { position: relative; display: flex; align-items: center; gap: 4px; width: 104px; height: 64px; padding: 3px 5px 8px; background: rgba(36,28,54,.94); border: 2px solid var(--line); border-radius: 10px; cursor: pointer; font-family: var(--font); color: var(--text); }
.chip canvas { background: #3a3052; border-radius: 5px; flex: none; }
.chip-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.chip-st { display: flex; gap: 2px; flex-wrap: wrap; height: 18px; overflow: hidden; }
.chip .bar.charge { position: absolute; left: 6px; right: 6px; bottom: 3px; display: none; }
.chip.charging { border-color: #ff5a3a; animation: chargeBlink .3s infinite alternate; }
.chip.charging .bar.charge { display: block; }
.chip.boss { width: 136px; border-color: #c88a58; }
@keyframes chargeBlink { from { box-shadow: 0 0 0 0 rgba(255,90,58,.8); } to { box-shadow: 0 0 10px 3px rgba(255,90,58,.8); } }
.chip.targetable { border-color: #fff0a0; }
.chip.targeted, .chip.inarea { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold); background: #4a3c2a; }
.sti { display: inline-flex; align-items: center; height: 17px; padding: 0 3px; border-radius: 4px; font-size: 11px; font-weight: 900; color: #1a0f08; font-style: normal; }
.sti i { font-style: normal; font-size: 9px; margin-left: 1px; opacity: .85; }
.b-tmsg { position: absolute; left: 50%; top: 214px; transform: translateX(-50%); background: rgba(20,30,60,.92); border: 2px solid var(--blue); border-radius: 12px; padding: 8px 16px; font-size: 16px; white-space: nowrap; z-index: 4; }
.tm-pause { color: var(--blue); font-weight: 900; margin-right: 6px; }
/* 하단: 캐릭터 묶음 [얼굴 + ① ② ③] */
.b-hud { position: absolute; left: 6px; bottom: 6px; display: flex; gap: 8px; }
.bgroup { position: relative; display: flex; gap: 4px; padding: 5px; background: rgba(26,20,40,0.94); border: 2px solid #4a3f68; border-radius: 14px; }
.bgroup.dead { filter: grayscale(1) brightness(0.6); }
.bgroup.pick { border-color: #9cf0a8; box-shadow: 0 0 0 3px rgba(156,240,168,0.6); cursor: pointer; pointer-events: auto; }
.bg-face { position: relative; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: auto; }
.bg-face canvas { background: #3a3052; border-radius: 9px; }
.bg-face .bar { width: 50px; height: 7px; }
.bg-name { font-size: 13px; font-weight: 900; }
.bg-stat { position: absolute; top: 1px; left: 1px; right: 1px; display: flex; gap: 1px; flex-wrap: wrap; }
.bg-stat .sti { height: 13px; font-size: 9px; padding: 0 2px; }
.bg-stat .sti i { display: none; }
.bg-dead { display: none; position: absolute; inset: 0 0 18px 0; align-items: center; justify-content: center; font-size: 40px; color: #ff5a4a; text-shadow: 0 2px 0 #000; }
.bgroup.dead .bg-dead { display: flex; }
.sk { position: relative; width: 64px; height: 88px; padding: 0; border-radius: 12px; border: 2.5px solid #6a5aa8; color: #f3ead8; font-family: var(--font); cursor: pointer; pointer-events: auto; touch-action: none; overflow: visible;
  background: linear-gradient(rgba(10,8,18,0.72), rgba(10,8,18,0.72)) top / 100% calc(var(--cd, 0) * 100%) no-repeat, linear-gradient(#3a3058, #251e38); }
.sk-s2 { border-color: #4a7ab0; }
.sk-ult { width: 66px; border-color: #a8863a; background: linear-gradient(rgba(10,8,18,0.72), rgba(10,8,18,0.72)) top / 100% calc(var(--cd, 0) * 100%) no-repeat, linear-gradient(#5a2a38, #3a1a28); }
.sk-icon { position: absolute; top: 9px; left: 0; right: 0; display: flex; justify-content: center; color: #cbbcff; }
.sk-s2 .sk-icon { color: #9fd0ff; } .sk-ult .sk-icon { color: #ffd34a; }
.sk-cd { position: absolute; top: 12px; left: 0; right: 0; font-size: 20px; font-weight: 900; text-shadow: 0 2px 0 #000, 0 0 6px #000; }
.sk.cooling .sk-icon { opacity: 0.45; }
.sk-name { position: absolute; top: 46px; left: 2px; right: 2px; font-size: 11px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk-kind { position: absolute; bottom: 5px; left: 4px; right: 4px; font-size: 9.5px; font-weight: 900; color: #a99cc0; border-radius: 6px; }
.sk.auto .sk-kind { color: #9fd0ff; background: rgba(120,160,255,0.22); }
.sk-tag { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); padding: 1px 7px; border-radius: 9px; font-size: 11px; font-weight: 900; white-space: nowrap; display: none; }
.sk.ready:not(.cooling) { box-shadow: 0 0 0 1px rgba(255,255,255,0.2) inset; }
.sk.hint { border-color: #9fd0ff; box-shadow: 0 0 12px 2px rgba(122,184,240,0.75); }
.sk.hint .sk-tag { display: block; background: #9fd0ff; color: #10223a; }
.sk.now { border-color: #ffd34a; animation: ultReady 0.45s infinite alternate; }
.sk.now .sk-tag { display: block; background: #ffd34a; color: #2b1d10; }
.sk.glow { border-color: #ffd34a; animation: ultReady 0.8s infinite alternate; }
.sk.glow .sk-tag { display: block; background: #ffd34a; color: #2b1d10; }
.sk.drag { border-color: #9cf0a8 !important; box-shadow: 0 0 0 3px #9cf0a8 !important; }
.sk:active { transform: translateY(2px); }
/* 오른쪽 작전 명령 */
.b-orders { position: absolute; right: 6px; bottom: 6px; display: flex; flex-direction: column; gap: 5px; align-items: stretch; }
.bo-label { font-size: 12px; color: var(--muted); text-align: center; font-weight: 800; }
.bo-btn { min-width: 70px; min-height: 64px; font-size: 17px; font-weight: 900; padding: 2px 6px; }
.bo-btn.on { background: linear-gradient(#ffd96a, #e8a83a); color: #2b1d10; border-color: #fff0a0; }
/* 위험 경고 */
.b-warn { position: absolute; left: 50%; top: 146px; transform: translateX(-50%); padding: 8px 22px; border-radius: 14px; background: rgba(90,10,10,0.92); border: 2.5px solid #ff8a6a; text-align: center; z-index: 4; display: flex; flex-direction: column; animation: pop .15s; }
.b-warn b { font-size: 20px; color: #ffd2c4; } .b-warn small { color: #ffb0a0; font-size: 12px; }
.chip-focus { display: none; position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); background: #ff4d6d; color: #fff; font-size: 10px; font-weight: 900; padding: 0 6px; border-radius: 7px; }
.chip.focused { border-color: #ff4d6d; box-shadow: 0 0 0 2px #ff4d6d; }
.chip.focused .chip-focus { display: block; }
.chips-label small { display: block; font-size: 9px; font-weight: 600; }
#ui.dragging .b-orders, #ui.dragging .b-chips { opacity: 0.6; }

/* ---------- 필드 */
.f-top { position: absolute; left: 10px; right: 10px; top: 8px; display: flex; justify-content: space-between; align-items: center; }
.f-title { font-size: 18px; font-weight: 900; text-shadow: 0 2px 0 #000; background: rgba(10,20,20,.5); padding: 6px 12px; border-radius: 10px; }
.f-right { display: flex; gap: 8px; }
.f-res { position: absolute; left: 12px; top: 60px; display: flex; gap: 8px; font-size: 14px; font-weight: 700; }
.f-res span { background: rgba(10,20,20,.6); padding: 4px 10px; border-radius: 8px; }
.f-act { position: absolute; right: 26px; bottom: 30px; min-width: 150px; min-height: 76px; font-size: 22px; border-radius: 40px; }

.dialog-box { width: 600px; }
.dlg-head { display: flex; align-items: center; gap: 10px; }
.dlg-head canvas { background: #3a3052; border-radius: 8px; }
.dlg-name { font-weight: 900; font-size: 17px; }
.dlg-title { font-size: 19px; color: var(--gold); font-weight: 900; margin: 10px 0 6px; }
.dlg-body { font-size: 16px; line-height: 1.6; }

/* ---------- 타이틀 */
.title-box { position: absolute; left: 0; right: 0; top: 30px; display: flex; flex-direction: column; align-items: center; }
.title-logo { font-size: 56px; font-weight: 900; color: var(--gold); letter-spacing: 2px; text-shadow: 0 4px 0 #6a3a10, 0 8px 18px rgba(0,0,0,.7); }
.title-sub { font-size: 18px; color: #e8d8f8; margin: 2px 0 14px; text-shadow: 0 2px 0 #000; }
.title-box .btn-col { width: 260px; }
.title-box .btn-col .btn { min-height: 48px; }
.title-seed { margin-top: 6px; font-size: 13px; color: var(--muted); }
.title-foot { position: absolute; right: 10px; bottom: 6px; font-size: 12px; color: var(--muted); }

/* ---------- 공용 장면 박스 */

// ---------- 00_util.js
// ===== 00_util.js : 시드 RNG, 수학 헬퍼 =====
// mulberry32 — 같은 시드면 같은 수열 (언리얼 FRandomStream 대응)
function makeRng(seed) {
  let a = seed >>> 0;
  const rng = function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.int = (lo, hi) => lo + Math.floor(rng() * (hi - lo + 1)); // [lo, hi]
  rng.pick = (arr) => arr[Math.floor(rng() * arr.length)];
  rng.chance = (p) => rng() < p;
  rng.weighted = (entries) => { // [[key, weight], ...]
    let total = 0;
    for (const e of entries) total += e[1];
    let r = rng() * total;
    for (const e of entries) { r -= e[1]; if (r < 0) return e[0]; }
    return entries[entries.length - 1][0];
  };
  rng.shuffle = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };
  return rng;
}

// 문자열/숫자 조합을 32비트 시드로
function hashSeed(...parts) {
  let h = 2166136261 >>> 0;
  const s = parts.join('|');
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeOutBack = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);

function safeStorageGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
}
function safeStorageSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 저장 불가 환경 무시 */ }
}

function levelGapMult(g) {
  const L = CONST.LEVEL_GAP;
  if (g >= 0) return { dealt: Math.min(L.dealtUpMax, 1 + L.dealtUp * g), taken: Math.max(L.takenUpMin, 1 - L.takenUp * g) };
  return { dealt: Math.max(L.dealtDownMin, 1 + L.dealtDown * g), taken: Math.min(L.takenDownMax, 1 - L.takenDown * g) };
}

  const v = opt.tint === 'white' ? 'white' : opt.tint === 'dark' ? 'dark' : null;
  const draw = (layer, dx, dy, vv) => { const cv = layerCanvas(name, layer, vv, k); if (cv) ctx.drawImage(cv, ox + dx, oy + dy); };
  draw('back', backDx, 0, v || 'normal');
  draw('body', 0, 0, v || 'normal');
  draw('head', 0, headDy, v || (opt.blinking ? 'blink' : 'normal'));
  if (opt.tint === 'red' && opt.tintAlpha) {
    ctx.globalAlpha = (opt.alpha === undefined ? 1 : opt.alpha) * opt.tintAlpha;
    draw('back', backDx, 0, 'red'); draw('body', 0, 0, 'red'); draw('head', 0, headDy, 'red');
  }
  ctx.restore();
}

// 초상화: 머리 영역(headBox)을 잘라 그린다
function drawPortrait(canvas, name, opts) {
  const d = ART[name];
  const c = canvas.getContext('2d');
  c.clearRect(0, 0, canvas.width, canvas.height);
  const [hx0, hy0, hx1, hy1] = d.headBox;
  const k = Math.min(canvas.width / (hx1 - hx0), canvas.height / (hy1 - hy0));
  const kk = Math.ceil(k * 4) / 2; // 2배 슈퍼샘플
  c.save();
  c.imageSmoothingEnabled = true;
  if (opts && opts.dead) c.filter = 'grayscale(1) brightness(0.55)';
  if (opts && opts.flip) { c.translate(canvas.width, 0); c.scale(-1, 1); }
  c.translate((canvas.width - (hx1 - hx0) * k) / 2, (canvas.height - (hy1 - hy0) * k) / 2);
  c.scale(k / kk, k / kk);
  const ox = (d.box[0] - hx0) * kk, oy = (d.box[1] - hy0) * kk;
  for (const layer of ['back', 'body', 'head']) { const cv = layerCanvas(name, layer, 'normal', kk); if (cv) c.drawImage(cv, ox, oy); }
  c.restore();
}

// ---------- 03_audio.js
// ===== 03_audio.js : WebAudio 합성 효과음 (외부 파일 없음) =====
const Sfx = {
  ctx: null, enabled: true, master: null, last: {},
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  // 너무 잦은 동일 효과음 억제
  _gate(name, ms) {
    const now = performance.now();
    if (this.last[name] && now - this.last[name] < ms) return false;
    this.last[name] = now;
    return true;
  },
  tone(freq, dur, type, vol, slideTo, delay) {
    if (!this.ctx || !this.enabled) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol, filterFreq, delay) {
    if (!this.ctx || !this.enabled) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = filterFreq || 2000;
    const g = this.ctx.createGain();
    g.gain.value = vol || 0.2;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0);
  },
  play(name) {
    if (!this.ctx || !this.enabled) return;
    switch (name) {
      case 'click': if (this._gate(name, 40)) this.tone(660, 0.06, 'square', 0.08, 880); break;
      case 'back': if (this._gate(name, 40)) this.tone(520, 0.07, 'square', 0.07, 330); break;
      case 'hit': if (this._gate(name, 45)) { this.noise(0.08, 0.18, 1800); this.tone(180, 0.07, 'square', 0.08, 90); } break;
      case 'crit': this.noise(0.14, 0.28, 3200); this.tone(320, 0.12, 'sawtooth', 0.12, 110); break;
      case 'heal': if (this._gate(name, 80)) { this.tone(523, 0.12, 'sine', 0.12, 784); this.tone(784, 0.16, 'sine', 0.08, 1046, 0.06); } break;
      case 'shoot': if (this._gate(name, 60)) this.tone(900, 0.06, 'triangle', 0.06, 500); break;
      case 'magic': if (this._gate(name, 60)) { this.tone(700, 0.18, 'sine', 0.1, 1400); this.tone(1050, 0.18, 'triangle', 0.05, 2100, 0.04); } break;
      case 'skill': this.tone(440, 0.1, 'square', 0.1, 880); this.tone(880, 0.12, 'square', 0.06, 1320, 0.05); break;
      case 'death': this.noise(0.3, 0.2, 700); this.tone(240, 0.3, 'triangle', 0.1, 60); break;
      case 'charge': this.tone(110, 0.5, 'sawtooth', 0.12, 220); this.tone(116, 0.5, 'sawtooth', 0.08, 230, 0.02); break;
      case 'boom': this.noise(0.45, 0.4, 500); this.tone(70, 0.4, 'sine', 0.3, 35); break;
      case 'cancel': this.tone(1200, 0.08, 'square', 0.1, 600); this.tone(900, 0.12, 'square', 0.08, 300, 0.08); break;
      case 'ult': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.18, 'square', 0.09, f * 1.01, i * 0.06)); break;
      case 'pause': this.tone(400, 0.08, 'sine', 0.1, 300); break;
      case 'coin': this.tone(988, 0.07, 'square', 0.08); this.tone(1319, 0.12, 'square', 0.08, null, 0.07); break;
      case 'win': [523, 659, 784, 1046, 784, 1046].forEach((f, i) => this.tone(f, 0.16, 'square', 0.08, null, i * 0.11)); break;
      case 'lose': [392, 349, 311, 262].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.12, null, i * 0.22)); break;
      case 'step': if (this._gate(name, 220)) this.noise(0.04, 0.05, 900); break;
      case 'door': this.tone(150, 0.3, 'sine', 0.15, 300); this.noise(0.25, 0.1, 1200); break;
      case 'summon': this.tone(300, 0.25, 'square', 0.08, 600); break;
      case 'phase': this.tone(90, 0.6, 'sawtooth', 0.2, 45); this.noise(0.5, 0.3, 400); break;
      default: break;
    }
  },
};

  const e = document.createElement(tag);

  if (html !== undefined && html !== null) e.innerHTML = html;

}
function btn(label, cls, onClick, opts) {

    Sfx.play(opts && opts.sfx ? opts.sfx : 'click');

// ---------------------------------------------------------------- 입력 (논리 좌표 변환)
const Input = {
  scale: 1, rectLeft: 0, rectTop: 0,
  toLogical(ev) {
    return { x: (ev.clientX - this.rectLeft) / this.scale, y: (ev.clientY - this.rectTop) / this.scale };
  },
  attach(canvas) {
    const fire = (kind, ev) => {
      const s = Game.scene;
      if (!s) return;
      const p = this.toLogical(ev);
      if (kind === 'down' && s.pointerDown) s.pointerDown(p, ev);
      if (kind === 'move' && s.pointerMove) s.pointerMove(p, ev);
      if (kind === 'up' && s.pointerUp) s.pointerUp(p, ev);
    };
    canvas.addEventListener('pointerdown', (e) => { Sfx.init(); Sfx.resume(); canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); fire('down', e); e.preventDefault(); });
    canvas.addEventListener('pointermove', (e) => { fire('move', e); });
    canvas.addEventListener('pointerup', (e) => { fire('up', e); });
    canvas.addEventListener('pointercancel', (e) => { fire('up', e); });
  },
};

// ---------- 04b_equip.js
// ===== 04b_equip.js : 장비 로직 (프로필 저장, 아이템 생성, 능력치 합산, 강화, 분해, 드랍) =====
// 화면(DOM)과 무관한 순수 로직. 데이터는 EQUIP_DB(01b_equip_db.js, gen_equipment_db.py 생성).

const EQ = (() => {
  const DB = EQUIP_DB;
  const GRADES = DB.grades.map((g) => g.code);
  const G = {}; DB.grades.forEach((g, i) => { G[g.code] = Object.assign({ idx: i }, g); });
  const STAT = {}; DB.stats.forEach((s) => { STAT[s.key] = s; });
  const BASE = {}; DB.items.forEach((it) => { BASE[it.id] = it; });
  const PASSIVE = {}; DB.passives.forEach((p) => { PASSIVE[p.key] = p; });
  const GEM = {}; DB.gems.forEach((g) => { GEM[g.key] = g; });
  const SLOTS = DB.slots.map((s) => s.key);
  const SLOT_NAME = {}; DB.slots.forEach((s) => { SLOT_NAME[s.key] = s.name; });
  // 게임 내에서 효과가 구현된 스킬 보너스 (L·E). 직업 전용 스킬 보너스는 스킬 풀 개편 때 추가
  const SKILL_BONUS = [
    { key: 's1pow', text: '① 스킬 위력 +{v}', L: 0.10, E: 0.12 },
    { key: 's2pow', text: '② 스킬 위력 +{v}', L: 0.10, E: 0.12 },
    { key: 'ultpow', text: '③ 필살기 위력 +{v}', L: 0.10, E: 0.12 },
    { key: 's1cd', text: '① 스킬 쿨타임 -{v}', L: 0.07, E: 0.08 },
    { key: 's2cd', text: '② 스킬 쿨타임 -{v}', L: 0.07, E: 0.08 },
    { key: 'ultgain', text: '필살기 충전 +{v}', L: 0.08, E: 0.09 },
  ];
  const SB = {}; SKILL_BONUS.forEach((b) => { SB[b.key] = b; });
  const GEM_SKILL = { s1_power: 's1pow', s2_power: 's2pow', ult_power: 'ultpow' };
  const EXTRA_STAT_NAME = { s1pow: '① 스킬 위력', s2pow: '② 스킬 위력', ultpow: '필살기 위력', s1cd: '① 쿨타임', s2cd: '② 쿨타임', nonbroken: '그로기 아닌 적 피해' };

  const heroClass = (heroId) => HEROES[heroId].role;
  const classInfo = (cls) => DB.classes.find((c) => c.key === cls);
  const usableBy = (item, heroId) => BASE[item.base].cls === 'common' || BASE[item.base].cls === heroClass(heroId);
  const weighted = (rng, entries) => { // entries: [[value, weight]]
    let tot = 0; for (const e of entries) tot += e[1];
    let r = rng() * tot;
    for (const e of entries) { r -= e[1]; if (r < 0) return e[0]; }
    return entries[entries.length - 1][0];
  };
  const r4 = (v) => Math.round(v * 10000) / 10000;

  // ------------------------------------------------------------ 프로필 (원정 사이에 유지)
  function newProfile() {
    const equip = {};
    for (const id of HERO_ORDER) { equip[id] = {}; for (const s of SLOTS) equip[id][s] = null; }
    return { v: 1, uidSeq: 1, gold: 0, stones: 0, inv: [], gems: [], equip, unlockedTier: 0, tier: 0, clears: {}, codex: {} };
  }
  function loadProfile() {
    const p = safeStorageGet('fe_profile', null);
    if (p && p.v === 1) return GACHA.ensure(p);
    return GACHA.ensure(newProfile());
  }
  function saveProfile(p) { safeStorageSet('fe_profile', p); }
  function findItem(p, uid) { return p.inv.find((i) => i.uid === uid) || null; }
  function findGem(p, uid) { return p.gems.find((g) => g.uid === uid) || null; }
  function equippedBy(p, uid) {
    for (const h in p.equip) for (const s in p.equip[h]) if (p.equip[h][s] === uid) return h;
    return null;
  }

  // ------------------------------------------------------------ 아이템 생성
  function rollItem(rng, p, spec) {
    const base = BASE[spec.base];
    const grade = spec.grade;
    const g = G[grade];
    const item = { uid: p.uidSeq++, base: base.id, grade, enh: 0, fail: 0, artisan: 0, opts: [], passive: null, gems: [], cls: false, sb: [] };
    // 추가 옵션 (부위 제한, 중복 없음)
    const pool = DB.options.filter((o) => o.slots === '*' || o.slots.split(',').includes(base.slot));
    for (let i = 0; i < g.opt && pool.length; i++) {
      const o = weighted(rng, pool.map((x) => [x, x.weight]));
      pool.splice(pool.indexOf(o), 1);
      item.opts.push({ stat: o.key, v: r4((o.min + (o.max - o.min) * rng()) * g.optMult) });
    }
    // L / E 추가 효과
    let gemSlots = 0, cls = false, sbN = 0;
    if (grade === 'L') {
      gemSlots = 1;
      const x = weighted(rng, Object.entries(DB.lExtraWeights));
      if (x === 'cls') cls = true; else if (x === 'skill') sbN = 1;
    } else if (grade === 'E') {
      gemSlots = +weighted(rng, Object.entries(DB.eGemWeights));
      cls = true;
      sbN = +weighted(rng, Object.entries(DB.eSkillWeights));
    }
    item.gems = new Array(gemSlots).fill(null);
    // 공통 장신구의 특성 스탯은 착용자 직업 기준으로 계산 (cls 플래그만 저장)
    item.cls = cls;
    const sbPool = SKILL_BONUS.slice();
    for (let i = 0; i < sbN; i++) { const b = sbPool.splice(Math.floor(rng() * sbPool.length), 1)[0]; item.sb.push({ key: b.key, v: b[grade] }); }
    // 갑옷 랜덤 패시브: 등급 = 장비 등급 이하
    if (base.slot === 'armor') item.passive = rollPassive(rng, grade);
    return item;
  }
  function rollPassive(rng, grade) {
    const gi = G[grade].idx;
    const down = weighted(rng, DB.passiveGradeRoll.map((w, i) => [i === 3 ? 3 + Math.floor(rng() * 3) : i, w]));
    const pg = GRADES[Math.max(0, gi - down)];
    const cands = DB.passives.filter((x) => G[x.min].idx <= G[pg].idx);
    const ps = cands[Math.floor(rng() * cands.length)];
    return { key: ps.key, grade: pg };
  }
  function rollGem(rng, p, grade) {
    const keys = Object.keys(GEM);
    const key = keys[Math.floor(rng() * keys.length)];
    const n = DB.gemEffectCount[grade] - 1;
    const extraPool = keys.filter((k) => k !== key).map((k) => GEM[k].stat).concat(DB.gemSkillExtras.map((x) => x.key));
    const extras = [];
    for (let i = 0; i < n; i++) extras.push(extraPool.splice(Math.floor(rng() * extraPool.length), 1)[0]);
    return { uid: p.uidSeq++, key, grade, extras, inItem: null };
  }

  // ------------------------------------------------------------ 수치
  const enhMult = (item) => 1 + item.enh * DB.enhance.mainPerLevel;
  function mainStats(item) {
    const base = BASE[item.base], g = G[item.grade];
    return base.main.map((m) => ({ stat: m.stat, v: m.base * g.main * enhMult(item) }));
  }
  function passiveValue(ps) { const d = PASSIVE[ps.key]; return d.v * DB.passiveMult[ps.grade]; }
  function gemEffects(gem) {
    const mult = DB.gemMult[gem.grade];
    const out = [{ stat: GEM[gem.key].stat, v: GEM[gem.key].base * mult }];
    for (const x of gem.extras) {
      const sk = DB.gemSkillExtras.find((e) => e.key === x);
      if (sk) out.push({ stat: GEM_SKILL[x], v: sk.base * mult * DB.gemExtraRatio });
      else { const gk = Object.keys(GEM).find((k) => GEM[k].stat === x); out.push({ stat: x, v: GEM[gk].base * mult * DB.gemExtraRatio }); }
    }
    return out;
  }
  // 아이템 하나가 주는 효과 목록 (착용자 직업 필요: 공통 장신구 특성 스탯)
  function itemEffects(p, item, heroId) {
    const out = mainStats(item).concat(item.opts.map((o) => ({ stat: o.stat, v: o.v })));
    if (item.cls) {
      const cls = BASE[item.base].cls !== 'common' ? BASE[item.base].cls : heroId ? heroClass(heroId) : null;
      if (cls) { const cs = DB.classStat[cls]; out.push({ stat: cs.stat, v: cs[item.grade] }); }
    }
    for (const b of item.sb) out.push({ stat: b.key, v: b.v });
    for (const gu of item.gems) if (gu) { const gem = findGem(p, gu); if (gem) out.push(...gemEffects(gem)); }
    return out;
  }
  // 영웅 최종: 최대 HP, 전투 보정치(mods), 패시브
  function heroLoadout(p, heroId) {
    const def = HEROES[heroId];
    const mods = {};
    const add = (k, v) => { mods[k] = (mods[k] || 0) + v; };
    const passives = {};
    for (const s of SLOTS) {
      const uid = p.equip[heroId] && p.equip[heroId][s];
      const item = uid && findItem(p, uid);
      if (!item) continue;
      for (const e of itemEffects(p, item, heroId)) add(e.stat, e.v);
      if (item.passive) { const cur = passives[item.passive.key]; if (!cur || G[cur.grade].idx < G[item.passive.grade].idx) passives[item.passive.key] = item.passive; }
    }
    for (const k in passives) { // 같은 이름은 가장 높은 등급 하나만
      const d = PASSIVE[k], v = passiveValue(passives[k]);
      if (d.kind === 'stat' || d.kind === 'trade') add(d.stat, v);
      if (d.kind === 'trade') add(d.pen.stat, d.pen.v);
    }
    const hooks = {};
    for (const k in passives) if (PASSIVE[k].kind === 'hook') hooks[k] = passiveValue(passives[k]);
    mods.passives = hooks;
    const maxHp = Math.round((def.hp + (mods.hp || 0)) * (1 + (mods.hp_pct || 0)));
    delete mods.hp; delete mods.hp_pct;
    return { maxHp, mods, passives };
  }
  // 대략적인 전투력 점수 (정렬·비교 표시용)
  function itemScore(p, item, heroId) {
    const cls = BASE[item.base].cls !== 'common' ? BASE[item.base].cls : heroId ? heroClass(heroId) : 'melee';
    const ci = classInfo(cls);
    let s = 0;
    for (const e of itemEffects(p, item, heroId)) {
      if (e.stat === 'atk') s += e.v / ci.baseAtk * 50;
      else if (e.stat === 'hp') s += e.v / ci.baseHp * 50;
      else if (STAT[e.stat] && STAT[e.stat].pw) s += e.v * 100 * STAT[e.stat].pw;
      else if (SB[e.stat]) s += e.v * 100 * 0.12;
    }
    if (item.passive) s += passiveValue(item.passive) * (PASSIVE[item.passive.key].kind === 'hook' ? 0.6 : 100 * ((STAT[PASSIVE[item.passive.key].stat] || {}).pw || 0.15));
    return Math.round(s * 10);
  }

  // ------------------------------------------------------------ 강화
  function enhanceCap(item) { return DB.enhance.capByGrade[item.grade]; }
  function enhanceInfo(item) {
    if (item.enh >= enhanceCap(item)) return null;
    const L = DB.enhance.levels[item.enh];
    const bonus = Math.min(DB.enhance.failBonusMax, item.fail * DB.enhance.failBonusStep);
    const rate = Math.min(1, L.rate * (1 + bonus));
    return { target: item.enh + 1, base: L.rate, rate: item.artisan >= 1 ? 1 : rate, stones: L.stones, gold: L.gold, artisan: Math.min(1, item.artisan), guaranteed: item.artisan >= 1 };
  }
  function tryEnhance(p, item, rng) {
    const info = enhanceInfo(item);
    if (!info) return { ok: false, reason: 'max' };
    if (p.stones < info.stones) return { ok: false, reason: 'stones' };
    if (p.gold < info.gold) return { ok: false, reason: 'gold' };
    p.stones -= info.stones; p.gold -= info.gold;
    const success = info.guaranteed || rng() < info.rate;
    if (success) { item.enh++; item.fail = 0; item.artisan = 0; }
    else { item.fail++; item.artisan = Math.min(1, item.artisan + info.rate * DB.enhance.artisanFactor); }
    return { ok: true, success, info };
  }
  function visualTier(enh) { const v = DB.enhance.visualTiers; return enh >= v[2] ? 3 : enh >= v[1] ? 2 : enh >= v[0] ? 1 : 0; }

  // ------------------------------------------------------------ 장착 / 분해 / 보석
  function equip(p, heroId, item) {
    const slot = BASE[item.base].slot;
    const prevOwner = equippedBy(p, item.uid);
    if (prevOwner) p.equip[prevOwner][slot] = null;
    p.equip[heroId][slot] = item.uid;
  }
  function unequip(p, heroId, slot) { p.equip[heroId][slot] = null; }
  function dismantle(p, item) {
    const owner = equippedBy(p, item.uid);
    if (owner) p.equip[owner][BASE[item.base].slot] = null;
    for (const gu of item.gems) if (gu) { const gem = findGem(p, gu); if (gem) gem.inItem = null; }
    p.inv.splice(p.inv.indexOf(item), 1);
    const n = DB.dismantle[item.grade] + item.enh;
    p.stones += n;
    return n;
  }
  function socket(p, item, idx, gem) {
    if (gem.inItem) { const old = findItem(p, gem.inItem); if (old) old.gems = old.gems.map((g) => (g === gem.uid ? null : g)); }
    const prev = item.gems[idx];
    if (prev) { const pg = findGem(p, prev); if (pg) pg.inItem = null; }
    item.gems[idx] = gem.uid; gem.inItem = item.uid;
  }
  function unsocket(p, item, idx) { const gu = item.gems[idx]; if (gu) { const g = findGem(p, gu); if (g) g.inItem = null; } item.gems[idx] = null; }

  // ------------------------------------------------------------ 드랍
  function dropGrade(rng, source, tier) {
    const row = DB.drops[source][String(Math.max(1, Math.min(8, tier || 1)))];
    return weighted(rng, GRADES.map((g, i) => [g, row[i]]));
  }
  // 파티 직업 장비 또는 공통 장신구 중 하나
  function dropItem(rng, p, source, tier, partyHeroIds) {
    const slot = SLOTS[Math.floor(rng() * SLOTS.length)];
    let cls = 'common';
    if (slot === 'weapon' || slot === 'armor' || slot === 'medal') cls = heroClass(partyHeroIds[Math.floor(rng() * partyHeroIds.length)]);
    const lines = DB.items.filter((it) => it.slot === slot && it.cls === cls);
    const base = lines[Math.floor(rng() * lines.length)];
    return rollItem(rng, p, { base: base.id, grade: dropGrade(rng, source, tier) });
  }
  function dropGem(rng, p, tier) { return rollGem(rng, p, dropGrade(rng, 'boss', tier)); }

  // 전투 레벨: 장비 레벨(등급 × 10 + 강화) 6부위 평균. 던전 레벨과의 차이가 전투 보정(levelGapMult)이 된다
  // (캐릭터 레벨이 생기면 여기에 더한다)
  function itemLevel(item) { return (G[item.grade].idx + 1) * 10 + (item.enh || 0); }
  function heroLevel(p, heroId) {
    let sum = 0;
    for (const s of SLOTS) { const uid = p.equip[heroId] && p.equip[heroId][s]; const item = uid && findItem(p, uid); if (item) sum += itemLevel(item); }
    return Math.round(sum / SLOTS.length);
  }
  function tierLevel(t) { return t ? (G[DB.tiers[t - 1].recGrade].idx + 1) * 10 + 5 : 0; }
  function levelGap(p, heroId, t) { return heroLevel(p, heroId) - tierLevel(t); }

  // 난이도 단계: 0 = 기본 던전(장비 없이 깰 수 있는 데모 난이도), 1~8 = EQUIP_DB.tiers
  function tierInfo(t) {
    if (!t) return { tier: 0, name: '기본', hp: 1, atk: 1, recGrade: null };
    return DB.tiers[t - 1];
  }

  // ------------------------------------------------------------ 표시 문자열
  function fmtStat(stat, v) {
    const s = STAT[stat];
    if (stat === 'atk' || stat === 'hp') return `${s.name} +${Math.round(v * 10) / 10}`;
    if (SB[stat]) return SB[stat].text.replace('{v}', Math.round(v * 1000) / 10 + '%');
    const name = s ? s.name : EXTRA_STAT_NAME[stat] || stat;
    const pct = Math.round(Math.abs(v) * 1000) / 10;
    return `${name} ${v < 0 ? '-' : '+'}${pct}%`;
  }
  function passiveText(ps) {
    const d = PASSIVE[ps.key], v = passiveValue(ps);
    const vs = d.kind === 'hook' ? (d.unit === '초' ? Math.round(v * 10) / 10 + '초' : d.unit === '' ? Math.round(v) : Math.round(v * 100) + '%') : Math.round(v * 1000) / 10 + '%';
    return d.text.replace('{v}', vs) + (d.penText ? ` / ${d.penText}` : '');
  }
  function itemName(item) { return (item.enh ? `+${item.enh} ` : '') + BASE[item.base].name; }

  return {
    DB, GRADES, G, BASE, PASSIVE, GEM, SLOTS, SLOT_NAME, SKILL_BONUS,
    heroClass, usableBy, newProfile, loadProfile, saveProfile, findItem, findGem, equippedBy,
    rollItem, rollPassive, rollGem, mainStats, itemEffects, heroLoadout, itemScore, passiveValue, gemEffects,
    enhanceCap, enhanceInfo, tryEnhance, visualTier, equip, unequip, dismantle, socket, unsocket,
    dropGrade, dropItem, dropGem, tierInfo, itemLevel, heroLevel, tierLevel, levelGap, fmtStat, passiveText, itemName,
  };
})();

// ---------- 04c_gacha.js
// ===== 04c_gacha.js : 캐릭터 보유·돌파·필살기 선택, 소환(뽑기) =====
// 데모: 현금 결제 없음. 소환권은 보스 격파 보상(5장). 확률은 15명 균등(1/15), 6번째 이후 중복은 강화석으로 전환.

const GACHA = {
  RATE_NOTE: '15명 모두 같은 확률 (각 6.7%)',
  BOSS_TICKETS: 5,          // 데모: 보스 격파 시 확정 지급
  START_TICKETS: 5,         // 데모: 첫 실행 지급
  OVERFLOW_STONES: 20,      // 최대 돌파 이후 중복 → 강화석

  // 프로필에 캐릭터 정보가 없으면 시작 캐릭터 5명 지급 (이전 저장 데이터 호환)
  ensure(p) {
    if (!p.chars) {
      p.chars = {};
      for (const c of CHARACTERS) if (c.starter) p.chars[c.id] = { bt: 0, ult: 'A' };
      p.tickets = (p.tickets || 0) + GACHA.START_TICKETS;
    }
    if (p.tickets === undefined) p.tickets = 0;
    for (const id of HERO_ORDER) if (!p.equip[id]) { p.equip[id] = {}; for (const s of EQ.SLOTS) p.equip[id][s] = null; }
    return p;
  },
  owned(p, id) { return !!(p.chars && p.chars[id]); },
  ownedIds(p) { return HERO_ORDER.filter((id) => GACHA.owned(p, id)); },
  // 전투에 쓸 필살기 정의 (선택한 필살기 + 돌파 위력 보너스)
  ultFor(p, id) {
    const st = (p.chars && p.chars[id]) || { bt: 0, ult: 'A' };
    const choice = ultChoices(id, st.bt).includes(st.ult) ? st.ult : 'A';
    return ultDefFor(id, choice, st.bt);
  },
  setUlt(p, id, choice) { const st = p.chars[id]; if (st && ultChoices(id, st.bt).includes(choice)) st.ult = choice; },
  // 소환 n회 (소환권 n장 소모). 결과: [{ id, isNew, bt, overflow }]
  pull(p, rng, n) {
    if ((p.tickets || 0) < n) return null;
    p.tickets -= n;
    const out = [];
    for (let i = 0; i < n; i++) {
      const c = CHARACTERS[Math.floor(rng() * CHARACTERS.length)];
      const st = p.chars[c.id];
      if (!st) { p.chars[c.id] = { bt: 0, ult: 'A' }; out.push({ id: c.id, isNew: true, bt: 0 }); }
      else if (st.bt < BREAKTHROUGH.max) { st.bt++; out.push({ id: c.id, isNew: false, bt: st.bt, step: BREAKTHROUGH.steps.find((s) => s.bt === st.bt) }); }
      else { p.stones += GACHA.OVERFLOW_STONES; out.push({ id: c.id, isNew: false, bt: st.bt, overflow: GACHA.OVERFLOW_STONES }); }
    }
    return out;
  },
};

// ---------- 05_map.js
// ===== 05_map.js : 경로 지도 생성 + 지도 장면 =====

// 생성 제약:
//  - 스테이지 1~4는 3갈래, 5는 보스 단일
//  - 스테이지 1 정예 없음 / 각 스테이지 전투 계열 ≥ 1 / 상점·휴식 스테이지당 ≤ 1
//  - 스테이지 4에는 휴식 또는 고목이 반드시 1개
function generateMap(seed) {
  const rng = makeRng(hashSeed(seed, 'map'));
  const stages = [];
  const eventIds = rng.shuffle(Object.keys(EVENTS).slice());
  let eventCursor = 0;
  for (let s = 1; s <= CONST.STAGES - 1; s++) {
    let types = null;
    for (let attempt = 0; attempt < 500; attempt++) {
      const cand = [];
      for (let r = 0; r < CONST.ROWS; r++) {
        const entries = [];
        for (const k in NODE_TYPES) {
          const nt = NODE_TYPES[k];
          if (!nt.weight) continue;
          if (k === 'elite' && s === 1) continue;
          let w = nt.weight;
          if (s === 1 && k === 'battle') w *= 1.4;
          entries.push([k, w]);
        }
        cand.push(rng.weighted(entries));
      }
      if (validStage(s, cand)) { types = cand; break; }
    }
    if (!types) types = s === 4 ? ['battle', 'rest', 'tree'] : ['battle', 'event', 'battle']; // 안전장치
    stages.push(types.map((type, row) => {
      const node = { stage: s, row, type };
      if (NODE_TYPES[type].combat) node.enc = rng.int(0, 99);
      if (type === 'event') node.event = eventIds[eventCursor++ % eventIds.length];
      return node;
    }));
  }
  stages.push([{ stage: CONST.STAGES, row: 1, type: 'boss', enc: rng.int(0, ENCOUNTERS.boss[CONST.STAGES].length - 1) }]); // 원정마다 보스가 다르다
  return { seed, stages };
}

function validStage(s, types) {
  const count = (t) => types.filter((x) => x === t).length;
  if (s === 1 && count('elite') > 0) return false;
  if (!types.some((t) => NODE_TYPES[t].combat)) return false;
  if (count('shop') > 1 || count('rest') > 1) return false;
  if (s === 4 && count('rest') + count('tree') < 1) return false;
  if (count('tree') > 1) return false;
  return true;
}

// 이동 규칙: 다음 스테이지의 같은 행 또는 위/아래 인접 행
function canMoveTo(run, node) {
  if (node.stage !== run.pos.stage + 1) return false;
  if (node.type === 'boss') return true;
  return Math.abs(node.row - run.pos.row) <= 1;
}
function getNode(map, stage, row) {
  const st = map.stages[stage - 1];
  if (!st) return null;
  return st.find((n) => n.row === row) || st[0];
}

// 노드 → 전투 웨이브
function encounterFor(node) {
  if (node.waves) return node.waves; // 이벤트 등에서 직접 지정
  const table = ENCOUNTERS[node.type === 'boss' ? 'boss' : node.type][node.stage] || ENCOUNTERS.battle[Math.min(4, node.stage)];
  return table[node.enc % table.length];
}

// 지도 화면 좌표
function mapNodePos(node) {
  if (node.type === 'boss') return { x: 852, y: 318 };
  return { x: 150 + (node.stage - 1) * 172, y: 222 + node.row * 96 };
}

// ---------------------------------------------------------------- 공용 UI: 파티 패널 / 자원 바
function partyPanel(run, opts) {
  opts = opts || {};
  const wrap = el('div', 'party-panel' + (opts.compact ? ' compact' : ''));
  for (const id of partyIds(run)) {
    const h = run.heroes[id];
    const def = HEROES[id];
    const card = el('div', 'pcard' + (h.dead ? ' dead' : ''));
    card.dataset.hero = id;
    card.appendChild(portraitCanvas(def.sprite, 40, { dead: h.dead }));
    const info = el('div', 'pinfo');
    info.appendChild(el('div', 'pname', `${def.name}<span class="prole">${def.roleName}</span>`));
    info.appendChild(bar(h.hp / h.maxHp, h.hp / h.maxHp < 0.3 ? 'hp low' : 'hp'));
    info.appendChild(el('div', 'php', h.dead ? '사망' : `${Math.ceil(h.hp)}/${h.maxHp}`));
    card.appendChild(info);
    const ups = Object.values(h.upgrades).reduce((a, u) => a + u.power + u.cd, 0);
    if (ups) card.appendChild(el('div', 'pup', '★' + ups));
    if (opts.onSelect && !h.dead) {
      card.classList.add('selectable');
      card.addEventListener('click', () => { Sfx.play('click'); opts.onSelect(id); });
    }
    wrap.appendChild(card);
  }
  return wrap;
}

function resourceBar(run) {
  const r = el('div', 'res-bar');
  r.appendChild(el('div', 'res gold', `<i>●</i>${run.gold}`));
  r.appendChild(el('div', 'res food', `<i>🍞</i>${run.food}`));
  r.appendChild(el('div', 'res potion', `<i>🧪</i>${run.potions}`));
  const torch = el('div', 'res torch' + (run.torch <= 0 ? ' dark' : run.torch <= 40 ? ' low' : ''), `<i>🔥</i>`);
  torch.appendChild(bar(run.torch / CONST.TORCH_MAX, 'torch'));
  r.appendChild(torch);
  const rel = el('div', 'res relics');
  if (!run.relics.length) rel.appendChild(el('span', 'muted', '유물 없음'));
  for (const id of run.relics) {
    const ic = el('span', 'relic-ic', RELICS[id].icon);
    ic.title = RELICS[id].name;
    ic.addEventListener('click', (e) => { e.stopPropagation(); Game.toast(`${RELICS[id].icon} ${RELICS[id].name}: ${RELICS[id].desc}`, 2600); });
    rel.appendChild(ic);
  }
  if (run.fruit && run.fruit.battles > 0) rel.appendChild(el('span', 'fruit-ic', `🍒×${run.fruit.battles}`));
  r.appendChild(rel);
  return r;
}

// 회복약 사용 (지도/휴식에서)
function usePotionFlow(run, onDone) {
  if (run.potions <= 0) { Game.toast('회복약이 없어요.'); return; }
  const box = el('div', 'pick-box');
  box.appendChild(el('div', 'modal-title', '회복약 사용 — 누구에게?'));
  box.appendChild(partyPanel(run, { onSelect: (id) => {
    const h = run.heroes[id];
    if (h.hp >= h.maxHp) { Game.toast('이미 HP가 가득해요.'); return; }
    run.potions--;
    h.hp = Math.min(h.maxHp, h.hp + h.maxHp * REWARD.potionHealPct);
    Sfx.play('heal');
    Game.closeModal();
    Game.toast(`${HEROES[id].name} HP 회복!`);
    if (onDone) onDone();
  } }));
  box.appendChild(btn('취소', 'ghost', () => Game.closeModal(), { sfx: 'back' }));
  Game.modal(box, { dim: true, closeOnBg: true });
}

// ---------------------------------------------------------------- 지도 장면
const MapScene = {
  selected: null,
  t: 0,
  enter() {
    const run = Game.run;
    this.selected = null;
    this.t = 0;
    const ui = Game.ui;
    const top = el('div', 'map-top');
    const hdr = el('div', 'map-hdr');
    hdr.appendChild(el('div', 'map-title', `고블린 굴 — ${run.pos.stage === 0 ? '입구' : `${run.pos.stage}/${CONST.STAGES}`}`));
    hdr.appendChild(resourceBar(run));
    top.appendChild(hdr);
    top.appendChild(partyPanel(run, { compact: true }));
    ui.appendChild(top);

    const nodesLayer = el('div', 'map-nodes');
    for (const st of run.map.stages) for (const node of st) {
      const p = mapNodePos(node);
      const nt = NODE_TYPES[node.type];
      const b = el('button', 'map-node t-' + node.type, nt.short);
      b.type = 'button';
      b.style.left = p.x + 'px'; b.style.top = p.y + 'px';
      b.style.setProperty('--nc', nt.color);
      b.dataset.stage = node.stage; b.dataset.row = node.row;
      const visited = run.path.some((q) => q.stage === node.stage && q.row === node.row);
      const current = run.pos.stage === node.stage && run.pos.row === node.row;
      const reachable = canMoveTo(run, node);
      if (visited) b.classList.add('visited');
      if (current) b.classList.add('current');
      if (reachable) b.classList.add('reachable');
      if (!reachable && !current) b.classList.add('locked');
      b.addEventListener('click', () => {
        Sfx.play('click');
        this.select(node, reachable);
      });
      nodesLayer.appendChild(b);
    }
    ui.appendChild(nodesLayer);

    // 스테이지 번호
    for (let s = 1; s <= CONST.STAGES; s++) {
      const p = mapNodePos(s === CONST.STAGES ? { type: 'boss' } : { stage: s, row: 0 });
      const lab = el('div', 'stage-num' + (s === run.pos.stage + 1 ? ' next' : ''), String(s));
      lab.style.left = p.x + 'px';
      ui.appendChild(lab);
    }

    const legend = el('div', 'map-legend', Object.keys(NODE_TYPES).map((k) => `<span><b style="background:${NODE_TYPES[k].color}">${NODE_TYPES[k].short}</b>${NODE_TYPES[k].name.replace('일반 ', '')}</span>`).join(''));
    ui.appendChild(legend);

    const side = el('div', 'map-actions');
    side.appendChild(btn('⚙ 전략', 'small', () => openStrategyEditor(Game.run), { id: 'btn-strategy' }));
    side.appendChild(btn('🧪 회복약', 'small', () => usePotionFlow(run, () => Game.go('map')), { id: 'btn-potion' }));
    side.appendChild(btn('? 규칙', 'small', () => showRulesHelp(), { id: 'btn-help' }));
    ui.appendChild(side);

    this.info = el('div', 'map-info hidden');
    ui.appendChild(this.info);

    Game.hint('map');
  },

  select(node, reachable) {
    this.selected = node;
    const nt = NODE_TYPES[node.type];
    const info = this.info;
    info.innerHTML = '';
    info.classList.remove('hidden');
    info.classList.toggle('left', mapNodePos(node).x >= 480); // 탭한 노드를 가리지 않도록 반대편에
    info.appendChild(el('div', 'mi-title', `<b style="background:${nt.color}">${nt.short}</b> ${nt.name} <small>스테이지 ${node.stage}</small>`));
    let desc = nt.desc;
    if (node.type === 'event') desc = `${EVENTS[node.event].title} — ${nt.desc}`;
    if (nt.combat) {
      const waves = encounterFor(node);
      const names = {};
      waves.flat().forEach((id) => { names[ENEMIES[id].name] = (names[ENEMIES[id].name] || 0) + 1; });
      desc += `<br><small>${waves.length}웨이브 · ` + Object.entries(names).map(([n, c]) => `${n}×${c}`).join(', ') + '</small>';
    }
    info.appendChild(el('div', 'mi-desc', desc));
    const row = el('div', 'mi-btns');
    row.appendChild(btn('취소', 'ghost', () => { this.selected = null; info.classList.add('hidden'); }, { sfx: 'back', id: 'btn-node-cancel' }));
    if (reachable) {
      const go = btn('이동하기 →', 'primary', () => this.moveTo(node), { id: 'btn-node-go' });
      if (Game.run.torch <= 0 && node.type === 'battle') info.appendChild(el('div', 'mi-warn', '횃불이 꺼졌다! 어둠 속 전투는 정예로 바뀔 수 있다.'));
      row.appendChild(go);
    } else {
      row.appendChild(el('div', 'mi-locked', '갈 수 없는 방'));
    }
    info.appendChild(row);
  },

  moveTo(node) {
    const run = Game.run;
    run.pos = { stage: node.stage, row: node.row };
    run.path.push({ stage: node.stage, row: node.row });
    run.stats.nodes++;
    const wasDark = run.torch <= 0;
    run.torch = Math.max(0, run.torch - CONST.TORCH_PER_MOVE);
    run.lastNode = node;
    Sfx.play('door');
    let type = node.type;
    if (type === 'battle' && wasDark) {
      const r = makeRng(hashSeed(run.seed, 'dark', node.stage, node.row));
      if (r() < CONST.TORCH_DARK_ELITE_CHANCE && ENCOUNTERS.elite[node.stage]) {
        type = 'elite';
        Game.toast('어둠 속에서 정예가 습격했다!', 2200);
      }
    }
    if (NODE_TYPES[type].combat) {
      const n = Object.assign({}, node, { type });
      openPreBattle(n);
    } else if (type === 'event') Game.go('event', { node });
    else Game.go(type, { node });
  },

  update(dt) { this.t += dt; },

  render(ctx) {
    const run = Game.run;
    drawDungeonBackdrop(ctx, this.t, 0.55);
    // 연결선
    ctx.lineWidth = 3;
    const stages = run.map.stages;
    for (let s = 0; s < stages.length - 1; s++) {
      for (const a of stages[s]) for (const b of stages[s + 1]) {
        if (b.type !== 'boss' && Math.abs(a.row - b.row) > 1) continue;
        const pa = mapNodePos(a), pb = mapNodePos(b);
        const walked = run.path.some((q) => q.stage === a.stage && q.row === a.row) && run.path.some((q) => q.stage === b.stage && q.row === b.row);
        const fromCur = run.pos.stage === a.stage && run.pos.row === a.row;
        ctx.strokeStyle = walked ? '#ffd34a' : fromCur ? 'rgba(255,230,170,0.75)' : 'rgba(140,120,190,0.35)';
        ctx.setLineDash(fromCur && !walked ? [8, 6] : []);
        ctx.lineDashOffset = -this.t * 20;
        ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
      }
    }
    // 입구 → 스테이지 1
    if (run.pos.stage === 0) {
      ctx.strokeStyle = 'rgba(255,230,170,0.75)';
      ctx.setLineDash([8, 6]);
      for (const b of stages[0]) { const pb = mapNodePos(b); ctx.beginPath(); ctx.moveTo(40, 318); ctx.lineTo(pb.x, pb.y); ctx.stroke(); }
    }
    ctx.setLineDash([]);
    // 파티 위치 마커
    let px = 40, py = 318;
    if (run.pos.stage > 0) { const p = mapNodePos(getNode(run.map, run.pos.stage, run.pos.row)); px = p.x; py = p.y; }
    const bob = Math.sin(this.t * 4) * 3;
    drawSprite(ctx, 'knight', px, py - 30 + bob, { scale: 2, t: this.t });
  },
};

// 지도/이벤트 화면 공용 배경: 돌벽 + 횃불
function drawDungeonBackdrop(ctx, t, dim) {
  const W = CONST.VIEW_W, H = CONST.VIEW_H;
  ctx.fillStyle = '#1d1828';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#262035';
  for (let y = 0; y < H; y += 36) {
    const off = (y / 36) % 2 ? 0 : 40;
    for (let x = -off; x < W; x += 80) { ctx.fillRect(x + 2, y + 2, 76, 32); }
  }
  for (const tx of [60, W - 60]) {
    const fl = 0.85 + Math.sin(t * 9 + tx) * 0.08 + Math.sin(t * 23 + tx) * 0.05;
    const g = ctx.createRadialGradient(tx, 140, 4, tx, 140, 170 * fl);
    g.addColorStop(0, 'rgba(255,170,80,0.35)');
    g.addColorStop(1, 'rgba(255,170,80,0)');
    ctx.fillStyle = g;
    ctx.fillRect(tx - 200, 0, 400, 360);
  }
  if (dim) { ctx.fillStyle = `rgba(10,8,16,${dim * 0.5})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- 06_battle_sim.js
// ===== 06_battle_sim.js : 실시간 파티 전투 시뮬레이션 (순수 로직) =====
// 2D 바닥 위 자유 이동: 근접은 달려들고, 원거리는 거리를 유지하고, 서로 겹칠 수 있다.
// 렌더/DOM을 모른다. step(dt)로만 진행하고 events[]에 연출용 이벤트를 쌓는다.
// 같은 시드 + 같은 입력(명령과 그 시점) → 같은 결과.


class BattleSim {
  // opts: { seed, stage, waves, heroes:[{id,hp,maxHp,upgrades}], relics, fruit, torchDark, strategy, autoMode, partySize }
  constructor(opts) {
    this.rng = makeRng(opts.seed >>> 0);
    this.uidSeq = 1; // 전투마다 새로 매기는 유닛 번호 (위치 분산 등에 쓰이므로 결정성 유지)
    this.stage = opts.stage || 1;
    this.scale = STAGE_SCALE[clamp(this.stage - 1, 0, STAGE_SCALE.length - 1)];
    this.waves = opts.waves.map((w) => w.slice());
    this.partyScale = PARTY_ENEMY_SCALE[clamp(opts.partySize || opts.heroes.length, 1, 3)] || 1;
    this.tier = opts.tier || { hp: 1, atk: 1 }; // 난이도 단계 배율 (보스 포함 모든 적)
    this.levelGap = opts.levelGap || 0;          // 파티 전투 레벨 − 던전 레벨 (영웅별 값은 hero.levelGap)
    // 영웅 AI 성향 (밸런스 측정용): none = 실제 게임(이동 판단은 플레이어 작전에 맡김)
    // gimmick = 차지 범위 회피 + 그로기 대상 집중 / brute = 기믹 무시하고 딜만
    this.aiProfile = opts.aiProfile || 'none';
    this.waveIndex = 0;
    this.waveTimer = -1;
    this.relics = new Set(opts.relics || []);
    this.fruit = opts.fruit || null;
    this.torchDark = !!opts.torchDark;
    this.strategy = opts.strategy || {};
    this.autoMode = opts.autoMode !== undefined ? opts.autoMode : true;
    this.order = 'hold';          // 작전: charge | hold | retreat
    this.focus = null;            // 집중 공격 대상 (적 유닛)
    this.time = 0;
    this.events = [];
    this.delayed = [];
    this.outcome = null;
    this.heroes = [];
    this.enemies = [];
    this.kills = 0;
    this.introT = CONST.BATTLE_INTRO;
    this.poiseLog = {}; this.breakLog = [];
    opts.heroes.forEach((h, i) => this.heroes.push(this._makeHero(h, i, opts.heroes.length)));
    this._spawnWave(0, true);
    if (this.relics.has('acorn')) for (const h of this.aliveHeroes()) this._heal(null, h, h.maxHp * 0.1, true);
    for (const h of this.aliveHeroes()) { const pv = this.passive(h, 'first_breath'); if (pv) h.ult = Math.min(100, h.ult + pv); }
  }

  // 갑옷 패시브(전투 규칙형) 수치. 없으면 0
  passive(u, key) { return (u.mods && u.mods.passives && u.mods.passives[key]) || 0; }
  // 차지·호출을 끊었을 때 (반딧불 신호)
  _onCancel(src) { const v = src && this.passive(src, 'firefly'); if (v) this._gainUltRaw(src, v); }

  // ------------------------------------------------------------ 생성
  _makeHero(h, i, n) {
    const def = HEROES[h.id];
    const m = h.mods || {};   // 장비 보정치 (equipStats 결과). hp는 호출 측에서 maxHp에 이미 반영
    const cap = CONST.STAT_CAPS;
    const y = lerp(CONST.FIELD_Y0 + 20, CONST.FIELD_Y1 - 14, n === 1 ? 0.5 : i / (n - 1));
    const u = {
      uid: this.uidSeq++, side: 'hero', key: h.id, def, name: def.name, sprite: def.sprite, role: def.role,
      hp: h.hp, maxHp: h.maxHp, atk: def.atk * (1 + (m.atk_pct || 0)) + (m.atk || 0),
      atkInterval: def.atkInterval / (1 + Math.min(m.aspd || 0, cap.aspd)),
      defPct: 1 - (1 - def.def) * (1 - Math.min(m.dr || 0, cap.dr)), size: 1, mods: m,
      melee: def.range === 'melee', reach: def.reach || 0, speed: def.moveSpeed * (1 + Math.min(m.mspd || 0, cap.mspd)),
      x: CONST.HERO_SPAWN_X - 140 - i * 20, y, tx: 0, ty: 0, face: 1, moving: false,
      atkTimer: 0.3 + this.rng() * 0.6, target: null, retarget: 0,
      statuses: {}, cds: { s1: 1 + this.rng(), s2: 3 + this.rng() * 2 }, ult: 0,
      levelGap: h.levelGap !== undefined ? h.levelGap : this.levelGap,
      upgrades: h.upgrades || {}, alive: h.hp > 0, castLock: 0, actLock: 0, ultDef: h.ultDef || null, casting: null,
      anim: { lunge: 0, lungeX: 0, lungeY: 0, hurt: 0, cast: 0 },
      stats: { dealt: 0, healed: 0, taken: 0, kills: 0 },
    };
    if (this.fruit && this.fruit.bonus > 0) u.statuses.fruit = { t: Infinity, value: this.fruit.bonus };
    return u;
  }

  _makeEnemy(id, x, y) {
    const def = ENEMIES[id];
    const sc = def.fixedScale ? 1 : this.scale;
    const hpMul = (def.fixedScale ? 1 : CONST.ENEMY_HP_MULT) * this.partyScale * this.tier.hp, atkMul = (def.fixedScale ? 1 : CONST.ENEMY_ATK_MULT) * this.tier.atk;
    return {
      uid: this.uidSeq++, side: 'enemy', key: id, def, name: def.name, sprite: def.sprite,
      hp: Math.round(def.hp * sc * hpMul), maxHp: Math.round(def.hp * sc * hpMul), atk: def.atk * sc * atkMul, atkInterval: def.atkInterval,
      defPct: def.def, size: def.size, melee: true, reach: 0, speed: def.moveSpeed || 60,
      x, y, tx: x, ty: y, face: -1, moving: false,
      atkTimer: 0.6 + this.rng() * 1.0, target: null, retarget: 0,
      statuses: {}, alive: true,
      charge: null, chargeCd: def.chargeEvery ? def.chargeEvery * (0.45 + this.rng() * 0.25) : 0,
      chargeEvery: def.chargeEvery, chargeTime: def.chargeTime, chargeMult: def.chargeMult, chargeR: def.chargeR,
      call: null, callCd: def.callEvery ? def.callEvery * (0.5 + this.rng() * 0.3) : 0,
      warcryCd: def.warcryEvery ? def.warcryEvery * 0.6 : 0,
      phase: 0, enraged: false,
      armor: def.armor || 0, poiseMax: def.poise || 0, poise: def.poise || 0, broken: 0, poiseBase: def.poise || 0,
      shaken: 0, regenDelay: 0, breakLock: 0, breaks: 0, stunHist: [], intr: null, unblocked: 0, enrageStacks: 0, armorBoost: 0,
      anim: { lunge: 0, lungeX: 0, lungeY: 0, hurt: 0, cast: 0 },
    };
  }

  _spawnWave(i, initial) {
    const ids = this.waves[i];
    ids.forEach((id, k) => {
      const y = lerp(CONST.FIELD_Y0 + 8, CONST.FIELD_Y1 - 8, ids.length === 1 ? 0.5 : k / (ids.length - 1));
      const x = (initial ? CONST.ENEMY_SPAWN_X + 150 : 1010) + (k % 2) * 40 + ENEMIES[id].size * 20;
      this.enemies.push(this._makeEnemy(id, x, y + (this.rng() - 0.5) * 10));
    });
    this.events.push({ type: 'wave', index: i, total: this.waves.length });
  }

  _summon(ids, by) {
    for (const id of ids) {
      if (this.aliveEnemies().length >= 7) break;
      const e = this._makeEnemy(id, clamp(by.x + 40 + this.rng() * 40, CONST.FIELD_X0, 990), clamp(by.y + (this.rng() - 0.5) * 70, CONST.FIELD_Y0, CONST.FIELD_Y1));
      this.enemies.push(e);
      this.events.push({ type: 'summon', unit: e, by });
    }
  }

  // ------------------------------------------------------------ 조회
  aliveHeroes() { return this.heroes.filter((u) => u.alive); }
  aliveEnemies() { return this.enemies.filter((u) => u.alive); }
  tankHero() { return this.heroes.find((h) => h.alive && h.role === 'tank') || null; }
  hpPct(u) { return u.hp / u.maxHp; }
  // 깊이(y)는 가중치를 줘서 위아래로는 덜 닿게
  dist(a, b) { const dx = a.x - b.x, dy = (a.y - b.y) * CONST.Y_WEIGHT; return Math.sqrt(dx * dx + dy * dy); }
  distXY(u, x, y) { const dx = u.x - x, dy = (u.y - y) * CONST.Y_WEIGHT; return Math.sqrt(dx * dx + dy * dy); }
  nearest(u, list) { let b = null, bd = 1e9; for (const o of list) { const d = this.dist(u, o); if (d < bd) { bd = d; b = o; } } return b; }
  attackRange(u, tgt) { return u.melee ? CONST.MELEE_RANGE + ((tgt && tgt.size) || 1) * 12 + (u.size - 1) * 14 : u.reach; }
  frontEnemy() { let b = null; for (const e of this.enemies) if (e.alive && (!b || e.x < b.x)) b = e; return b; }
  frontHero() { let b = null; for (const h of this.heroes) if (h.alive && (!b || h.x > b.x)) b = h; return b; }

  // ------------------------------------------------------------ 진행
  step(dt) {
    if (this.outcome) return;
    this.time += dt;
    for (let i = this.delayed.length - 1; i >= 0; i--) {
      const d = this.delayed[i];
      d.t -= dt;
      if (d.t <= 0) { this.delayed.splice(i, 1); d.fn(); }
    }
    if (this.focus && !this.focus.alive) { this.focus = null; this.events.push({ type: 'focusClear' }); }
    const intro = this.introT > 0;
    if (intro) this.introT -= dt;
    for (const u of this.heroes) if (u.alive) { if (!intro) this._tickUnit(u, dt); this._think(u, dt, intro); }
    for (const u of this.enemies) if (u.alive) { if (!intro) this._tickUnit(u, dt); this._think(u, dt, intro); }
    this._move(dt);
    for (const u of this.heroes.concat(this.enemies)) {
      u.anim.lunge = Math.max(0, u.anim.lunge - dt);
      u.anim.hurt = Math.max(0, u.anim.hurt - dt);
      u.anim.cast = Math.max(0, u.anim.cast - dt);
    }
    if (intro) return;
    if (this.autoMode) this._heroAI();
    if (this.aliveHeroes().length === 0) { this.outcome = 'lose'; this.events.push({ type: 'end', outcome: 'lose' }); return; }
    if (this.aliveEnemies().length === 0) {
      if (this.waveIndex < this.waves.length - 1) {
        if (this.waveTimer < 0) { this.waveTimer = CONST.WAVE_DELAY; this.events.push({ type: 'waveClear' }); }
        this.waveTimer -= dt;
        if (this.waveTimer <= 0) { this.waveTimer = -1; this.waveIndex++; this._spawnWave(this.waveIndex, false); }
      } else if (this.delayed.length === 0) { this.outcome = 'win'; this.events.push({ type: 'end', outcome: 'win' }); }
    }
  }

  // 대상 선택 + 가고 싶은 위치(tx, ty) 결정
  _think(u, dt, intro) {
    const F = CONST;
    u.retarget -= dt;
    if (u.side === 'hero') {
      const enemies = this.aliveEnemies();
      if (u.retarget <= 0 || !u.target || !u.target.alive) {
        u.retarget = F.RETARGET_SEC;
        if (this.focus && this.focus.alive) u.target = this.focus;
        else if (!enemies.length) u.target = null;
        else if (u.role === 'ranged') { let b = enemies[0]; for (const e of enemies) if (this.hpPct(e) < this.hpPct(b)) b = e; u.target = b; }
        else u.target = this.nearest(u, enemies);
      }
      if (this.aiProfile === 'gimmick') {
        const br = enemies.find((e) => e.broken > 0);
        if (br) u.target = br;
        const squishy = u.role !== 'tank' && (u.role !== 'melee' || this.hpPct(u) < 0.5);
        if (squishy) for (const e of enemies) if (e.charge && this.inChargeZone(u, e.charge)) { // 위험 범위 밖으로
          u.tx = clamp(e.charge.cx - e.charge.r - 30, F.FIELD_X0, F.FIELD_X1); u.ty = u.y; return;
        }
      }
      // 개별 명령 (캐릭터 끌기): 지점 이동 / 대상 공격
      const cmd = u.cmd;
      if (cmd && cmd.type === 'attack') { if (cmd.unit.alive) u.target = cmd.unit; else u.cmd = null; }
      if (cmd && cmd.type === 'move' && !intro) {
        u.tx = cmd.x; u.ty = cmd.y;
        if (u.target && !u.target.alive) u.target = null;
        return;
      }
      const tank = this.tankHero();
      const anchor = tank && tank !== u ? tank : this.frontHero();
      if (intro || !u.target) { // 입장/대기: 기본 대형
        const order = HERO_ORDER.indexOf(u.key);
        u.tx = F.HERO_SPAWN_X + 120 - order * 30; u.ty = u.y;
        return;
      }
      const t = u.target;
      if (this.order === 'retreat' && !u.cmd) {
        u.tx = F.FIELD_X0 + 40 + (u.melee ? 70 : 0); u.ty = clamp(u.y, F.FIELD_Y0, F.FIELD_Y1);
        return;
      }
      if (u.melee) { // 대상에게 붙는다 (대상 앞쪽, 살짝 위아래로 어긋나게)
        const r = this.attackRange(u, t) * 0.8;
        let side = u.x <= t.x ? -1 : 1;
        if (CONST.BREAK_V2 && t.poiseMax && u.role === 'melee' && t.face) side = -t.face; // 큰 적은 등 뒤에서 (후방 끊기)
        u.tx = clamp(t.x + side * r, CONST.FIELD_X0, CONST.FIELD_X1); u.ty = t.y + ((u.uid % 3) - 1) * 10;
      } else {
        const keep = this.order === 'charge' ? u.reach * 0.6 : u.reach * 0.88;
        let tx = t.x - keep;
        if (this.order === 'hold' && anchor && anchor.melee) tx = Math.min(tx, anchor.x - (u.role === 'support' ? 120 : 70));
        if (u.role === 'support') { // 서포터: 평타 사거리는 지키되, 많이 다친 동료가 있으면 그 뒤에 붙는다 (회복은 거리 제한 없음)
          tx = Math.max(tx, t.x - u.reach * 0.9);
          u.ty = t.y + 18;
          const hurt = this.aliveHeroes().filter((b) => b !== u && this.hpPct(b) < 0.6).reduce((a, b) => (!a || this.hpPct(b) < this.hpPct(a) ? b : a), null);
          if (hurt) { tx = Math.min(tx, hurt.x - 50); u.ty = hurt.y + 14; }
        } else u.ty = t.y + ((u.uid % 3) - 1) * 18;
        // 너무 가까이 붙은 적이 있으면 뒤로 빠진다
        const near = this.nearest(u, enemies);
        if (near && this.dist(u, near) < 70 && u.x > F.FIELD_X0 + 30) tx = Math.min(tx, u.x - 60);
        u.tx = tx;
      }
    } else {
      if (u.charge || u.call || u.def.immobile) { u.tx = u.x; u.ty = u.y; return; }
      const heroes = this.aliveHeroes();
      if (!heroes.length) return;
      if (u.statuses.taunt) { const tt = this.heroes.find((h) => h.uid === u.statuses.taunt.src.uid && h.alive); if (tt) { u.target = tt; u.retarget = CONST.TAUNT_LINGER; } } // 도발이 끝나도 잠시 탱커를 계속 노린다
      else if (u.retarget <= 0 || !u.target || !u.target.alive) {
        u.retarget = F.RETARGET_SEC * 2;
        const back = u.def.huntsBackline ? heroes.filter((h) => !h.melee) : [];
        const tankAggro = u.def.abilities.includes('boss') && heroes.find((h) => h.role === 'tank' && this.dist(u, h) < 320); // 보스는 가까운 탱커를 먼저 노린다 (위협)
        u.target = back.length ? this.nearest(u, back) : tankAggro ? tankAggro : u.size <= 1 && this.rng() < 0.3 ? heroes[Math.floor(this.rng() * heroes.length)] : this.nearest(u, heroes); // 사슴왕: 후열 사냥
      }
      if (intro) { u.tx = F.ENEMY_SPAWN_X - (u.uid % 3) * 30; u.ty = u.y; return; }
      const t = u.target;
      const r = this.attackRange(u, t) * 0.8;
      // 같은 대상을 노리는 적들은 둘러싸듯 흩어진다
      const slot = u.size > 1 ? 0 : (u.uid % 5) - 2; // 큰 적은 흩어지지 않는다 (사거리 밖에 멈추는 일 방지)
      u.tx = t.x + (u.x >= t.x ? 1 : -1) * (r + Math.abs(slot) * 8); u.ty = t.y + slot * 14;
    }
  }

  // 개별 명령: { type: 'move', x, y } | { type: 'attack', unit } | null (작전으로 복귀)
  command(h, cmd) {
    if (!h.alive || this.outcome) return false;
    if (cmd && cmd.type === 'move') cmd = { type: 'move', x: clamp(cmd.x, CONST.FIELD_X0, CONST.FIELD_X1), y: clamp(cmd.y, CONST.FIELD_Y0, CONST.FIELD_Y1) };
    if (cmd && cmd.type === 'attack' && !(cmd.unit && cmd.unit.alive && cmd.unit.side === 'enemy')) return false;
    h.cmd = cmd || null;
    if (cmd && cmd.type === 'attack') { h.target = cmd.unit; h.retarget = CONST.RETARGET_SEC; }
    this.events.push({ type: 'command', unit: h, cmd: h.cmd });
    return true;
  }
  travelling(u) { return !!(u.cmd && u.cmd.type === 'move' && Math.hypot(u.x - u.cmd.x, u.y - u.cmd.y) > 6); }
  clearCommands() { for (const h of this.heroes) h.cmd = null; }

  _move(dt) {
    const F = CONST;
    const all = this.heroes.concat(this.enemies).filter((u) => u.alive);
    for (const u of all) {
      if (u.statuses.stun || u.charge || u.call || u.broken > 0 || u.actLock > 0) { u.moving = false; continue; }
      const dx = u.tx - u.x, dy = u.ty - u.y;
      const d = Math.hypot(dx, dy);
      const fast = (u.side === 'enemy' && u.x > 960) || this.introT > 0 ? 2.2 : 1;
      const sp = u.speed * fast * (this.order === 'retreat' && u.side === 'hero' ? 1.25 : 1) * (u.statuses.slow ? 1 - u.statuses.slow.value : 1);
      if (d > 3) {
        const k = Math.min(1, (sp * dt) / d);
        u.x += dx * k; u.y += dy * k; u.moving = true;
        if (Math.abs(dx) > 2) u.face = dx > 0 ? 1 : -1;
      } else u.moving = false;
      if (u.target && u.target.alive && !u.moving) u.face = u.target.x >= u.x ? 1 : -1;
    }
    // 같은 편끼리 살짝만 밀어냄 (완전히 겹치는 것만 방지, 부분 겹침은 허용)
    for (const side of [this.heroes, this.enemies]) {
      const list = side.filter((u) => u.alive);
      for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j];
        const dx = b.x - a.x, dy = (b.y - a.y) * 1.6, d = Math.hypot(dx, dy) || 0.01;
        const minD = F.SEPARATION * (a.size + b.size) * 0.5;
        if (d < minD) { const push = (minD - d) * 0.5 * Math.min(1, dt * 8); a.x -= (dx / d) * push; b.x += (dx / d) * push; a.y -= (dy / d) * push * 0.4; b.y += (dy / d) * push * 0.4; }
      }
    }
    for (const u of all) {
      if (u.side === 'enemy' && u.x > 960) continue; // 입장 중
      u.x = clamp(u.x, F.FIELD_X0, F.FIELD_X1); u.y = clamp(u.y, F.FIELD_Y0, F.FIELD_Y1);
    }
  }

  _tickUnit(u, dt) {
    for (const k in u.statuses) {
      const s = u.statuses[k];
      if (s.dps) {
        s.acc = (s.acc || 0) + dt;
        if (s.acc >= 0.5) {
          s.acc -= 0.5;
          let dmg = s.dps * 0.5;
          if (k === 'bleed' && this.relics.has('whetstone')) dmg *= 1.5;
          if (k === 'burn' && this.relics.has('ember')) dmg *= 1.3;
          this._damage(s.src, u, dmg, { dot: k });
          if (!u.alive) return;
        }
      }
      if (k === 'regen') { s.acc = (s.acc || 0) + dt; if (s.acc >= 0.5) { s.acc -= 0.5; this._heal(s.src, u, u.maxHp * s.value * 0.5, true); } }
      s.t -= dt;
      if (s.t <= 0) delete u.statuses[k];
    }
    if (u.side === 'hero') {
      u.cds.s1 = Math.max(0, u.cds.s1 - dt);
      u.cds.s2 = Math.max(0, u.cds.s2 - dt);
      u.castLock = Math.max(0, u.castLock - dt);
      u.actLock = Math.max(0, u.actLock - dt);
      if (u.casting) { u.casting.t -= dt; if (u.casting.t <= 0) u.casting = null; }
      this._gainUlt(u, CONST.ULT_GAIN_TIME * dt);
    }
    const stunned = !!u.statuses.stun;
    if (u.side === 'enemy' && u.poiseMax) {
      if (u.broken > 0) {
        u.broken -= dt;
        if (u.broken <= 0) { u.broken = 0; u.poise = u.poiseMax; if (CONST.BREAK_V2) u.breakLock = CONST.BREAK_LOCK; this.events.push({ type: 'breakEnd', unit: u }); }
        return; // 그로기: 행동 불가
      }
      if (!CONST.BREAK_V2) u.poise = Math.min(u.poiseMax, u.poise + CONST.POISE_REGEN * dt);
      else {
        u.breakLock = Math.max(0, u.breakLock - dt);
        if (u.armorBoost > 0) u.armorBoost = Math.max(0, u.armorBoost - dt);
        if (u.intr) { u.intr.t -= dt; if (u.intr.t <= 0 || !(u.charge || u.call)) this._interruptFail(u); }
        if (u.shaken > 0) { u.shaken -= dt; if (u.shaken <= 0) { u.shaken = 0; u.regenDelay = CONST.SHAKE_REGEN_DELAY; this.events.push({ type: 'shakeEnd', unit: u }); } }
        else if (u.regenDelay > 0) u.regenDelay -= dt;
        else if (!(u.def.markStopsRegen && (u.statuses.vuln || u.statuses.exposed))) u.poise = Math.min(u.poiseMax, u.poise + (u.def.poiseRegen || CONST.POISE_REGEN) * (u.def.regenHalfBelow && u.hp < u.maxHp * u.def.regenHalfBelow ? 0.5 : 1) * dt);
      }
    }
    if (u.side === 'enemy') {
      this._enemyAbilities(u, dt, stunned);
      if (!u.alive || u.charge || u.call) return;
    }
    if (stunned) return;
    if (this.travelling(u)) return; // 이동 명령 수행 중: 새 공격을 시작하지 않음
    const speed = u.statuses.enrage ? 1 / (u.def.enrageSpeed || 0.6) : 1;
    u.atkTimer -= dt * speed * (u.statuses.slow ? 1 - u.statuses.slow.value : 1);
    if (u.atkTimer > 0) return;
    let tgt = u.target && u.target.alive ? u.target : null;
    // 보스 추격: 대상이 사거리 밖에 오래 있으면 덮쳐 든다 (멀리서 끌기만으로는 버틸 수 없게)
    if (u.side === 'enemy' && u.def.abilities.includes('boss') && tgt && u.x < 960) {
      if (this.dist(u, tgt) > this.attackRange(u, tgt) + 20) u.chase = (u.chase || 0) + u.atkInterval * 0.5 + 0.15;
      else u.chase = 0;
      if (u.chase >= CONST.BOSS_LEAP_AFTER) {
        u.chase = 0;
        const side = u.x >= tgt.x ? 1 : -1;
        u.x = clamp(tgt.x + side * this.attackRange(u, tgt) * 0.7, CONST.FIELD_X0, CONST.FIELD_X1); u.y = tgt.y;
        this.events.push({ type: 'dash', unit: u }); this.events.push({ type: 'bossLeap', unit: u, target: tgt });
      }
    }
    // 후퇴 중이거나 대상이 멀면, 사거리 안의 아무 적이나
    if (!tgt || this.dist(u, tgt) > this.attackRange(u, tgt)) {
      const foes = u.side === 'hero' ? this.aliveEnemies() : this.aliveHeroes();
      tgt = foes.find((f) => this.dist(u, f) <= this.attackRange(u, f)) || null;
    }
    if (tgt) { u.atkTimer = u.atkInterval * (0.95 + this.rng() * 0.1); this._basicAttack(u, tgt); }
    else u.atkTimer = 0.15;
  }

  _enemyAbilities(u, dt, stunned) {
    const d = u.def;
    if (d.abilities.includes('enrage') && !u.enraged && u.hp <= u.maxHp * d.enrageAt) {
      u.enraged = true; u.statuses.enrage = { t: Infinity };
      this.events.push({ type: 'enrage', unit: u });
    }
    if (d.phases) {
      while (u.phase < d.phases.length && u.hp <= u.maxHp * d.phases[u.phase].at) {
        const ph = d.phases[u.phase];
        u.phase++;
        if (ph.chargeR) u.chargeR = ph.chargeR;
        if (ph.chargeTime) u.chargeTime = ph.chargeTime;
        if (ph.chargeEvery) u.chargeEvery = ph.chargeEvery;
        if (ph.chargeMult) u.chargeMult = ph.chargeMult;
        if (ph.enrage) { u.statuses.enrage = { t: Infinity }; u.enraged = true; }
        if (ph.stunImmune) { u.stunImmune = true; delete u.statuses.stun; }
        u.chargeCd = Math.min(u.chargeCd, 2.5);
        this.events.push({ type: 'phase', unit: u, name: ph.name, phase: u.phase + 1 });
        if (ph.summon) this._summon(ph.summon, u);
      }
    }
    if (u.charge) {
      if (stunned && !d.stunNoCancel) this._cancelCast(u, (u.statuses.stun || {}).src);
      else if (!stunned) { u.charge.t -= dt; if (u.charge.t <= 0) this._chargeImpact(u); }
