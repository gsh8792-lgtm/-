<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120e18">
<title>숲속 원정대: 고블린 굴</title>
<style>
/* ===== 숲속 원정대 : UI 스타일 (논리 해상도 960×540 기준) ===== */
:root {
  --bg: #120e18; --panel: #231c33; --panel2: #2e2545; --line: #4a3f68;
  --text: #f3ead8; --muted: #a99cc0; --gold: #ffd34a; --gold2: #c8962a;
  --red: #d6504a; --green: #6fd86a; --blue: #7ab8f0; --purple: #8a6af0;
  --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; overscroll-behavior: none; }
body { font-family: var(--font); color: var(--text); -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
#app { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: radial-gradient(ellipse at center, #1c1626 0%, #0b0810 100%); }
#stage { position: absolute; left: 0; top: 0; width: 960px; height: 540px; transform-origin: 0 0; overflow: hidden; background: #1d1828; box-shadow: 0 0 40px rgba(0,0,0,.6); }
#cv { position: absolute; inset: 0; width: 960px; height: 540px; touch-action: none; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui button, #ui select, #ui input, #ui .pcard, #ui .scroll { pointer-events: auto; }
canvas.pcv { display: block; }
#rotate { display: none; position: fixed; inset: 0; z-index: 99; background: rgba(10,8,16,.94); color: var(--text); font-size: 22px; text-align: center; padding-top: 40vh; line-height: 1.6; }
body.portrait #rotate { display: block; }
.hidden { display: none !important; }
.muted { color: var(--muted); font-size: 13px; }
.warn { color: #ff9a7a; }
small { font-size: .78em; color: var(--muted); font-weight: 500; }

/* ---------- 버튼 */
.btn { font-family: var(--font); font-size: 16px; font-weight: 700; color: var(--text); background: linear-gradient(#3a3058, #2b2343); border: 2px solid var(--line); border-radius: 12px; min-height: 64px; min-width: 64px; padding: 6px 16px; cursor: pointer; box-shadow: 0 3px 0 #120e1c; transition: transform .06s, filter .1s; touch-action: manipulation; white-space: nowrap; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #120e1c; }
.btn:disabled { opacity: .45; cursor: default; filter: grayscale(.6); }
.btn.primary { background: linear-gradient(#ffd96a, #e8a83a); color: #2b1d10; border-color: #fff0a0; }
.btn.danger { background: linear-gradient(#e0645a, #a8382f); border-color: #ff9a8a; }
.btn.ghost { background: rgba(30,24,46,.7); }
.btn.small { min-height: 64px; font-size: 15px; padding: 4px 14px; }
.btn.big { min-height: 68px; font-size: 19px; padding: 8px 26px; }
.btn.choice { display: flex; flex-direction: column; align-items: flex-start; text-align: left; white-space: normal; width: 100%; min-height: 64px; padding: 8px 16px; }
.btn.choice small { display: block; margin-top: 2px; }
.btn.choice.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
.btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.btn-col { display: flex; flex-direction: column; gap: 10px; }
.seg { display: inline-flex; background: #15111f; border: 2px solid var(--line); border-radius: 12px; padding: 2px; gap: 2px; }
.seg-btn { min-height: 64px; min-width: 66px; border: none; box-shadow: none; background: transparent; border-radius: 9px; padding: 4px 12px; color: var(--muted); }
.seg-btn.on { background: linear-gradient(#ffd96a, #e8a83a); color: #2b1d10; }

/* ---------- 바 */
.bar { height: 8px; background: rgba(0,0,0,.55); border-radius: 4px; overflow: hidden; border: 1px solid rgba(0,0,0,.6); }
.bar .fill { height: 100%; background: var(--green); transition: width .15s; }
.bar.hp.low .fill { background: #e0a040; }
.bar.hp.enemy .fill { background: #e0524a; }
.bar.ult .fill { background: #7ad0ff; }
.bar.ult.ready .fill { background: linear-gradient(90deg, #ffd34a, #fff0a0, #ffd34a); animation: glow 1s infinite alternate; }
.bar.torch { width: 70px; height: 10px; }
.bar.torch .fill { background: linear-gradient(90deg, #ff6a2a, #ffd34a); }
.bar.charge { height: 5px; }
.bar.charge .fill { background: #ff5a3a; transition: none; }
@keyframes glow { from { filter: brightness(1); } to { filter: brightness(1.5); } }

/* ---------- 모달 / 오버레이 */
.overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20; }
.overlay.show { display: flex; }
.overlay.dim { background: rgba(8,6,14,.62); }
.modal { box-sizing: border-box; max-width: 930px !important; background: linear-gradient(#2c2442, #1f1930); border: 2px solid var(--line); border-radius: 16px; padding: 16px 20px; max-width: 900px; max-height: 520px; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.6); animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-title { font-size: 21px; font-weight: 900; color: var(--gold); margin-bottom: 10px; }
.modal-title small { margin-left: 8px; }
.hint-box { width: 520px; }
.hint-title { color: var(--gold); font-weight: 900; font-size: 18px; margin-bottom: 6px; }
.hint-text { font-size: 17px; line-height: 1.55; margin-bottom: 14px; }
.hint-box .btn { width: 100%; }
.confirm-box { width: 460px; text-align: center; }
.confirm-box p { line-height: 1.5; font-size: 16px; }
.help-box { width: 820px; }
.help-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 15px; line-height: 1.5; }
.help-cols h4 { margin: 4px 0; color: var(--blue); }
.help-cols ul { margin: 0; padding-left: 18px; }
.help-box > .btn { display: block; margin: 12px auto 0; min-width: 160px; }
.pick-box { width: 640px; }
.pick-box > .btn { display: block; margin: 12px auto 0; }
.pause-box { width: 420px; }
.pause-box .btn-col .btn { width: 100%; }
.pause-stats { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
.seed-input { width: 100%; font-size: 22px; padding: 10px; border-radius: 10px; border: 2px solid var(--line); background: #15111f; color: var(--text); text-align: center; font-family: var(--font); }

/* 토스트 */
#toasts { position: absolute; left: 0; right: 0; top: 76px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 30; }
.toast { background: rgba(20,14,30,.92); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; font-size: 15px; font-weight: 700; animation: pop .15s; transition: opacity .4s, transform .4s; max-width: 640px; text-align: center; }
.toast.out { opacity: 0; transform: translateY(-10px); }

/* ---------- 파티 패널 / 자원 */
.party-panel { display: flex; gap: 6px; }
.pcard { position: relative; display: flex; align-items: center; gap: 6px; background: rgba(28,22,42,.92); border: 2px solid var(--line); border-radius: 10px; padding: 4px 8px 4px 4px; min-width: 150px; min-height: 52px; }
.pcard canvas { background: #3a3052; border-radius: 6px; }
.pcard .pinfo { flex: 1; min-width: 0; }
.pcard .pname { font-size: 13px; font-weight: 800; white-space: nowrap; }
.pcard .prole { font-size: 11px; color: var(--muted); margin-left: 4px; font-weight: 500; }
.pcard .bar { margin: 3px 0 2px; }
.pcard .php { font-size: 11px; color: var(--muted); }
.pcard .pup { position: absolute; right: 4px; top: 2px; font-size: 11px; color: var(--gold); }
.pcard.dead { opacity: .55; }
.pcard.dead .pname { text-decoration: line-through; }
.pcard.selectable { cursor: pointer; }
.pcard.selectable:hover, .pcard.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
.party-panel.compact .pcard { min-width: 0; flex: 1; }
.res-bar { display: flex; gap: 8px; align-items: center; }
.res { display: flex; align-items: center; gap: 5px; background: rgba(15,11,22,.85); border: 1px solid var(--line); border-radius: 9px; padding: 3px 9px; font-size: 15px; font-weight: 800; min-height: 32px; }
.res i { font-style: normal; font-size: 14px; }
.res.gold i { color: var(--gold); }
.res.torch.low .fill { background: #ff6a2a; }
.res.torch.dark { border-color: #ff5a3a; animation: glow .6s infinite alternate; }
.res.relics { gap: 3px; }
.relic-ic { font-size: 18px; cursor: pointer; pointer-events: auto; padding: 0 2px; position: relative; }
.relic-ic::after { content: ''; position: absolute; inset: -18px -8px; } /* 터치 영역 확장 */
.fruit-ic { font-size: 13px; color: #ff9ad0; }

/* ---------- 지도 */
.map-top { position: absolute; left: 10px; right: 10px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
.map-hdr { display: flex; justify-content: space-between; align-items: center; }
.map-title { font-size: 19px; font-weight: 900; color: var(--gold); text-shadow: 0 2px 0 #000; }
.map-nodes { position: absolute; inset: 0; }
.map-node { position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); background: var(--nc); color: #fff; font-family: var(--font); font-size: 22px; font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,.5); cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.4); }
.map-node.t-boss { width: 88px; height: 88px; margin: -44px 0 0 -44px; font-size: 32px; border-color: #ffb0a0; }
.map-node.locked { filter: brightness(.55) saturate(.6); }
.map-node.visited { filter: brightness(.7); border-color: var(--gold); }
.map-node.current { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255,211,74,.4), 0 4px 0 rgba(0,0,0,.4); filter: none; }
.map-node.reachable { border-color: #fff0a0; animation: nodePulse 1.1s infinite; filter: none; }
@keyframes nodePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,230,140,.7), 0 4px 0 rgba(0,0,0,.4); } 50% { box-shadow: 0 0 0 9px rgba(255,230,140,0), 0 4px 0 rgba(0,0,0,.4); } }
.stage-num { position: absolute; top: 156px; transform: translateX(-50%); font-size: 18px; font-weight: 900; color: var(--muted); }
.stage-num.next { color: var(--gold); }
.map-legend { position: absolute; left: 12px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); max-width: 640px; }
.map-legend b { display: inline-block; width: 20px; height: 20px; border-radius: 50%; text-align: center; color: #fff; line-height: 20px; font-size: 12px; margin-right: 4px; }
.map-actions { position: absolute; right: 10px; bottom: 8px; display: flex; gap: 6px; }
.map-info { position: absolute; right: 10px; top: 168px; width: 300px; background: rgba(28,22,42,.96); border: 2px solid var(--gold2); border-radius: 12px; padding: 10px 12px; pointer-events: auto; box-shadow: 0 8px 20px rgba(0,0,0,.5); z-index: 5; }
.map-info.left { right: auto; left: 10px; }
.mi-title { font-size: 18px; font-weight: 900; }
.mi-title b { display: inline-block; width: 28px; height: 28px; border-radius: 50%; text-align: center; line-height: 28px; margin-right: 4px; }
.mi-desc { font-size: 14px; line-height: 1.45; margin: 6px 0; color: #e6dcf0; }
.mi-warn { color: #ff9a7a; font-size: 13px; margin-bottom: 4px; }
.mi-locked { color: var(--muted); font-size: 13px; align-self: center; }
.mi-btns { display: flex; gap: 8px; justify-content: flex-end; }

/* ---------- 전투 */
.b-top { position: absolute; left: 0; right: 0; top: 0; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: linear-gradient(rgba(14,10,22,.92), rgba(14,10,22,.6)); }
.b-stage { font-size: 16px; font-weight: 800; min-width: 220px; }
.b-pause { min-height: 64px; font-size: 16px; background: transparent; border-color: transparent; box-shadow: none; }
.b-pause .pz { letter-spacing: -2px; margin-right: 4px; }
.b-right { display: flex; gap: 6px; align-items: center; min-width: 220px; justify-content: flex-end; }
.b-right .btn.small { min-height: 64px; min-width: 64px; padding: 2px 10px; }
.b-speed.on { border-color: var(--gold); color: var(--gold); }
.b-chips { position: absolute; top: 72px; right: 8px; left: 230px; display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
.chips-label { font-size: 14px; font-weight: 800; color: var(--muted); margin-right: 4px; order: -1; }
.chip { position: relative; display: flex; align-items: center; gap: 4px; width: 110px; height: 64px; padding: 3px 5px 8px; background: rgba(36,28,54,.94); border: 2px solid var(--line); border-radius: 10px; cursor: pointer; font-family: var(--font); color: var(--text); }
.chip canvas { background: #3a3052; border-radius: 5px; flex: none; }
.chip-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.chip-st { display: flex; gap: 2px; flex-wrap: wrap; height: 18px; overflow: hidden; }
.chip .bar.charge { position: absolute; left: 6px; right: 6px; bottom: 3px; display: none; }
.chip.charging { border-color: #ff5a3a; animation: chargeBlink .3s infinite alternate; }
.chip.charging .bar.charge { display: block; }
.chip.boss { width: 136px; border-color: #c88a58; }
@keyframes chargeBlink { from { box-shadow: 0 0 0 0 rgba(255,90,58,.8); } to { box-shadow: 0 0 10px 3px rgba(255,90,58,.8); } }
.chip.targetable { border-color: #fff0a0; }
.chip.targeted, .chip.inarea { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold); background: #4a3c2a; }
.sti { display: inline-flex; align-items: center; height: 17px; padding: 0 3px; border-radius: 4px; font-size: 11px; font-weight: 900; color: #1a0f08; font-style: normal; }
.sti i { font-style: normal; font-size: 9px; margin-left: 1px; opacity: .85; }
.b-tmsg { position: absolute; left: 50%; top: 144px; transform: translateX(-50%); background: rgba(20,30,60,.92); border: 2px solid var(--blue); border-radius: 12px; padding: 8px 16px; font-size: 16px; white-space: nowrap; z-index: 4; }
.tm-pause { color: var(--blue); font-weight: 900; margin-right: 6px; }
.b-hud { position: absolute; left: 0; right: 0; bottom: 0; height: 130px; display: flex; gap: 10px; padding: 8px 10px; background: linear-gradient(rgba(20,15,30,.88), rgba(14,10,22,.98)); border-top: 2px solid #3a3052; }
.b-ports { display: flex; gap: 6px; }
.bport { position: relative; width: 82px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px; background: rgba(46,37,69,.9); border: 2px solid var(--line); border-radius: 10px; cursor: pointer; pointer-events: auto; }
.bport canvas { background: #3a3052; border-radius: 6px; }
.bport .bar { width: 100%; }
.bport .bar.ult { height: 5px; }
.bp-name { font-size: 14px; font-weight: 800; }
.bp-stat { position: absolute; top: 2px; left: 2px; right: 2px; display: flex; gap: 1px; flex-wrap: wrap; }
.bp-stat .sti { height: 14px; font-size: 9px; padding: 0 2px; }
.bp-stat .sti i { display: none; }
.bp-dead { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; font-size: 46px; color: #ff5a4a; text-shadow: 0 2px 0 #000; background: rgba(0,0,0,.45); border-radius: 8px; }
.bport.dead { filter: grayscale(1); }
.bport.dead .bp-dead { display: flex; }
.bport.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
.bport.targetable { border-color: #9cf0a8; animation: glow .5s infinite alternate; }
.bport.targeted, .bport.inarea { border-color: #6fe08a; box-shadow: 0 0 0 3px #6fe08a; }
.b-skills { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.bs-name { font-size: 15px; height: 20px; }
.bs-row { display: flex; gap: 12px; }
.sbtn { position: relative; width: 74px; height: 74px; border-radius: 50%; border: 3px solid var(--line); font-family: var(--font); color: #fff; cursor: pointer; pointer-events: auto; padding: 0; overflow: hidden;
  background: conic-gradient(rgba(10,8,18,.78) calc(var(--cd, 0) * 360deg), transparent 0) , radial-gradient(circle at 40% 35%, #5a4f8a, #2e2650); }
.sbtn-ult { background: conic-gradient(rgba(10,8,18,.78) calc(var(--cd, 0) * 360deg), transparent 0), radial-gradient(circle at 40% 35%, #b05a5a, #5a2a3a); }
.sbtn.ready { border-color: #b8a8ff; }
.sbtn-ult.ready { border-color: var(--gold); animation: ultReady 0.8s infinite alternate; }
@keyframes ultReady { from { box-shadow: 0 0 0 0 rgba(255,211,74,.7); } to { box-shadow: 0 0 14px 4px rgba(255,211,74,.9); } }
.sbtn.active { border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold); }
.sb-key { position: absolute; top: 9px; left: 0; right: 0; font-size: 24px; font-weight: 900; text-shadow: 0 2px 0 #000; }
.sb-cd { position: absolute; top: 9px; left: 0; right: 0; font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #000; }
.sbtn:not(.ready) .sb-key { opacity: .35; }
.sbtn.cooling .sb-key { visibility: hidden; }
.sb-lab { position: absolute; bottom: 9px; left: 3px; right: 3px; font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bs-hint { font-size: 13px; color: var(--muted); }
.bs-confirm { position: absolute; inset: 0; display: flex; gap: 12px; align-items: center; justify-content: center; background: rgba(14,10,22,.96); border-radius: 12px; }
.bs-confirm .btn { min-width: 150px; min-height: 72px; font-size: 22px; }
#ui.targeting .b-hud { border-top-color: var(--blue); }

/* ---------- 필드 */
.f-top { position: absolute; left: 10px; right: 10px; top: 8px; display: flex; justify-content: space-between; align-items: center; }
.f-title { font-size: 18px; font-weight: 900; text-shadow: 0 2px 0 #000; background: rgba(10,20,20,.5); padding: 6px 12px; border-radius: 10px; }
.f-right { display: flex; gap: 8px; }
.f-res { position: absolute; left: 12px; top: 60px; display: flex; gap: 8px; font-size: 14px; font-weight: 700; }
.f-res span { background: rgba(10,20,20,.6); padding: 4px 10px; border-radius: 8px; }
.f-act { position: absolute; right: 26px; bottom: 30px; min-width: 150px; min-height: 76px; font-size: 22px; border-radius: 40px; }

.dialog-box { width: 600px; }
.dlg-head { display: flex; align-items: center; gap: 10px; }
.dlg-head canvas { background: #3a3052; border-radius: 8px; }
.dlg-name { font-weight: 900; font-size: 17px; }
.dlg-title { font-size: 19px; color: var(--gold); font-weight: 900; margin: 10px 0 6px; }
.dlg-body { font-size: 16px; line-height: 1.6; }

/* ---------- 타이틀 */
.title-box { position: absolute; left: 0; right: 0; top: 30px; display: flex; flex-direction: column; align-items: center; }
.title-logo { font-size: 56px; font-weight: 900; color: var(--gold); letter-spacing: 2px; text-shadow: 0 4px 0 #6a3a10, 0 8px 18px rgba(0,0,0,.7); }
.title-sub { font-size: 18px; color: #e8d8f8; margin: 2px 0 14px; text-shadow: 0 2px 0 #000; }
.title-box .btn-col { width: 260px; }
.title-box .btn-col .btn { min-height: 48px; }
.title-seed { margin-top: 6px; font-size: 13px; color: var(--muted); }
.title-foot { position: absolute; right: 10px; bottom: 6px; font-size: 12px; color: var(--muted); }

/* ---------- 공용 장면 박스 */
.scene-title { font-size: 26px; font-weight: 900; color: var(--gold); margin-bottom: 8px; text-shadow: 0 2px 0 #000; }
.scene-title small { font-size: 15px; margin-left: 8px; }
.reward-box, .event-box, .shop-box, .rest-box, .tree-box, .result-box { position: absolute; background: rgba(28,22,42,.94); border: 2px solid var(--line); border-radius: 16px; padding: 14px 20px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
#ui > .res-bar { position: absolute; left: 12px; top: 10px; }
#ui > .party-panel.compact { position: absolute; left: 12px; right: 12px; bottom: 8px; }

.reward-box { left: 120px; right: 120px; top: 50px; text-align: center; }
.reward-gold { font-size: 20px; font-weight: 800; color: var(--gold); }
.reward-sub { margin: 8px 0; color: var(--muted); font-size: 15px; }
.reward-cards { display: flex; gap: 12px; justify-content: center; }
.rcard { width: 200px; min-height: 196px; padding: 10px; border-radius: 14px; border: 2px solid var(--line); background: linear-gradient(#3a3058, #251e38); color: var(--text); font-family: var(--font); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: 0 4px 0 #120e1c; }
.rcard.sel { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold), 0 4px 0 #120e1c; transform: translateY(-4px); }
.rc-kind { font-size: 12px; color: var(--muted); font-weight: 700; }
.rc-icon { font-size: 40px; height: 54px; line-height: 54px; color: var(--gold); }
.rc-title { font-size: 16px; font-weight: 900; }
.rc-desc { font-size: 13px; color: #d8cce8; line-height: 1.4; }

// mulberry32 — 같은 시드면 같은 수열 (언리얼 FRandomStream 대응)
function makeRng(seed) {
  let a = seed >>> 0;
  const rng = function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.int = (lo, hi) => lo + Math.floor(rng() * (hi - lo + 1)); // [lo, hi]
  rng.pick = (arr) => arr[Math.floor(rng() * arr.length)];
  rng.chance = (p) => rng() < p;
  rng.weighted = (entries) => { // [[key, weight], ...]
    let total = 0;
    for (const e of entries) total += e[1];
    let r = rng() * total;
    for (const e of entries) { r -= e[1]; if (r < 0) return e[0]; }
    return entries[entries.length - 1][0];
  };
  rng.shuffle = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };
  return rng;
}

    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

// ===== 02_sprites.js : 페인터리 치비 캐릭터 아트 (코드 드로잉) =====
// 목표 화풍: 2.5등신 판타지 치비(갑옷·가죽·천 재질감, 큰 눈, 탁하고 따뜻한 팔레트).

//   (좌상단 광원 + 하단 앰비언트 그림자)으로 그려 화풍을 통일한다.
// - 단위 좌표계: 발 중앙이 (0,0), 위가 음수. 영웅 키 ≈ 100 단위.
// - 레이어: back(망토/포니테일/화살통) · body · head(머리+얼굴+모자). 아이들 애니메이션은 레이어별 오프셋.
// - 실제 이미지 에셋으로 교체: SPRITE_IMAGE_OVERRIDES[name] = 'path/or/dataURI.png' 를 지정하면
//   해당 PNG(발 중앙 하단 기준)를 그린다. (언리얼 이식 시 Paper2D/텍스처로 대응)

const SPRITE_IMAGE_OVERRIDES = {};
const UNIT_TO_PX = 0.36; // 기존 scale 인자(3 = 전투)와 호환: 높이 100단위 × 0.36 × 3 ≈ 108px

// ---------------------------------------------------------------- 색 유틸
function hexRgb(hex) { const v = parseInt(hex.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; }
function mix(hex, k, to) {
  const [r, g, b] = hexRgb(hex);
  const t = to === 'w' ? [255, 248, 235] : [28, 16, 22];
  return `rgb(${Math.round(r + (t[0] - r) * k)},${Math.round(g + (t[1] - g) * k)},${Math.round(b + (t[2] - b) * k)})`;
}
const LT = (h, k) => mix(h, k, 'w');
const DK = (h, k) => mix(h, k, 'k');
const INK = '#2b1a14';

// ---------------------------------------------------------------- 재질 그리기 헬퍼
function paint(ctx, path, base, bb, kind, opt) {
  opt = opt || {};
  const [x0, y0, x1, y1] = bb;
  const w = x1 - x0, h = y1 - y0;
  let g;
  if (kind === 'metal') {
    g = ctx.createLinearGradient(x0, y0, x0 + w * 0.35, y1);
    g.addColorStop(0, LT(base, 0.55)); g.addColorStop(0.28, LT(base, 0.12)); g.addColorStop(0.5, DK(base, 0.28));
    g.addColorStop(0.68, LT(base, 0.25)); g.addColorStop(1, DK(base, 0.45));
  } else {
    const cx = x0 + w * (opt.lx !== undefined ? opt.lx : 0.32), cy = y0 + h * (opt.ly !== undefined ? opt.ly : 0.25);
    g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * (kind === 'skin' ? 0.95 : 1.05));
    const hi = kind === 'skin' ? 0.22 : kind === 'leather' ? 0.16 : kind === 'gold' ? 0.5 : 0.2;
    const lo = kind === 'skin' ? 0.22 : kind === 'leather' ? 0.42 : kind === 'gold' ? 0.45 : 0.38;
    g.addColorStop(0, LT(base, hi)); g.addColorStop(0.45, base); g.addColorStop(1, DK(base, lo));
  }
  ctx.beginPath(); path(ctx);
  ctx.fillStyle = g; ctx.fill();
  if (opt.outline !== false) {
    ctx.lineJoin = 'round'; ctx.lineWidth = opt.lw || 1.5;
    ctx.strokeStyle = opt.ink || DK(base, 0.72);
    ctx.stroke();
  }
  if (kind === 'metal' && opt.shine !== false) {
    ctx.save(); ctx.beginPath(); path(ctx); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x0 + w * 0.22, y0 + h * 0.12); ctx.lineTo(x0 + w * 0.3, y0 + h * 0.55); ctx.stroke();
    ctx.restore();
  }
}
const ell = (cx, cy, rx, ry, rot) => (c) => c.ellipse(cx, cy, rx, ry, rot || 0, 0, Math.PI * 2);
const poly = (pts) => (c) => { c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); };
const rrect = (x, y, w, h, r) => (c) => { if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); };
function blob(ctx, cx, cy, rx, ry, base, kind, opt) { paint(ctx, ell(cx, cy, rx, ry, opt && opt.rot), base, [cx - rx, cy - ry, cx + rx, cy + ry], kind, opt); }
function shape(ctx, pts, base, kind, opt) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i < pts.length; i += 2) { x0 = Math.min(x0, pts[i]); x1 = Math.max(x1, pts[i]); y0 = Math.min(y0, pts[i + 1]); y1 = Math.max(y1, pts[i + 1]); }
  paint(ctx, opt && opt.smooth ? smoothPath(pts) : poly(pts), base, [x0, y0, x1, y1], kind, opt);
}
function smoothPath(pts) {
  return (c) => {
    const n = pts.length / 2;
    const P = (i) => [pts[(i % n) * 2], pts[(i % n) * 2 + 1]];
    c.moveTo((P(0)[0] + P(1)[0]) / 2, (P(0)[1] + P(1)[1]) / 2);
    for (let i = 1; i <= n; i++) {
      const p = P(i), q = P(i + 1);
      c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
    }
    c.closePath();
  };
}
function line(ctx, pts, color, w, cap) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = cap || 'round'; ctx.stroke();
}
function curve(ctx, x0, y0, cx, cy, x1, y1, color, w) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1);
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke();
}
function rivets(ctx, pts, r) { for (let i = 0; i < pts.length; i += 2) { ctx.fillStyle = '#f0e6d0'; ctx.beginPath(); ctx.arc(pts[i], pts[i + 1], r || 0.9, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(40,20,10,0.5)'; ctx.beginPath(); ctx.arc(pts[i] + 0.4, pts[i + 1] + 0.4, (r || 0.9) * 0.5, 0, 7); ctx.fill(); } }
function stitch(ctx, pts, color) { ctx.save(); ctx.setLineDash([1.6, 1.4]); line(ctx, pts, color || 'rgba(255,235,200,0.55)', 0.7); ctx.restore(); }

// ---------------------------------------------------------------- 공용 신체 파츠
const SKIN = '#f1c8a2';

function eye(ctx, cx, cy, w, h, iris, opt) {
  opt = opt || {};
  if (opt.blink) { curve(ctx, cx - w, cy + 0.5, cx, cy + h * 0.55, cx + w, cy + 0.2, INK, 1.4); return; }
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx, cy, w, h, 0, 0, 7); ctx.fillStyle = opt.sclera || '#fffaf2'; ctx.fill();
  ctx.clip();
  const g = ctx.createLinearGradient(cx, cy - h, cx, cy + h);
  g.addColorStop(0, DK(iris, 0.55)); g.addColorStop(0.55, iris); g.addColorStop(1, LT(iris, 0.45));
  ctx.beginPath(); ctx.ellipse(cx + w * 0.12, cy + h * 0.1, w * 0.78, h * 0.86, 0, 0, 7); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = DK(iris, 0.8);
  if (opt.slit) { ctx.beginPath(); ctx.ellipse(cx + w * 0.12, cy + h * 0.1, w * 0.18, h * 0.7, 0, 0, 7); ctx.fill(); }
  else { ctx.beginPath(); ctx.ellipse(cx + w * 0.15, cy + h * 0.15, w * 0.36, h * 0.42, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(cx - w * 0.2, cy - h * 0.3, w * 0.28, h * 0.22, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + w * 0.4, cy + h * 0.45, w * 0.13, 0, 7); ctx.fill();

const SpriteCache = {};
const _imgCache = {};

function getSprite(name) {
  const d = ART[name];
  return { w: (d.box[2] - d.box[0]) * UNIT_TO_PX * 0.7, h: d.top * UNIT_TO_PX };
}

function renderLayer(name, layer, variant, k) {
  const d = ART[name];
  const fn = d[layer];
  if (!fn) return null;
  const [x0, y0, x1, y1] = d.box;
  const cv = document.createElement('canvas');
  cv.width = Math.ceil((x1 - x0) * k); cv.height = Math.ceil((y1 - y0) * k);
  const c = cv.getContext('2d');
  c.setTransform(k, 0, 0, k, -x0 * k, -y0 * k);
  fn.call(d, c, variant === 'blink');
  // 통일 조명: 위 따뜻한 빛 / 아래 차가운 그림자 (모든 캐릭터 공통)
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = 'source-atop';
  const g = c.createLinearGradient(0, 0, cv.width * 0.3, cv.height);
  g.addColorStop(0, 'rgba(255,236,200,0.16)'); g.addColorStop(0.55, 'rgba(255,236,200,0)'); g.addColorStop(1, 'rgba(30,20,50,0.28)');
  c.fillStyle = g; c.fillRect(0, 0, cv.width, cv.height);
  if (variant === 'white' || variant === 'red' || variant === 'dark') {
    c.fillStyle = variant === 'white' ? '#ffffff' : variant === 'red' ? '#ff3a2a' : '#000000';
    c.fillRect(0, 0, cv.width, cv.height);
  }
  c.globalCompositeOperation = 'source-over';
  return cv;
}
function layerCanvas(name, layer, variant, k) {
  const key = `${name}|${layer}|${variant}|${k}`;
  if (!(key in SpriteCache)) SpriteCache[key] = renderLayer(name, layer, variant, k);
  return SpriteCache[key];
}

// opt: { scale, flip, t, phase, blinking, tint:'white'|'red'|'dark', tintAlpha, squash, alpha }
function drawSprite(ctx, name, x, y, opt) {
  const d = ART[name];
  const sc = opt.scale || 3;
  const ppu = sc * UNIT_TO_PX;
  const dpr = Math.max(1, Math.min(2, (typeof Game !== 'undefined' && Game.pixelRatio) || 1));
  const k = Math.ceil(ppu * dpr * 2) / 2;
  const t = opt.t || 0, ph = opt.phase || 0;
  const breathe = Math.sin(t * 2.6 + ph);
  const sy = (1 + breathe * 0.018) * (opt.squash || 1);
  const sx = (1 - breathe * 0.008) / (opt.squash ? Math.sqrt(opt.squash) : 1);
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.translate(x, y);
  if (opt.flip) ctx.scale(-1, 1);
  ctx.scale(sx * ppu / k, sy * ppu / k);
  if (opt.alpha !== undefined) ctx.globalAlpha = opt.alpha;
  const ovr = SPRITE_IMAGE_OVERRIDES[name];
  if (ovr) {
    let img = _imgCache[ovr];
    if (!img) { img = _imgCache[ovr] = new Image(); img.src = ovr; }
    if (img.complete && img.naturalWidth) { const h = d.top * k * 1.1, w = img.naturalWidth / img.naturalHeight * h; ctx.drawImage(img, -w / 2, -h, w, h); ctx.restore(); return; }
  }
  const ox = d.box[0] * k, oy = d.box[1] * k;
  const headDy = Math.sin(t * 2.6 + ph - 0.6) * 0.7 * k;
  const backDx = Math.sin(t * 2.0 + ph) * 1.1 * k;
  const v = opt.tint === 'white' ? 'white' : opt.tint === 'dark' ? 'dark' : null;
  const draw = (layer, dx, dy, vv) => { const cv = layerCanvas(name, layer, vv, k); if (cv) ctx.drawImage(cv, ox + dx, oy + dy); };
  draw('back', backDx, 0, v || 'normal');
  draw('body', 0, 0, v || 'normal');
  draw('head', 0, headDy, v || (opt.blinking ? 'blink' : 'normal'));
  if (opt.tint === 'red' && opt.tintAlpha) {
    ctx.globalAlpha = (opt.alpha === undefined ? 1 : opt.alpha) * opt.tintAlpha;
    draw('back', backDx, 0, 'red'); draw('body', 0, 0, 'red'); draw('head', 0, headDy, 'red');
  }
  ctx.restore();
}

// 초상화: 머리 영역(headBox)을 잘라 그린다
function drawPortrait(canvas, name, opts) {
  const d = ART[name];
  const c = canvas.getContext('2d');
  c.clearRect(0, 0, canvas.width, canvas.height);
  const [hx0, hy0, hx1, hy1] = d.headBox;
  const k = Math.min(canvas.width / (hx1 - hx0), canvas.height / (hy1 - hy0));
  const kk = Math.ceil(k * 4) / 2; // 2배 슈퍼샘플
  c.save();
  c.imageSmoothingEnabled = true;
  if (opts && opts.dead) c.filter = 'grayscale(1) brightness(0.55)';
  if (opts && opts.flip) { c.translate(canvas.width, 0); c.scale(-1, 1); }
  c.translate((canvas.width - (hx1 - hx0) * k) / 2, (canvas.height - (hy1 - hy0) * k) / 2);
  c.scale(k / kk, k / kk);
  const ox = (d.box[0] - hx0) * kk, oy = (d.box[1] - hy0) * kk;
  for (const layer of ['back', 'body', 'head']) { const cv = layerCanvas(name, layer, 'normal', kk); if (cv) c.drawImage(cv, ox, oy); }
  c.restore();
}

// ---------- 03_audio.js
// ===== 03_audio.js : WebAudio 합성 효과음 (외부 파일 없음) =====
const Sfx = {
  ctx: null, enabled: true, master: null, last: {},
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  // 너무 잦은 동일 효과음 억제
  _gate(name, ms) {
    const now = performance.now();
    if (this.last[name] && now - this.last[name] < ms) return false;
    this.last[name] = now;
    return true;
  },
  tone(freq, dur, type, vol, slideTo, delay) {
    if (!this.ctx || !this.enabled) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol, filterFreq, delay) {
    if (!this.ctx || !this.enabled) return;
    const t0 = this.ctx.currentTime + (delay || 0);
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = filterFreq || 2000;
    const g = this.ctx.createGain();
    g.gain.value = vol || 0.2;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0);
  },
  play(name) {
    if (!this.ctx || !this.enabled) return;
    switch (name) {
      case 'click': if (this._gate(name, 40)) this.tone(660, 0.06, 'square', 0.08, 880); break;
      case 'back': if (this._gate(name, 40)) this.tone(520, 0.07, 'square', 0.07, 330); break;
      case 'hit': if (this._gate(name, 45)) { this.noise(0.08, 0.18, 1800); this.tone(180, 0.07, 'square', 0.08, 90); } break;
      case 'crit': this.noise(0.14, 0.28, 3200); this.tone(320, 0.12, 'sawtooth', 0.12, 110); break;
      case 'heal': if (this._gate(name, 80)) { this.tone(523, 0.12, 'sine', 0.12, 784); this.tone(784, 0.16, 'sine', 0.08, 1046, 0.06); } break;
      case 'shoot': if (this._gate(name, 60)) this.tone(900, 0.06, 'triangle', 0.06, 500); break;
      case 'magic': if (this._gate(name, 60)) { this.tone(700, 0.18, 'sine', 0.1, 1400); this.tone(1050, 0.18, 'triangle', 0.05, 2100, 0.04); } break;
      case 'skill': this.tone(440, 0.1, 'square', 0.1, 880); this.tone(880, 0.12, 'square', 0.06, 1320, 0.05); break;
      case 'death': this.noise(0.3, 0.2, 700); this.tone(240, 0.3, 'triangle', 0.1, 60); break;
      case 'charge': this.tone(110, 0.5, 'sawtooth', 0.12, 220); this.tone(116, 0.5, 'sawtooth', 0.08, 230, 0.02); break;
      case 'boom': this.noise(0.45, 0.4, 500); this.tone(70, 0.4, 'sine', 0.3, 35); break;
      case 'cancel': this.tone(1200, 0.08, 'square', 0.1, 600); this.tone(900, 0.12, 'square', 0.08, 300, 0.08); break;
      case 'ult': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.18, 'square', 0.09, f * 1.01, i * 0.06)); break;
      case 'pause': this.tone(400, 0.08, 'sine', 0.1, 300); break;
      case 'coin': this.tone(988, 0.07, 'square', 0.08); this.tone(1319, 0.12, 'square', 0.08, null, 0.07); break;
      case 'win': [523, 659, 784, 1046, 784, 1046].forEach((f, i) => this.tone(f, 0.16, 'square', 0.08, null, i * 0.11)); break;
      case 'lose': [392, 349, 311, 262].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.12, null, i * 0.22)); break;
      case 'step': if (this._gate(name, 220)) this.noise(0.04, 0.05, 900); break;
      case 'door': this.tone(150, 0.3, 'sine', 0.15, 300); this.noise(0.25, 0.1, 1200); break;
      case 'summon': this.tone(300, 0.25, 'square', 0.08, 600); break;
      case 'phase': this.tone(90, 0.6, 'sawtooth', 0.2, 45); this.noise(0.5, 0.3, 400); break;
      default: break;
    }
  },
};

const Input = {
  scale: 1, rectLeft: 0, rectTop: 0,
  toLogical(ev) {
    return { x: (ev.clientX - this.rectLeft) / this.scale, y: (ev.clientY - this.rectTop) / this.scale };
  },
  attach(canvas) {
    const fire = (kind, ev) => {
      const s = Game.scene;
      if (!s) return;
      const p = this.toLogical(ev);
      if (kind === 'down' && s.pointerDown) s.pointerDown(p, ev);
      if (kind === 'move' && s.pointerMove) s.pointerMove(p, ev);
      if (kind === 'up' && s.pointerUp) s.pointerUp(p, ev);
    };
    canvas.addEventListener('pointerdown', (e) => { Sfx.init(); Sfx.resume(); canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); fire('down', e); e.preventDefault(); });
    canvas.addEventListener('pointermove', (e) => { fire('move', e); });
    canvas.addEventListener('pointerup', (e) => { fire('up', e); });
    canvas.addEventListener('pointercancel', (e) => { fire('up', e); });
  },
};

// ---------- 05_map.js
// ===== 05_map.js : 경로 지도 생성 + 지도 장면 =====

// 생성 제약:
//  - 스테이지 1~4는 3갈래, 5는 보스 단일
//  - 스테이지 1 정예 없음 / 각 스테이지 전투 계열 ≥ 1 / 상점·휴식 스테이지당 ≤ 1
//  - 스테이지 4에는 휴식 또는 고목이 반드시 1개
function generateMap(seed) {
  const rng = makeRng(hashSeed(seed, 'map'));
  const stages = [];
  const eventIds = rng.shuffle(Object.keys(EVENTS).slice());
  let eventCursor = 0;
  for (let s = 1; s <= CONST.STAGES - 1; s++) {
    let types = null;
    for (let attempt = 0; attempt < 500; attempt++) {
      const cand = [];
      for (let r = 0; r < CONST.ROWS; r++) {
        const entries = [];
        for (const k in NODE_TYPES) {
          const nt = NODE_TYPES[k];
          if (!nt.weight) continue;
          if (k === 'elite' && s === 1) continue;
          let w = nt.weight;
          if (s === 1 && k === 'battle') w *= 1.4;
          entries.push([k, w]);
        }
        cand.push(rng.weighted(entries));
      }
      if (validStage(s, cand)) { types = cand; break; }
    }
    if (!types) types = s === 4 ? ['battle', 'rest', 'tree'] : ['battle', 'event', 'battle']; // 안전장치
    stages.push(types.map((type, row) => {
      const node = { stage: s, row, type };
      if (NODE_TYPES[type].combat) node.enc = rng.int(0, 99);
      if (type === 'event') node.event = eventIds[eventCursor++ % eventIds.length];
      return node;
    }));
  }
  stages.push([{ stage: CONST.STAGES, row: 1, type: 'boss', enc: 0 }]);
  return { seed, stages };
}

function validStage(s, types) {
  const count = (t) => types.filter((x) => x === t).length;
  if (s === 1 && count('elite') > 0) return false;
  if (!types.some((t) => NODE_TYPES[t].combat)) return false;
  if (count('shop') > 1 || count('rest') > 1) return false;
  if (s === 4 && count('rest') + count('tree') < 1) return false;
  if (count('tree') > 1) return false;
  return true;
}

// 이동 규칙: 다음 스테이지의 같은 행 또는 위/아래 인접 행
function canMoveTo(run, node) {
  if (node.stage !== run.pos.stage + 1) return false;
  if (node.type === 'boss') return true;
  return Math.abs(node.row - run.pos.row) <= 1;
}
function getNode(map, stage, row) {
  const st = map.stages[stage - 1];
  if (!st) return null;
  return st.find((n) => n.row === row) || st[0];
}

// 노드 → 전투 웨이브
function encounterFor(node) {
  if (node.waves) return node.waves; // 이벤트 등에서 직접 지정
  const table = ENCOUNTERS[node.type === 'boss' ? 'boss' : node.type][node.stage] || ENCOUNTERS.battle[Math.min(4, node.stage)];
  return table[node.enc % table.length];
}

// 지도 화면 좌표
function mapNodePos(node) {
  if (node.type === 'boss') return { x: 852, y: 318 };
  return { x: 150 + (node.stage - 1) * 172, y: 222 + node.row * 96 };
}

// ---------------------------------------------------------------- 공용 UI: 파티 패널 / 자원 바
function partyPanel(run, opts) {
  opts = opts || {};
  const wrap = el('div', 'party-panel' + (opts.compact ? ' compact' : ''));
  for (const id of partyIds(run)) {
    const h = run.heroes[id];
    const def = HEROES[id];
    const card = el('div', 'pcard' + (h.dead ? ' dead' : ''));
    card.dataset.hero = id;
    card.appendChild(portraitCanvas(def.sprite, 40, { dead: h.dead }));
    const info = el('div', 'pinfo');
    info.appendChild(el('div', 'pname', `${def.name}<span class="prole">${def.roleName}</span>`));
    info.appendChild(bar(h.hp / h.maxHp, h.hp / h.maxHp < 0.3 ? 'hp low' : 'hp'));
    info.appendChild(el('div', 'php', h.dead ? '사망' : `${Math.ceil(h.hp)}/${h.maxHp}`));
    card.appendChild(info);
    const ups = Object.values(h.upgrades).reduce((a, u) => a + u.power + u.cd, 0);
    if (ups) card.appendChild(el('div', 'pup', '★' + ups));
    if (opts.onSelect && !h.dead) {
      card.classList.add('selectable');
      card.addEventListener('click', () => { Sfx.play('click'); opts.onSelect(id); });
    }
    wrap.appendChild(card);
  }
  return wrap;
}

function resourceBar(run) {
  const r = el('div', 'res-bar');
  r.appendChild(el('div', 'res gold', `<i>●</i>${run.gold}`));
  r.appendChild(el('div', 'res food', `<i>🍞</i>${run.food}`));
  r.appendChild(el('div', 'res potion', `<i>🧪</i>${run.potions}`));
  const torch = el('div', 'res torch' + (run.torch <= 0 ? ' dark' : run.torch <= 40 ? ' low' : ''), `<i>🔥</i>`);
  torch.appendChild(bar(run.torch / CONST.TORCH_MAX, 'torch'));
  r.appendChild(torch);
  const rel = el('div', 'res relics');
  if (!run.relics.length) rel.appendChild(el('span', 'muted', '유물 없음'));
  for (const id of run.relics) {
    const ic = el('span', 'relic-ic', RELICS[id].icon);
    ic.title = RELICS[id].name;
    ic.addEventListener('click', (e) => { e.stopPropagation(); Game.toast(`${RELICS[id].icon} ${RELICS[id].name}: ${RELICS[id].desc}`, 2600); });
    rel.appendChild(ic);
  }
  if (run.fruit && run.fruit.battles > 0) rel.appendChild(el('span', 'fruit-ic', `🍒×${run.fruit.battles}`));
  r.appendChild(rel);
  return r;
}

// 회복약 사용 (지도/휴식에서)
function usePotionFlow(run, onDone) {
  if (run.potions <= 0) { Game.toast('회복약이 없어요.'); return; }
  const box = el('div', 'pick-box');
  box.appendChild(el('div', 'modal-title', '회복약 사용 — 누구에게?'));
  box.appendChild(partyPanel(run, { onSelect: (id) => {
    const h = run.heroes[id];
    if (h.hp >= h.maxHp) { Game.toast('이미 HP가 가득해요.'); return; }
    run.potions--;
    h.hp = Math.min(h.maxHp, h.hp + h.maxHp * REWARD.potionHealPct);
    Sfx.play('heal');
    Game.closeModal();
    Game.toast(`${HEROES[id].name} HP 회복!`);
    if (onDone) onDone();
  } }));
  box.appendChild(btn('취소', 'ghost', () => Game.closeModal(), { sfx: 'back' }));
  Game.modal(box, { dim: true, closeOnBg: true });
}

// ---------------------------------------------------------------- 지도 장면
const MapScene = {
  selected: null,
  t: 0,
  enter() {
    const run = Game.run;
    this.selected = null;
    this.t = 0;
    const ui = Game.ui;
    const top = el('div', 'map-top');
    const hdr = el('div', 'map-hdr');
    hdr.appendChild(el('div', 'map-title', `고블린 굴 — ${run.pos.stage === 0 ? '입구' : `${run.pos.stage}/${CONST.STAGES}`}`));
    hdr.appendChild(resourceBar(run));
    top.appendChild(hdr);
    top.appendChild(partyPanel(run, { compact: true }));
    ui.appendChild(top);

    const nodesLayer = el('div', 'map-nodes');
    for (const st of run.map.stages) for (const node of st) {
      const p = mapNodePos(node);
      const nt = NODE_TYPES[node.type];
      const b = el('button', 'map-node t-' + node.type, nt.short);
      b.type = 'button';
      b.style.left = p.x + 'px'; b.style.top = p.y + 'px';
      b.style.setProperty('--nc', nt.color);
      b.dataset.stage = node.stage; b.dataset.row = node.row;
      const visited = run.path.some((q) => q.stage === node.stage && q.row === node.row);
      const current = run.pos.stage === node.stage && run.pos.row === node.row;
      const reachable = canMoveTo(run, node);
      if (visited) b.classList.add('visited');
      if (current) b.classList.add('current');
      if (reachable) b.classList.add('reachable');
      if (!reachable && !current) b.classList.add('locked');
      b.addEventListener('click', () => {
        Sfx.play('click');
        this.select(node, reachable);
      });
      nodesLayer.appendChild(b);
    }
    ui.appendChild(nodesLayer);

    // 스테이지 번호
    for (let s = 1; s <= CONST.STAGES; s++) {
      const p = mapNodePos(s === CONST.STAGES ? { type: 'boss' } : { stage: s, row: 0 });
      const lab = el('div', 'stage-num' + (s === run.pos.stage + 1 ? ' next' : ''), String(s));
      lab.style.left = p.x + 'px';
      ui.appendChild(lab);
    }

    const legend = el('div', 'map-legend', Object.keys(NODE_TYPES).map((k) => `<span><b style="background:${NODE_TYPES[k].color}">${NODE_TYPES[k].short}</b>${NODE_TYPES[k].name.replace('일반 ', '')}</span>`).join(''));
    ui.appendChild(legend);

    const side = el('div', 'map-actions');
    side.appendChild(btn('⚙ 전략', 'small', () => openStrategyEditor(Game.run), { id: 'btn-strategy' }));
    side.appendChild(btn('🧪 회복약', 'small', () => usePotionFlow(run, () => Game.go('map')), { id: 'btn-potion' }));
    side.appendChild(btn('? 규칙', 'small', () => showRulesHelp(), { id: 'btn-help' }));
    ui.appendChild(side);

    this.info = el('div', 'map-info hidden');
    ui.appendChild(this.info);

    Game.hint('map');
  },

  select(node, reachable) {
    this.selected = node;
    const nt = NODE_TYPES[node.type];
    const info = this.info;
    info.innerHTML = '';
    info.classList.remove('hidden');
    info.classList.toggle('left', mapNodePos(node).x >= 480); // 탭한 노드를 가리지 않도록 반대편에
    info.appendChild(el('div', 'mi-title', `<b style="background:${nt.color}">${nt.short}</b> ${nt.name} <small>스테이지 ${node.stage}</small>`));
    let desc = nt.desc;
    if (node.type === 'event') desc = `${EVENTS[node.event].title} — ${nt.desc}`;
    if (nt.combat) {
      const waves = encounterFor(node);
      const names = {};
      waves.flat().forEach((id) => { names[ENEMIES[id].name] = (names[ENEMIES[id].name] || 0) + 1; });
      desc += `<br><small>${waves.length}웨이브 · ` + Object.entries(names).map(([n, c]) => `${n}×${c}`).join(', ') + '</small>';
    }
    info.appendChild(el('div', 'mi-desc', desc));
    const row = el('div', 'mi-btns');
    row.appendChild(btn('취소', 'ghost', () => { this.selected = null; info.classList.add('hidden'); }, { sfx: 'back', id: 'btn-node-cancel' }));
    if (reachable) {
      const go = btn('이동하기 →', 'primary', () => this.moveTo(node), { id: 'btn-node-go' });
      if (Game.run.torch <= 0 && node.type === 'battle') info.appendChild(el('div', 'mi-warn', '횃불이 꺼졌다! 어둠 속 전투는 정예로 바뀔 수 있다.'));
      row.appendChild(go);
    } else {
      row.appendChild(el('div', 'mi-locked', '지금 위치에서 갈 수 없는 방'));
    }
    info.appendChild(row);
  },

  moveTo(node) {
    const run = Game.run;
    run.pos = { stage: node.stage, row: node.row };
    run.path.push({ stage: node.stage, row: node.row });
    run.stats.nodes++;
    const wasDark = run.torch <= 0;
    run.torch = Math.max(0, run.torch - CONST.TORCH_PER_MOVE);
    run.lastNode = node;
    Sfx.play('door');
    let type = node.type;
    if (type === 'battle' && wasDark) {
      const r = makeRng(hashSeed(run.seed, 'dark', node.stage, node.row));
      if (r() < CONST.TORCH_DARK_ELITE_CHANCE && ENCOUNTERS.elite[node.stage]) {
        type = 'elite';
        Game.toast('어둠 속에서 정예가 습격했다!', 2200);
      }
    }
    if (NODE_TYPES[type].combat) {
      const n = Object.assign({}, node, { type });
      openPreBattle(n);
    } else if (type === 'event') Game.go('event', { node });
    else Game.go(type, { node });
  },

  update(dt) { this.t += dt; },

  render(ctx) {
    const run = Game.run;
    drawDungeonBackdrop(ctx, this.t, 0.55);
    // 연결선
    ctx.lineWidth = 3;
    const stages = run.map.stages;
    for (let s = 0; s < stages.length - 1; s++) {
      for (const a of stages[s]) for (const b of stages[s + 1]) {
        if (b.type !== 'boss' && Math.abs(a.row - b.row) > 1) continue;
        const pa = mapNodePos(a), pb = mapNodePos(b);
        const walked = run.path.some((q) => q.stage === a.stage && q.row === a.row) && run.path.some((q) => q.stage === b.stage && q.row === b.row);
        const fromCur = run.pos.stage === a.stage && run.pos.row === a.row;
        ctx.strokeStyle = walked ? '#ffd34a' : fromCur ? 'rgba(255,230,170,0.75)' : 'rgba(140,120,190,0.35)';
        ctx.setLineDash(fromCur && !walked ? [8, 6] : []);
        ctx.lineDashOffset = -this.t * 20;
        ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
      }
    }
    // 입구 → 스테이지 1
    if (run.pos.stage === 0) {
      ctx.strokeStyle = 'rgba(255,230,170,0.75)';
      ctx.setLineDash([8, 6]);
      for (const b of stages[0]) { const pb = mapNodePos(b); ctx.beginPath(); ctx.moveTo(40, 318); ctx.lineTo(pb.x, pb.y); ctx.stroke(); }
    }
    ctx.setLineDash([]);
    // 파티 위치 마커
    let px = 40, py = 318;
    if (run.pos.stage > 0) { const p = mapNodePos(getNode(run.map, run.pos.stage, run.pos.row)); px = p.x; py = p.y; }
    const bob = Math.sin(this.t * 4) * 3;
    drawSprite(ctx, 'knight', px, py - 30 + bob, { scale: 2, t: this.t });
  },
};

// 지도/이벤트 화면 공용 배경: 돌벽 + 횃불
function drawDungeonBackdrop(ctx, t, dim) {
  const W = CONST.VIEW_W, H = CONST.VIEW_H;
  ctx.fillStyle = '#1d1828';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#262035';
  for (let y = 0; y < H; y += 36) {
    const off = (y / 36) % 2 ? 0 : 40;
    for (let x = -off; x < W; x += 80) { ctx.fillRect(x + 2, y + 2, 76, 32); }
  }
  for (const tx of [60, W - 60]) {
    const fl = 0.85 + Math.sin(t * 9 + tx) * 0.08 + Math.sin(t * 23 + tx) * 0.05;
    const g = ctx.createRadialGradient(tx, 140, 4, tx, 140, 170 * fl);
    g.addColorStop(0, 'rgba(255,170,80,0.35)');
    g.addColorStop(1, 'rgba(255,170,80,0)');
    ctx.fillStyle = g;
    ctx.fillRect(tx - 200, 0, 400, 360);
  }
  if (dim) { ctx.fillStyle = `rgba(10,8,16,${dim * 0.5})`; ctx.fillRect(0, 0, W, H); }
}
