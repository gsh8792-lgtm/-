      return;
    }
    if (u.call) {
      if (stunned && !d.stunNoCancel) this._cancelCast(u, (u.statuses.stun || {}).src);
      else if (!stunned) { u.call.t -= dt; if (u.call.t <= 0) { u.call = null; u.callCd = d.callEvery; this._callComplete(u); } }
      return;
    }
    if (d.abilities.includes('buds') && u.x <= 960) this._buds(u, dt);
    if (stunned || u.x > 960) return;
    if (d.abilities.includes('charge')) {
      u.chargeCd -= dt;
      const tgt = u.target && u.target.alive ? u.target : this.nearest(u, this.aliveHeroes());
      if (u.chargeCd <= 0 && tgt && this.dist(u, tgt) < 260) {
        // 원형 위험 범위: 시작 순간의 대상 위치 (피하려면 범위 밖으로 이동)
        u.charge = { t: u.chargeTime, total: u.chargeTime, cx: tgt.x, cy: tgt.y, r: u.chargeR, mult: u.chargeMult };
        u.face = tgt.x >= u.x ? 1 : -1;
        this.events.push({ type: 'chargeStart', unit: u });
        return;
      }
    }
    if (d.abilities.includes('caller')) {
      u.callCd -= dt;
      if (u.callCd <= 0 && this.aliveEnemies().length < 6) { u.call = { t: d.callCast, total: d.callCast }; this.events.push({ type: 'callStart', unit: u }); return; }
    }
    if (d.abilities.includes('warcry')) {
      u.warcryCd -= dt;
      if (u.warcryCd <= 0) { u.warcryCd = d.warcryEvery; for (const e of this.aliveEnemies()) e.statuses.warcry = { t: 6, value: 0.3 }; this.events.push({ type: 'warcry', unit: u }); }
    }
  }

  // 가시덩굴 여왕: 꽃봉오리 2개를 유지하고, 모든 꽃봉오리가 동시에 호출을 시작한다
  _buds(u, dt) {
    const d = u.def;
    if (!u.buds) { u.buds = []; u.budCd = d.budFirst; for (let i = 0; i < (d.budCount || 2); i++) u.buds.push({ unit: null, regrow: 0 }); }
    u.buds.forEach((b, i) => {
      if (b.unit && b.unit.alive) return;
      if (b.unit && !b.unit.alive && !b.regrow) b.regrow = d.budRegrow;
      if (b.regrow > 0) { b.regrow -= dt; if (b.regrow > 0) return; }
      const e = this._makeEnemy('thorn_bud', clamp(Math.min(u.x, 800) - 40 + i * 30, CONST.FIELD_X0, 830), (CONST.FIELD_Y0 + CONST.FIELD_Y1) / 2 + (i - 1) * 26);
      e.callHost = u; b.unit = e; b.regrow = 0;
      this.enemies.push(e); this.events.push({ type: 'summon', unit: e, by: u });
    });
    if (u.statuses.stun || u.broken > 0) return;
    u.budCd -= dt;
    if (u.budCd <= 0) {
      u.budCd = d.budEvery;
      for (const b of u.buds) if (b.unit && b.unit.alive && !b.unit.call) { b.unit.call = { t: b.unit.def.callCast, total: b.unit.def.callCast }; this.events.push({ type: 'callStart', unit: b.unit }); }
    }
  }

  inChargeZone(h, c) { const dx = (h.x - c.cx) / c.r, dy = (h.y - c.cy) / (c.r * 0.45); return dx * dx + dy * dy <= 1; }

  _chargeImpact(u) {
    const c = u.charge;
    u.charge = null;
    u.chargeCd = u.chargeEvery;
    u.intr = null;
    if (CONST.BREAK_V2 && u.poiseMax) { // 끊지 못한 차지 누적 → 격노 스택
      u.unblocked++;
      if (u.unblocked >= CONST.UNBLOCKED_ENRAGE_FROM) { u.enrageStacks++; this.events.push({ type: 'enrageStack', unit: u, n: u.enrageStacks }); }
    }
    const inZone = this.aliveHeroes().filter((h) => this.inChargeZone(h, c));
    // 탱커 막기: 도발(①) 또는 철벽(③)으로 '버티는 중'인 탱커만 동료 피해를 대신 받아낸다 (타이밍 기믹)
    const tank = inZone.find((h) => h.role === 'tank' && h.statuses.guard);
    this.events.push({ type: 'chargeImpact', unit: u, cx: c.cx, cy: c.cy, r: c.r, blocked: !!tank, hit: inZone.length });
    u.anim.lunge = 0.35; u.anim.lungeX = (c.cx - u.x) * 0.5; u.anim.lungeY = (c.cy - u.y) * 0.5;
    for (const h of inZone) {
      let mult = c.mult;
      if (tank && h !== tank) mult *= 0.4;
      if (h === tank) mult *= 0.6;
      if (h.def.traits.includes('cautious')) mult *= 0.5;
      this._damage(u, h, this._atkOf(u) * mult, { charge: true, noCrit: true });
    }
  }

  _basicAttack(u, tgt) {
    if (u.side === 'hero') u.actLock = Math.max(u.actLock, CONST.ACT_LOCK_ATTACK);
    if (u.melee) {
      u.anim.lunge = 0.22; u.anim.lungeX = (tgt.x - u.x) * 0.4; u.anim.lungeY = (tgt.y - u.y) * 0.4;
      u.face = tgt.x >= u.x ? 1 : -1;
      this.delayed.push({ t: 0.1, fn: () => { if (tgt.alive && u.alive) this._damage(u, tgt, this._atkOf(u), { basic: true }); } });
      this.events.push({ type: 'attack', unit: u, target: tgt, melee: true });
    } else {
      u.anim.cast = 0.18; u.face = tgt.x >= u.x ? 1 : -1;
      const travel = 0.12 + this.dist(u, tgt) / 1400;
      this.events.push({ type: 'projectile', from: u, to: tgt, kind: u.key, travel });
      this.delayed.push({ t: travel, fn: () => { if (tgt.alive) this._damage(u, tgt, this._atkOf(u), { basic: true }); } });
    }
  }

  // 짓누름: 지금 스택만큼 피해 배율을 돌려주고 한 스택 쌓는다 (버티는 중이면 쌓이지 않음)
  _crush(h) {
    const s = h.statuses.crush;
    const n = s ? s.n : 0;
    const res = this.crushRes(h);
    if (!h.statuses.guard && !h.statuses.invuln) {
      h.statuses.crush = { t: CONST.CRUSH_DUR, n: Math.min(CONST.CRUSH_MAX, n + 1) };
      if (n + 1 >= 3 && res < 0.5 && !(s && s.warned)) { h.statuses.crush.warned = true; this.events.push({ type: 'crushWarn', unit: h }); }
      else if (s && s.warned) h.statuses.crush.warned = true;
    }
    return 1 + n * CONST.CRUSH_STEP * (1 - res);
  }
  crushRes(h) {
    let r = h.role === 'tank' ? CONST.CRUSH_RES.tank : h.def.traits.includes('sturdy') ? CONST.CRUSH_RES.sturdy : 0;
    r = 1 - (1 - r) * (1 - Math.min(0.8, (h.mods && h.mods.crushres) || 0));
    return r;
  }

  _atkOf(u) {
    let m = 1;
    if (u.statuses.fruit) m += u.statuses.fruit.value;
    if (u.statuses.warcry) m += u.statuses.warcry.value;
    if (u.statuses.inspire) m += u.statuses.inspire.value;
    if (u.side === 'enemy') {
      if (u.enrageStacks) m += u.enrageStacks * CONST.UNBLOCKED_ENRAGE_STACK;
      if (CONST.BREAK_V2 && u.def.softEnrage && this.time > u.def.softEnrage) m += CONST.SOFT_ENRAGE_STEP * Math.floor((this.time - u.def.softEnrage) / 10 + 1);
    }
    if (u.side === 'hero' && u.def.traits.includes('brave')) m += 0.4 * (1 - u.hp / u.maxHp);
    if (u.side === 'hero' && this.focus && u.target === this.focus) m += 0.1; // 집중 공격 보너스
    return u.atk * m;
  }
  _critChance(u) {
    if (u.side !== 'hero') return 0.05;
    let c = CONST.BASE_CRIT;
    if (u.def.traits.includes('keen')) c += 0.1;
    if (this.relics.has('clover')) c += 0.1;
    if (this.torchDark) c -= CONST.TORCH_DARK_CRIT_PENALTY;
    c += (u.mods && u.mods.crit) || 0;
    return clamp(c, 0, CONST.STAT_CAPS.crit);
  }

  // ------------------------------------------------------------ 피해/회복
  _damage(src, tgt, raw, info) {
    if (!tgt.alive) return 0;
    if (tgt.statuses.invuln) return 0;
    info = info || {};
    let dmg = raw, crit = false;
    if (!info.dot) {
      dmg *= 0.9 + this.rng() * 0.2;
      if (!info.noCrit && src && this.rng() < this._critChance(src)) { crit = true; dmg *= CONST.CRIT_MULT + ((src.mods && src.mods.critdmg) || 0); }
    }
    dmg *= 1 - tgt.defPct;
    if (src && src.side === 'hero' && src.levelGap) dmg *= levelGapMult(src.levelGap).dealt;
    if (tgt.side === 'hero' && tgt.levelGap && src && src.side === 'enemy') dmg *= levelGapMult(tgt.levelGap).taken;
    if (info.basic && tgt.side === 'hero' && src && src.side === 'enemy' && src.def.abilities.includes('boss')) dmg *= this._crush(tgt);
    if (tgt.armor && !(tgt.broken > 0)) dmg *= 1 - (tgt.armorBoost > 0 ? Math.max(tgt.armor, tgt.armorBoostV || CONST.UNBLOCKED_CALL_ARMOR) : tgt.armor); // 방어 태세
    if (tgt.broken > 0) dmg *= 1 + CONST.BREAK_BONUS + ((src && src.mods && src.mods.vsbroken) || 0); // 그로기
    if (src && src.mods && src.mods.nonbroken && tgt.poiseMax && !(tgt.broken > 0)) dmg *= 1 + src.mods.nonbroken; // 달빛 맹세 단점
    if (src && src.statuses && src.statuses.weaken) dmg *= 1 - src.statuses.weaken.value;
    if (src && !src.melee && src.side === 'hero' && tgt.def.frontRangedDmg && (src.x - tgt.x) * tgt.face > 0) dmg *= tgt.def.frontRangedDmg; // 사슴왕 안개: 정면 원거리 피해 감소
    if (tgt.statuses.vuln) dmg *= 1.25;
    if (tgt.statuses.guard) dmg *= 1 - tgt.statuses.guard.value;
    if (tgt.side === 'hero' && tgt.role === 'tank' && this.relics.has('bark')) dmg *= 0.85;
    dmg = Math.max(1, Math.round(dmg));
    if (tgt.side === 'hero' && !tgt.stubbornUsed && tgt.hp - dmg < tgt.maxHp * 0.25 && tgt.hp - dmg > 0) { // 끈질긴 생명
      const v = this.passive(tgt, 'stubborn');
      if (v) { tgt.stubbornUsed = true; tgt.statuses.invuln = { t: v }; this.events.push({ type: 'passive', unit: tgt, name: '끈질긴 생명' }); }
    }
    if (tgt.statuses.shield) { // 보호막이 먼저 받는다
      const sh = tgt.statuses.shield, ab = Math.min(sh.value, dmg);
      sh.value -= ab; dmg -= ab;
      if (sh.value <= 0) delete tgt.statuses.shield;
      if (dmg <= 0) { this.events.push({ type: 'hit', target: tgt, src, amount: 0, shielded: true }); return 0; }
    }
    tgt.hp -= dmg;
    tgt.anim.hurt = 0.18;
    if (src && src.statuses && src.statuses.lifesteal && src.alive) this._heal(src, src, dmg * src.statuses.lifesteal.value, true);
    if (src && src.stats) src.stats.dealt += dmg;
    if (tgt.stats) tgt.stats.taken += dmg;
    if (src && src.side === 'hero') this._gainUlt(src, dmg * CONST.ULT_GAIN_DEAL);
    if (tgt.side === 'hero') this._gainUlt(tgt, dmg * CONST.ULT_GAIN_TAKE);
    if (src && src.side === 'hero' && !info.dot) this._poiseHit(src, tgt, info.skill ? CONST.POISE_SKILL : CONST.POISE_BASIC, info.skill ? 'skill' : 'basic');
    this.events.push({ type: 'hit', target: tgt, src, amount: dmg, crit, dot: info.dot || null, charge: !!info.charge, skill: info.skill || null });
    if (tgt.hp <= 0) {
      tgt.hp = 0; tgt.alive = false; tgt.charge = null; tgt.call = null; tgt.statuses = {};
      if (tgt.side === 'enemy') { this.kills++; if (src && src.stats) src.stats.kills++; }
      this.events.push({ type: 'death', unit: tgt });
    }
    return dmg;
  }

  // 그로기 게이지 감소 → 0이면 그로기
  // 그로기 게이지 감소 → 0이면 그로기. kind: basic|skill|stun|cancel|ult|intrfail (통계·규칙용)
  _poiseHit(src, tgt, amount, kind) {
    if (!tgt.alive || !tgt.poiseMax || tgt.broken > 0) return;
    let m = 1 + ((src && src.mods && src.mods.breakdmg) || 0);
    if (CONST.BREAK_V2) {
      if (tgt.breakLock > 0) return;
      if (tgt.shaken > 0 && (kind === 'basic' || kind === 'skill' || kind === 'ult')) m *= CONST.SHAKE_MULT;
      if (src && src.statuses && src.statuses.resonance) m *= 1 + src.statuses.resonance.value; // 서포터 증폭
      if (tgt.statuses.exposed) m *= 1 + tgt.statuses.exposed.value;
      if (src && tgt.def.backOnly && (src.x - tgt.x) * tgt.face > 0) m *= tgt.def.backOnly; // 정면 피격 그로기 감소 (안개 사슴왕)
      if (kind === 'stun' && tgt.def.stunMult) m *= tgt.def.stunMult;
    }
    const amt = amount * m;
    this.poiseLog[kind || 'other'] = (this.poiseLog[kind || 'other'] || 0) + amt;
    tgt.poise -= amt;
    if (tgt.poise <= 0) {
      tgt.poise = 0; tgt.broken = CONST.BREAK_DUR;
      tgt.charge = null; tgt.call = null; tgt.intr = null; tgt.shaken = 0;
      tgt.breaks++; tgt.stunHist = [];
      if (CONST.BREAK_V2) tgt.poiseMax = Math.min(tgt.poiseBase * CONST.BREAK_GROWTH_CAP, tgt.poiseBase * (1 + CONST.BREAK_GROWTH * tgt.breaks));
      this.breakLog.push(this.time);
      this.events.push({ type: 'break', unit: tgt });
      for (const h of this.aliveHeroes()) { const v = this.passive(h, 'hunter_rain'); if (v) h.cds.s2 = Math.max(0, h.cds.s2 - this.skillCdMax(h, 's2') * v); } // 여우비
    }
  }
  // 흔들림: 회복 정지 + 그로기 ×1.5. extend면 연장(최대 12초)
  _shake(tgt, dur, extend) {
    if (!CONST.BREAK_V2 || !tgt.poiseMax || tgt.broken > 0) return;
    const was = tgt.shaken > 0;
    tgt.shaken = extend ? Math.min(CONST.SHAKE_MAX, tgt.shaken + dur) : Math.max(tgt.shaken, dur);
    tgt.regenDelay = 0;
    if (!was) this.events.push({ type: 'shake', unit: tgt });
  }
  // 차지·호출 끊기 (기절 또는 끊기 포인트 합산 성공)
  _cancelCast(u, src) {
    const wasCall = !!u.call;
    if (u.charge) { u.charge = null; u.chargeCd = u.chargeEvery * 0.8; this.events.push({ type: 'chargeCancel', unit: u }); }
    if (u.call) { u.call = null; u.callCd = u.def.callEvery; this.events.push({ type: 'callCancel', unit: u }); }
    u.intr = null;
    this._onCancel(src);
    if (u.poiseMax) { this._poiseHit(src, u, CONST.POISE_CANCEL, 'cancel'); this._shake(u, CONST.SHAKE_DUR); }
    return wasCall;
  }
  // 끊기 포인트: 2초 창 안에 합산, 저항 이상이면 끊김
  _interrupt(src, u, pts) {
    if (!(u.charge || u.call)) return false;
    if (!CONST.BREAK_V2) return false;
    const resist = u.def.interruptResist || (u.size > 1 ? CONST.INTERRUPT_RESIST : CONST.INTERRUPT_RESIST_SMALL);
    if (!u.intr) u.intr = { pts: 0, t: CONST.INTERRUPT_WINDOW, src, roles: {} };
    const role = (src && src.role) || 'other';
    u.intr.pts += u.intr.roles[role] ? Math.floor(pts * CONST.INTERRUPT_SAME_ROLE) : pts; // 같은 직업은 한 번만
    u.intr.roles[role] = (u.intr.roles[role] || 0) + 1;
    this.events.push({ type: 'interrupt', unit: u, pts: u.intr.pts, resist });
    if (u.intr.pts >= resist) { this._cancelCast(u, src); return true; }
    return false;
  }
  _interruptFail(u) { // 실패한 끊기 시도는 절반을 그로기로
    const it = u.intr; u.intr = null;
    if (it && it.pts > 0 && u.poiseMax) this._poiseHit(it.src, u, it.pts * CONST.INTERRUPT_PIP_POISE, 'intrfail');
  }
  // 끊지 못한 호출: 소환 + 방어 태세 강화
  _callComplete(u) {
    const d = u.def;
    this._summon(new Array(d.callCount || 1).fill(d.callUnit || 'goblin'), u.callHost || u);
    if (CONST.BREAK_V2) { const host = u.callHost || u; if (host.def.calledHeal && host.alive) this._heal(null, host, host.maxHp * host.def.calledHeal, true); if (host.poiseMax) { host.armorBoost = host.def.calledArmorDur || CONST.UNBLOCKED_CALL_DUR; host.armorBoostV = host.def.calledArmor || CONST.UNBLOCKED_CALL_ARMOR; this.events.push({ type: 'armorUp', unit: host }); } }
  }

  _heal(src, tgt, amount, silent) {
    if (!tgt.alive) return 0;
    let a = amount * (silent ? 1 : CONST.HEAL_MULT) * (1 + ((src && src.mods && src.mods.heal) || 0));
    if (src && src.def && src.def.traits && src.def.traits.includes('gentle')) a *= 1.15;
    if (tgt.statuses.burn) a *= 0.5;
    a = Math.round(Math.min(a, tgt.maxHp - tgt.hp));
    if (a <= 0) return 0;
    tgt.hp += a;
    if (src && src.stats) src.stats.healed += a;
    if (src && src.side === 'hero' && !silent) this._gainUlt(src, a * CONST.ULT_GAIN_HEAL);
    this.events.push({ type: 'heal', target: tgt, amount: a, quiet: !!silent });
    return a;
  }

  _gainUlt(h, amt) {
    if (h.mods && h.mods.ultonlybreak && !this.enemies.some((e) => e.alive && e.broken > 0)) return; // 숲의 첫 숨 단점
    this._gainUltRaw(h, amt);
  }
  _gainUltRaw(h, amt) {
    if (!h.alive) return;
    const before = h.ult;
    h.ult = Math.min(100, h.ult + amt * (this.relics.has('stardust') ? 1.3 : 1) * (1 + Math.min((h.mods && h.mods.ultgain) || 0, CONST.STAT_CAPS.ultgain)));
    if (before < 100 && h.ult >= 100) { h.ultFullAt = this.time; this.events.push({ type: 'ultReady', unit: h }); }
  }

  _applyStatus(src, tgt, eff) {
    if (!tgt.alive) return;
    if (eff.status === 'stun' && tgt.stunImmune) { this.events.push({ type: 'immune', unit: tgt }); return; }
    let dur = eff.dur;
    const sm = (src && src.mods) || {};
    if ((eff.status === 'stun' || eff.status === 'taunt') && sm.ccdur) dur *= 1 + sm.ccdur;
    if (eff.status === 'burn') { if (this.relics.has('ember')) dur += 2; if (src && src.def.traits && src.def.traits.includes('cautious')) dur += 1; }
    const s = { t: dur, src };
    if (eff.dps) s.dps = this._atkOf(src) * eff.dps * (1 + (sm.dotdmg || 0));
    if (eff.value) s.value = eff.value;
    const prev = tgt.statuses[eff.status];
    if (prev && prev.dps && s.dps) s.dps = Math.max(prev.dps, s.dps);
    if (prev) s.acc = prev.acc;
    tgt.statuses[eff.status] = s;
    this.events.push({ type: 'status', target: tgt, status: eff.status });
    if (eff.status === 'stun' && tgt.side === 'enemy') {
      let dr = 1;
      if (CONST.BREAK_V2 && tgt.poiseMax) { // 15초 안 반복 기절은 점감
        tgt.stunHist = tgt.stunHist.filter((t) => this.time - t < CONST.STUN_DR_WINDOW);
        dr = CONST.STUN_DR[Math.min(tgt.stunHist.length, CONST.STUN_DR.length - 1)];
        tgt.stunHist.push(this.time);
        s.t = dur * dr * (tgt.def.stunMult || 1);
      }
      this._poiseHit(src, tgt, CONST.POISE_STUN * dr, 'stun');
      this._shake(tgt, CONST.SHAKE_DUR);
    }
  }

  // ------------------------------------------------------------ 스킬 (s1 ① 기본 / s2 ② 상황 / ult ③ 필살기)
  skillDef(h, slot) { if (slot === 'ult' && h.ultDef) return h.ultDef; return SKILLS[slot === 'ult' ? h.def.ult : h.def.skills[slot === 's1' ? 0 : 1]]; }
  skillUp(h, slot) { return h.upgrades[slot] || { power: 0, cd: 0 }; }
  skillCdMax(h, slot) { const d = this.skillDef(h, slot); const m = h.mods || {}; return d.cd * Math.pow(REWARD.skillUpgradeCd, this.skillUp(h, slot).cd) * (1 - Math.min((m.cdr || 0) + (m[slot + 'cd'] || 0), CONST.STAT_CAPS.cdr)); }

  canCast(h, slot) {
    if (!h || !h.alive || this.outcome || this.introT > 0) return false;
    if (h.statuses.stun) return false;
    if (slot === 'ult') return h.ult >= 100;
    return h.cds[slot] <= 0;
  }

  // ② 상황 스킬 추천 상태: '' | 'hint'(추천) | 'now'(위험 대응)
  skillHint(h, slot) {
    const sk = this.skillDef(h, slot);
    if (!h.alive) return '';
    if (sk.interrupt && this.aliveEnemies().some((e) => (e.charge || e.call) && e.x < 960)) return 'now';
    if (!sk.hint) return '';
    switch (sk.hint) {
      case 'enemyCharging': return this.aliveEnemies().some((e) => e.charge || e.call) ? 'now' : '';
      case 'nearEnemies': return this.aliveEnemies().filter((e) => this.dist(h, e) <= sk.areaR + 10).length >= 2 ? 'hint' : '';
      case 'cluster': { const p = this.bestAreaPoint(sk.areaR, this.aliveEnemies()); return p && p.n >= 3 ? 'hint' : ''; }
      case 'alliesHurt': return this.aliveHeroes().filter((a) => this.hpPct(a) <= 0.7).length >= 2 ? 'hint' : '';
      default: return '';
    }
  }

  // 원형 범위에 가장 많이 들어가는 지점
  bestAreaPoint(r, list, filter) {
    let best = null;
    for (const c of list) {
      const n = list.filter((o) => this.distXY(o, c.x, c.y) <= r + o.size * 8 && (!filter || filter(o))).length;
      if (!best || n > best.n) best = { x: c.x, y: c.y, n };
    }
    return best;
  }

  unitsInArea(h, slot, x, y) {
    const sk = this.skillDef(h, slot);
    if (sk.target === 'self_area') { x = h.x; y = h.y; }
    const list = sk.target === 'area_ally' ? this.aliveHeroes() : this.aliveEnemies();
    return list.filter((u) => this.distXY(u, x, y) <= sk.areaR + (u.size || 1) * 8);
  }

  // spec: { unit } | { x, y } | {}
  cast(h, slot, spec) {
    if (!this.canCast(h, slot)) return false;
    const sk = this.skillDef(h, slot);
    const pmul = (1 + this.skillUp(h, slot).power * REWARD.skillUpgradePower) * (1 + ((h.mods && h.mods[slot === 'ult' ? 'ultpow' : slot + 'pow']) || 0));
    const dmul = pmul * (1 + ((h.mods && h.mods.skilldmg) || 0)); // 스킬 피해 보정 (회복에는 미적용)
    spec = spec || {};
    if ((sk.target === 'enemy' || sk.target === 'ally') && (!spec.unit || !spec.unit.alive)) return false;
    if ((sk.target === 'area_enemy' || sk.target === 'area_ally') && spec.x === undefined) return false;
    if (slot === 'ult') { h.ult = 0; this.events.push({ type: 'ult', unit: h, skill: sk }); }
    else h.cds[slot] = this.skillCdMax(h, slot);
    h.castLock = 0.35;
    h.actLock = Math.max(h.actLock, slot === 'ult' ? CONST.ACT_LOCK_ULT : CONST.ACT_LOCK_SKILL);
    h.anim.cast = 0.3;
    const atk = this._atkOf(h);
    const fxDelay = sk.delay || { meteor: 0.55, arrowrain: 0.5, nova: 0.35, starbolt: 0.22, pierce: 0.16, snipe: 0.3 }[sk.fx] || 0.08;
    if (sk.delay) { h.casting = { t: sk.delay, total: sk.delay, name: sk.name }; h.actLock = Math.max(h.actLock, sk.delay + 0.2); } // 긴 시전: 끝날 때까지 이동 불가
    if (sk.selfCost) h.hp = Math.max(1, h.hp - h.maxHp * sk.selfCost);
    if (spec.unit) h.face = spec.unit.x >= h.x ? 1 : -1;
    else if (spec.x !== undefined) h.face = spec.x >= h.x ? 1 : -1;
    this.events.push({ type: 'cast', unit: h, skill: sk, slot, spec, delay: fxDelay });
    const applyEffects = (tgt) => { for (const e of sk.effects) if (!e.to) this._applyStatus(h, tgt, e); };
    const hit = (e) => this._skillHit(h, sk, e, atk * sk.power * dmul);
    const healAmt = (a) => (atk * (sk.heal || 0) + a.maxHp * (sk.healPct || 0)) * pmul;
    const support = (a) => { // 아군 대상 공통: 보호막·해제
      if (sk.shieldPct) a.statuses.shield = { t: 8, value: a.maxHp * sk.shieldPct * pmul };
      if (sk.cleanse) this._cleanse(a);
    };
    switch (sk.target) {
      case 'enemy': {
        const tgt = spec.unit;
        if (h.melee) { // 근접 스킬은 대상에게 순간 돌진
          const side = h.x <= tgt.x ? -1 : 1;
          const r = this.attackRange(h, tgt) * 0.7;
          if (this.dist(h, tgt) > r + 10) { h.x = tgt.x + side * r; h.y = tgt.y; this.events.push({ type: 'dash', unit: h }); }
          h.anim.lunge = 0.25; h.anim.lungeX = (tgt.x - h.x) * 0.5; h.anim.lungeY = 0;
        }
        const hits = sk.hits || 1;
        for (let i = 0; i < hits; i++) this.delayed.push({ t: fxDelay + i * 0.11, fn: () => { if (!tgt.alive || !h.alive) return; hit(tgt); if (i === 0 || i === hits - 1) applyEffects(tgt); } });
        break;
      }
      case 'multi_enemy': { // HP 비율 낮은 적부터 연속 타격
        const list = this.aliveEnemies().slice().sort((a, b) => this.hpPct(a) - this.hpPct(b)).slice(0, sk.count || 3);
        list.forEach((tgt, i) => this.delayed.push({ t: fxDelay + i * 0.22, fn: () => { if (!tgt.alive || !h.alive) return; this.events.push({ type: 'dash', unit: h }); hit(tgt); applyEffects(tgt); } }));
        break;
      }
      case 'ally': {
        const tgt = spec.unit;
        this.delayed.push({ t: fxDelay, fn: () => { if (!tgt.alive) return; if (sk.heal || sk.healPct) this._heal(h, tgt, healAmt(tgt)); support(tgt); applyEffects(tgt); } });
        break;
      }
      case 'area_enemy': case 'self_area': {
        const cx = sk.target === 'self_area' ? h.x : spec.x, cy = sk.target === 'self_area' ? h.y : spec.y;
        if (sk.target === 'self_area') { h.anim.lunge = 0.3; h.anim.lungeX = 0; h.anim.lungeY = 0; }
        const hits = sk.hits || 1;
        for (let i = 0; i < hits; i++) this.delayed.push({ t: fxDelay + i * 0.13, fn: () => {
          if (!h.alive && sk.target === 'self_area') return;
          for (const e of this.aliveEnemies()) if (this.distXY(e, cx, cy) <= sk.areaR + e.size * 8) { hit(e); if (i === 0) applyEffects(e); }
        } });
        spec.x = cx; spec.y = cy;
        break;
      }
      case 'area_ally': {
        const cx = spec.x, cy = spec.y;
        this.delayed.push({ t: fxDelay, fn: () => { for (const a of this.aliveHeroes()) if (this.distXY(a, cx, cy) <= sk.areaR) { this._heal(h, a, healAmt(a)); support(a); } } });
        break;
      }
      case 'all_enemies': {
        const hits = sk.hits || 1;
        for (let i = 0; i < hits; i++) this.delayed.push({ t: fxDelay + i * 0.15, fn: () => { for (const e of this.aliveEnemies()) { hit(e); if (i === 0) applyEffects(e); } } });
        break;
      }
      case 'party': {
        this.delayed.push({ t: fxDelay, fn: () => { for (const a of this.aliveHeroes()) { if (sk.heal || sk.healPct) this._heal(h, a, healAmt(a)); support(a); } } });
        break;
      }
      default: break;
    }
    // 공통 부가 효과
    if (sk.partyHealPct) this.delayed.push({ t: fxDelay, fn: () => { for (const a of this.aliveHeroes()) this._heal(h, a, a.maxHp * sk.partyHealPct * pmul); } });
    if (sk.revive) this.delayed.push({ t: fxDelay, fn: () => this._revive(h, sk.revive) });
    if (sk.cdReduce) for (const a of this.aliveHeroes()) if (a !== h) { a.cds.s1 = Math.max(0, a.cds.s1 - sk.cdReduce); a.cds.s2 = Math.max(0, a.cds.s2 - sk.cdReduce); }
    if (sk.ultGive) for (const a of this.aliveHeroes()) if (a !== h) this._gainUltRaw(a, sk.ultGive);
    for (const e of sk.effects) {
      if (e.to === 'self') this._applyStatus(h, h, e);
      else if (e.to === 'party') for (const a of this.aliveHeroes()) this._applyStatus(h, a, Object.assign({}, e, { value: e.value * (e.status === 'regen' ? pmul : 1) }));
      else if (e.to === 'all_enemies') for (const en of this.aliveEnemies()) this._applyStatus(h, en, e);
    }
    return true;
  }

  // 스킬 1타: 그로기 배율 · 처형 · 추가 그로기 · 독 폭발 · 흡혈 · 파티 회복
  _skillHit(h, sk, e, raw) {
    if (!e.alive) return 0;
    let mult = 1;
    if (sk.brokenMult && e.broken > 0) mult *= sk.brokenMult;
    if (sk.execute && e.hp / e.maxHp <= sk.execute.below) mult *= sk.execute.mult;
    const d = raw > 0 ? this._damage(h, e, raw * mult, { skill: sk.fx }) : 0;
    if (sk.detonate && e.alive && e.statuses[sk.detonate.status]) {
      const st = e.statuses[sk.detonate.status];
      const burst = (st.dps || 0) * Math.max(0, st.t) * sk.detonate.mult;
      delete e.statuses[sk.detonate.status];
      if (burst > 0) this._damage(h, e, burst, { dot: sk.detonate.status, burst: true });
    }
    if (sk.interrupt && e.alive && (e.charge || e.call)) {
      const back = (h.x - e.x) * e.face < 0; // 적이 보는 방향의 반대편 = 후방
      this._interrupt(h, e, Math.max(1, Math.floor(sk.interrupt * (sk.interruptBack && !back ? sk.interruptBack : 1))));
    }
    if (sk.shakeExtend && e.alive && e.shaken > 0) this._shake(e, sk.shakeExtend, true);
    if (sk.poise && e.alive && e.poiseMax) this._poiseHit(h, e, sk.poise * (CONST.BREAK_V2 && !(e.shaken > 0) ? CONST.ULT_POISE_OUTSIDE : 1), 'ult');
    if (d && sk.lifesteal && h.alive) this._heal(h, h, d * sk.lifesteal, true);
    if (d && sk.partyHeal) { const al = this.aliveHeroes(); for (const a of al) this._heal(h, a, d * sk.partyHeal / al.length, true); }
    return d;
  }
  _cleanse(u) { for (const k of ['stun', 'bleed', 'burn', 'poison', 'weaken', 'slow', 'vuln']) delete u.statuses[k]; }
  _revive(h, pct) {
    const dead = this.heroes.find((u) => !u.alive);
    if (!dead) return;
    dead.alive = true; dead.hp = Math.round(dead.maxHp * pct); dead.statuses = {}; dead.ult = 0;
    dead.x = clamp(h.x - 30, CONST.FIELD_X0, CONST.FIELD_X1); dead.y = h.y; dead.cmd = null;
    this.events.push({ type: 'revive', unit: dead });
  }

  // 탭 시전용 자동 대상 / 자동 전략 대상
  resolveTarget(h, slot, rule) {
    const sk = this.skillDef(h, slot);
    const enemies = this.aliveEnemies(), allies = this.aliveHeroes();
    const lowestAlly = () => allies.reduce((a, b) => (!a || this.hpPct(b) < this.hpPct(a) ? b : a), null);
    rule = rule || (sk.target === 'ally' || sk.target === 'area_ally' ? 'lowestAlly' : sk.hint === 'enemyCharging' ? 'charging' : 'focus');
    const casting = sk.interrupt ? enemies.find((e) => (e.charge || e.call) && this.dist(h, e) <= Math.max(this.attackRange(h, e), 240)) : null;
    const pickEnemy = () => {
      if (!enemies.length) return null;
      if (casting) return casting; // 끊기 스킬은 시전 중인 적 우선
      if (rule === 'charging') return enemies.find((e) => e.charge) || enemies.find((e) => e.call) || (this.focus && this.focus.alive ? this.focus : this.nearest(h, enemies));
      if (rule === 'focus' && this.focus && this.focus.alive) return this.focus;
      if (rule === 'weakest') return enemies.reduce((a, b) => (b.hp < a.hp ? b : a));
      if (h.target && h.target.alive && rule === 'focus') return h.target;
      return this.nearest(h, enemies);
    };
    switch (sk.target) {
      case 'enemy': { const u = pickEnemy(); return u ? { unit: u } : null; }
      case 'ally': {
        const u = rule === 'tank' ? (this.tankHero() || lowestAlly()) : lowestAlly();
        if (u && (u.hp < u.maxHp || sk.shieldPct)) return { unit: u };
        if (sk.effects.some((e) => e.status === 'resonance')) { // 다친 아군이 없으면 그로기 담당에게 공명
          const pick = allies.filter((a) => a !== h).sort((a, b) => b.atk - a.atk)[0];
          return pick ? { unit: pick } : null;
        }
        return null;
      }
      case 'area_enemy': {
        if (!enemies.length) return null;
        if (casting) { // 끊기: 시전 중인 적들을 최대한 많이 포함
          const p = this.bestAreaPoint(sk.areaR, enemies.filter((e) => e.charge || e.call));
          return { x: p.x, y: p.y };
        }
        const p = this.bestAreaPoint(sk.areaR, enemies);
        return { x: p.x, y: p.y };
      }
      case 'area_ally': {
        const p = this.bestAreaPoint(sk.areaR, allies, (a) => a.hp < a.maxHp);
        return p ? { x: p.x, y: p.y } : null;
      }
      case 'self_area': return enemies.some((e) => this.dist(h, e) <= sk.areaR + 10) ? {} : null;
      case 'all_enemies': case 'multi_enemy': return enemies.length ? {} : null;
      default: return {};
    }
  }

  // 파티의 끊기 수단(기절 + 끊기 포인트)으로 이 적의 차지·호출을 끊을 수 있는가
  canPartyCancel(e) {
    const resist = e.def.interruptResist || (e.size > 1 ? CONST.INTERRUPT_RESIST : CONST.INTERRUPT_RESIST_SMALL);
    let pts = 0; const roles = {};
    for (const h of this.aliveHeroes()) for (const slot of ['s1', 's2']) {
      const sk = this.skillDef(h, slot);
      if (sk.effects.some((x) => x.status === 'stun') && !e.def.stunNoCancel && !e.stunImmune) return true;
      if (sk.interrupt && !roles[h.role]) { pts += sk.interrupt; roles[h.role] = 1; }
    }
    return CONST.BREAK_V2 && pts >= resist;
  }
  checkCond(h, slot, c) {
    switch (c.cond) {
      case 'always': return true;
      case 'hint': return this.skillHint(h, slot) !== '';
      case 'allyHpBelow': return this.aliveHeroes().some((a) => this.hpPct(a) * 100 <= c.param);
      case 'enemyHpBelow': return this.aliveEnemies().some((e) => this.hpPct(e) * 100 <= c.param);
      case 'enemyCharging': return this.aliveEnemies().some((e) => e.charge || e.call);
      case 'enemyCountGte': return this.aliveEnemies().length >= c.param;
      case 'saveForCharge': { // 차지·호출 능력을 가진 적이 있으면 그 순간에만, 없으면 바로
        const threats = this.aliveEnemies().filter((e) => (e.def.abilities.includes('charge') || e.def.abilities.includes('caller')) && this.canPartyCancel(e));
        if (!threats.length || threats.some((e) => e.charge || e.call)) return true;
        // 짓누름이 쌓인 동료를 보스가 때리고 있으면 시선을 뺏는다 (차지가 곧 오면 아껴 둔다)
        const soon = threats.some((e) => e.def.abilities.includes('charge') && e.chargeCd < 2.5);
        return !soon && this.aliveEnemies().some((e) => e.def.abilities.includes('boss') && e.target && e.target !== h && e.target.alive && e.target.statuses.crush && e.target.statuses.crush.n >= 2);
      }
      case 'auto': { // 필살기 종류에 맞춰 자동: 부활 / 회복 / 그로기 만들기 / 무방비 수확
        const sk = this.skillDef(h, slot);
        const big = this.aliveEnemies().filter((e) => e.poiseMax && e.x < 960);
        if (sk.revive) return this.heroes.some((u) => !u.alive);
        const healer = (sk.heal || sk.healPct || sk.shieldPct) && !sk.power;
        if (healer) return this.aliveHeroes().some((a) => this.hpPct(a) <= 0.6);
        if (!sk.power && sk.effects.some((e) => e.status === 'regen')) return this.aliveHeroes().some((a) => this.hpPct(a) <= 0.7);
        const defensive = !sk.power && sk.effects.some((e) => ['guard', 'invuln', 'taunt', 'shield'].includes(e.status));
        if (defensive) return this.aliveEnemies().some((e) => e.charge) || this.aliveHeroes().some((a) => this.hpPct(a) <= 0.55); // 방어형: 차지가 오거나 위험할 때
        const breaker = sk.poise || sk.interrupt || sk.effects.some((e) => e.status === 'stun');
        if (breaker) return !big.length || big.some((e) => e.shaken > 0 || e.charge || e.call);
        if (!big.length || big.some((e) => e.broken > 0)) return true;
        if (h.ultFullAt !== undefined && this.time - h.ultFullAt > 8) return true; // 너무 오래 아끼지 않음
        return !big.some((e) => e.poise / e.poiseMax <= 0.4 || (e.shaken > 0 && e.poise / e.poiseMax <= 0.7));
      }
      case 'smartInterrupt': { // 끊기 스킬: 지금 시전 중인 적이 있거나, 다음 차지·호출 전에 쿨이 돌아오면 사용
        const threats = this.aliveEnemies().filter((e) => (e.def.abilities.includes('charge') || e.def.abilities.includes('caller')) && e.x < 960);
        if (!threats.length || threats.some((e) => e.charge || e.call)) return true;
        if (!threats.some((e) => this.canPartyCancel(e))) return true; // 아껴도 못 끊는 상대면 그냥 사용
        const next = Math.min(...threats.map((e) => Math.min(e.def.abilities.includes('charge') ? e.chargeCd : 99, e.def.abilities.includes('caller') ? e.callCd : 99)));
        return next > this.skillCdMax(h, slot) + 0.5;
      }
      case 'breakWindow': { // 그로기 중이면 지금, 그로기가 임박(게이지 45% 이하)하면 아껴둠, 아니면 바로
        const big = this.aliveEnemies().filter((e) => e.poiseMax);
        if (!big.length || big.some((e) => e.broken > 0)) return true;
        return !big.some((e) => e.poise / e.poiseMax <= 0.45);
      }
      default: return false;
    }
  }

  // 전략 ON: 스킬별 설정(자동 여부 · 조건 · 대상)대로 시전
  _heroAI() {
    for (const h of this.heroes) {
      if (!h.alive || h.castLock > 0 || h.statuses.stun || this.travelling(h)) continue;
      const st = this.strategy[h.key] || AI_PRESETS[h.key];
      for (const slot of ['s2', 'ult', 's1']) {
        const c = st[slot];
        if (!c || !c.auto || !this.canCast(h, slot) || !this.checkCond(h, slot, c)) continue;
        const spec = this.resolveTarget(h, slot, c.target);
        // 위치 명령으로 자리를 지키는 근접 캐릭터는 자동 스킬로 돌진해 자리를 이탈하지 않는다
        if (spec && spec.unit && h.melee && h.cmd && h.cmd.type === 'move' && this.skillDef(h, slot).target === 'enemy' && this.dist(h, spec.unit) > this.attackRange(h, spec.unit) + 10) continue;
        if (spec && this.cast(h, slot, spec)) break;
      }
    }
  }

  summary() {
    return { outcome: this.outcome, time: this.time, kills: this.kills, heroes: this.heroes.map((h) => ({ id: h.key, hp: Math.max(0, Math.round(h.hp)), alive: h.alive, stats: h.stats })) };
  }
}

BattleSim.runHeadless = function (opts, maxTime) {
  const sim = new BattleSim(Object.assign({ autoMode: true }, opts));
  const lim = maxTime || 300;
  while (!sim.outcome && sim.time < lim) { sim.step(CONST.SIM_DT); sim.events.length = 0; }
  return sim;
};

// ---------- 07_battle_view.js
// ===== 07_battle_view.js : 실시간 파티 전투 장면 (렌더/연출/HUD/입력) =====
// BattleSim(로직)을 고정 타임스텝으로 돌리고, sim.events를 소비해 연출만 담당한다.
// HUD: 캐릭터별 묶음 [얼굴 + ① 기본 ② 상황 ③ 필살기]. 버튼 탭 = 자동 대상 즉시 시전,
//      버튼을 끌면 슬로모션 → 놓는 곳에 대상/범위 지정. 적 칩/적 탭 = 집중 공격. 오른쪽 = 작전 명령.

const BattleScene = {
  enter(params) {
    const run = Game.run;
    const node = params.node;
    this.node = node;
    this.run = run;
    const waves = encounterFor(node);
    const heroes = partyIds(run).filter((id) => !run.heroes[id].dead).map((id) => {
      const h = run.heroes[id];
      return { id, hp: h.hp, maxHp: h.maxHp, upgrades: h.upgrades, mods: EQ.heroLoadout(Game.profile, id).mods, levelGap: EQ.levelGap(Game.profile, id, run.tier), ultDef: GACHA.ultFor(Game.profile, id) };
    });
    const ti = EQ.tierInfo(run.tier);
    this.sim = new BattleSim({
      seed: hashSeed(run.seed, 'battle', node.stage, node.row, node.type),
      stage: node.stage, waves, heroes,
      relics: run.relics, strategy: run.strategy, autoMode: run.autoMode, partySize: run.party.length,
      fruit: run.fruit && run.fruit.battles > 0 ? { bonus: run.fruit.bonus } : null,
      torchDark: run.torch <= 0,
      tier: { hp: ti.hp, atk: ti.atk },
    });
    this.acc = 0;
    this.t = 0;
    this.speed = Game.settings.speed || 1;
    this.paused = false;
    this.drag = null;       // 스킬 버튼 끌기 상태
    this.slowmo = 0;
    this.hitstop = 0;
    this.shake = 0;
    this.fx = [];
    this.popups = [];
    this.banner = null;
    this.cutin = null;
    this.endTimer = -1;
    this.finished = false;
    this.danger = null;
    this.dust = [];
    for (let i = 0; i < 26; i++) this.dust.push({ x: Math.random() * 960, y: 60 + Math.random() * 300, s: 0.5 + Math.random() * 1.5, p: Math.random() * 6 });
    this.buildHud();
    this.consumeEvents();
    this.banner = { text: node.type === 'boss' ? '보스: ' + ENEMIES[waves[0][0]].name : node.type === 'elite' ? '정예 전투!' : '전투 시작', sub: `웨이브 1/${waves.length}`, t: 0, dur: 1.6 };
    if (!Game.hint('battle') && this.sim.enemies.some((e) => e.poiseMax)) Game.hint('break');
    this.breakHintPending = !Game.settings.seenHints.break;
  },

  exit() { this.drag = null; this.cmdDrag = null; this.cmdPress = null; },

  // ------------------------------------------------------------ HUD 구성 (DOM)
  buildHud() {
    const ui = Game.ui;
    const run = this.run;
    const top = el('div', 'b-top');
    this.stageLabel = el('div', 'b-stage', '');
    top.appendChild(this.stageLabel);
    this.pauseBtn = btn('<span class="pz">❚❚</span> 일시정지', 'b-pause', () => this.openPause(), { id: 'btn-pause', sfx: 'pause' });
    top.appendChild(this.pauseBtn);
    const right = el('div', 'b-right');
    this.potionBtn = btn(`🧪 ${run.potions}`, 'b-potion small', () => this.startPotion(), { id: 'btn-bpotion' });
    right.appendChild(this.potionBtn);
    this.speedBtn = btn(`${this.speed}x`, 'b-speed small', () => { this.speed = this.speed === 1 ? 2 : 1; Game.settings.speed = this.speed; Game.saveSettings(); this.speedBtn.innerHTML = `${this.speed}x`; this.speedBtn.classList.toggle('on', this.speed === 2); }, { id: 'btn-speed' });
    this.speedBtn.classList.toggle('on', this.speed === 2);
    right.appendChild(this.speedBtn);
    const seg = el('div', 'seg');
    this.autoBtn = btn('자동', 'seg-btn', () => this.setAuto(true), { id: 'btn-auto' });
    this.manualBtn = btn('수동', 'seg-btn', () => this.setAuto(false), { id: 'btn-manual' });
    seg.appendChild(this.autoBtn); seg.appendChild(this.manualBtn);
    right.appendChild(seg);
    top.appendChild(right);
    ui.appendChild(top);
    this.setAuto(run.autoMode, true);

    this.chipsWrap = el('div', 'b-chips');
    this.chipsWrap.appendChild(el('div', 'chips-label', '적'));
    this.chipEls = {};
    ui.appendChild(this.chipsWrap);

    this.tmsg = el('div', 'b-tmsg hidden');
    ui.appendChild(this.tmsg);
    this.warn = el('div', 'b-warn hidden');
    ui.appendChild(this.warn);

    // 작전 명령 (오른쪽 세로)
    const ord = el('div', 'b-orders');
    ord.appendChild(el('div', 'bo-label', '작전'));
    this.orderBtns = {};
    for (const k of ['charge', 'hold', 'retreat']) {
      const b = btn(ORDERS[k].name, 'bo-btn', () => this.setOrder(k), { id: 'btn-order-' + k });
      this.orderBtns[k] = b;
      ord.appendChild(b);
    }
    ui.appendChild(ord);
    this.setOrder('hold', true);

    // 캐릭터 묶음: 얼굴 + ① ② ③
    const hud = el('div', 'b-hud');
    this.groups = {};
    for (const h of this.sim.heroes) {
      const g = el('div', 'bgroup');
      g.dataset.hero = h.key;
      const face = el('div', 'bg-face');
      face.appendChild(portraitCanvas(h.sprite, 52));
      const hp = bar(1, 'hp'); face.appendChild(hp);
      face.appendChild(el('div', 'bg-name', h.name));
      face.appendChild(el('div', 'bg-stat', ''));
      face.appendChild(el('div', 'bg-dead', '✕'));
      face.id = 'face-' + h.key;
      this.bindFace(face, h);
      g.appendChild(face);
      const btns = {};
      for (const slot of ['s1', 's2', 'ult']) {
        const sk = this.sim.skillDef(h, slot);
        const b = el('button', 'sk sk-' + slot);
        b.type = 'button';
        b.id = `sk-${h.key}-${slot}`;
        b.innerHTML = `<span class="sk-tag"></span><span class="sk-icon">${skillGlyph(sk)}</span><span class="sk-cd"></span><span class="sk-name">${sk.name}</span><span class="sk-kind">${slot === 's1' ? '① 기본' : slot === 's2' ? '② 상황' : '③ 필살기'}</span>`;
        this.bindSkillButton(b, h, slot);
        g.appendChild(b);
        btns[slot] = b;
      }
      hud.appendChild(g);
      this.groups[h.uid] = { root: g, hp, stat: face.querySelector('.bg-stat'), btns, last: '' };
    }
    ui.appendChild(hud);
  },

  setAuto(on, silent) {
    this.run.autoMode = on;
    this.sim.autoMode = on;
    this.autoBtn.classList.toggle('on', on);
    this.manualBtn.classList.toggle('on', !on);
    if (!silent) Game.toast(on ? '자동 전투' : '수동 전투', 900);
  },

  setOrder(k, silent) {
    this.sim.order = k;
    this.sim.clearCommands();
    for (const o in this.orderBtns) this.orderBtns[o].classList.toggle('on', o === k);
    if (!silent) { Sfx.play('click'); this.popupOrder(k); }
  },
  popupOrder(k) { const f = this.sim.frontHero(); if (f) this.popup(f.x, this.unitTop(f) - 20, ORDERS[k].name + '!', '#ffe9a0', 20, { label: true }); },

  // ------------------------------------------------------------ 스킬 버튼: 탭 = 즉시, 끌기 = 슬로모션 지정
  bindSkillButton(b, h, slot) {
    b.addEventListener('pointerdown', (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      Sfx.init(); Sfx.resume();
      if (!h.alive || this.sim.outcome) return;
      try { b.setPointerCapture(ev.pointerId); } catch (e) { /* 무시 */ }
      this.press = { h, slot, b, x0: ev.clientX, y0: ev.clientY, id: ev.pointerId };
    });
    b.addEventListener('pointermove', (ev) => {
      const pr = this.press;
      if (!pr || pr.b !== b) return;
      if (!this.drag && Math.hypot(ev.clientX - pr.x0, ev.clientY - pr.y0) > 12) this.startDrag(pr);
      if (this.drag) this.updateDrag(Input.toLogical(ev));
    });
    const up = (ev) => {
      const pr = this.press;
      if (!pr || pr.b !== b) return;
      this.press = null;
      if (this.drag) this.endDrag(Input.toLogical(ev));
      else if (ev.type === 'pointerup') this.tapSkill(h, slot);
    };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
  },

  // ------------------------------------------------------------ 캐릭터 끌기: 지점 = 이동, 적 = 공격 대상
  bindFace(face, h) {
    face.addEventListener('pointerdown', (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      Sfx.init(); Sfx.resume();
      if (!h.alive || this.sim.outcome) return;
      if (this.potionPick) { this.usePotionOn(h); return; }
      try { face.setPointerCapture(ev.pointerId); } catch (e) { /* 무시 */ }
      this.cmdPress = { h, x0: ev.clientX, y0: ev.clientY, el: face, client: true };
    });
    face.addEventListener('pointermove', (ev) => {
      const pr = this.cmdPress;
      if (!pr || pr.el !== face) return;
      if (!this.cmdDrag && Math.hypot(ev.clientX - pr.x0, ev.clientY - pr.y0) > 12) this.startCmd(pr);
      if (this.cmdDrag) this.updateCmd(Input.toLogical(ev));
    });
    const up = (ev) => {
      const pr = this.cmdPress;
      if (!pr || pr.el !== face) return;
      this.cmdPress = null;
      if (this.cmdDrag) this.endCmd(ev.type === 'pointerup' ? Input.toLogical(ev) : null);
    };
    face.addEventListener('pointerup', up);
    face.addEventListener('pointercancel', up);
  },
  startCmd(pr) {
    if (!pr.h.alive) return;
    this.cmdDrag = { h: pr.h, el: pr.el, x: pr.h.x, y: pr.h.y, fx: pr.h.x, fy: pr.h.y, unit: null, over: false };
    Game.ui.classList.add('dragging');
    Sfx.play('click');
  },
  updateCmd(p) {
    const d = this.cmdDrag;
    if (!d) return;
    d.x = p.x; d.y = p.y;
    d.over = p.y < 430 && p.y > 64;
    d.fx = clamp(p.x, CONST.FIELD_X0, CONST.FIELD_X1); d.fy = clamp(p.y + 30, CONST.FIELD_Y0, CONST.FIELD_Y1);
    d.unit = null;
    let bd = 70;
    for (const u of this.sim.aliveEnemies()) { const dd = Math.hypot(u.x - p.x, (u.y - 40) - p.y); if (dd < bd) { bd = dd; d.unit = u; } }
  },
  endCmd(p) {
    if (p) this.updateCmd(p);
    const d = this.cmdDrag;
    this.cmdDrag = null;
    Game.ui.classList.remove('dragging');
    if (!d || !d.over || !d.h.alive) return;
    const ok = d.unit ? this.sim.command(d.h, { type: 'attack', unit: d.unit }) : this.sim.command(d.h, { type: 'move', x: d.fx, y: d.fy });
    if (!ok) return;
    Sfx.play('click');
    if (d.unit) this.popup(d.unit.x, this.unitTop(d.unit) - 18, `${d.h.name} 공격`, '#ffb0a0', 16, { label: true });
    else this.popup(d.fx, d.fy - 50, d.h.actLock > 0 ? `${d.h.name} 동작 후 이동` : `${d.h.name} 이동`, '#c8f0ff', 16, { label: true });
  },

  explainCant(h, slot) {
    Sfx.play('back');
    if (h.statuses.stun) Game.toast(`${h.name} 기절 중!`, 900);
    else if (slot === 'ult') Game.toast(`필살기 게이지 ${Math.floor(h.ult)}%`, 900);
    else Game.toast(`쿨타임 ${h.cds[slot].toFixed(1)}초`, 900);
  },

  tapSkill(h, slot) {
    if (!this.sim.canCast(h, slot)) { this.explainCant(h, slot); return; }
    const spec = this.sim.resolveTarget(h, slot);
    if (!spec) { Sfx.play('back'); Game.toast(this.sim.skillDef(h, slot).target === 'ally' || this.sim.skillDef(h, slot).target === 'area_ally' ? '회복할 아군이 없어요' : '사거리 안에 대상이 없어요', 1000); return; }
    if (this.sim.cast(h, slot, spec)) { Sfx.play('skill'); this.slowmo = CONST.CONFIRM_SLOWMO_SEC; }
  },

  startDrag(pr) {
    const { h, slot } = pr;
    if (!this.sim.canCast(h, slot)) { this.explainCant(h, slot); this.press = null; return; }
    const sk = this.sim.skillDef(h, slot);
    this.drag = { h, slot, sk, b: pr.b, x: 0, y: 0, unit: null, over: false };
    Game.ui.classList.add('dragging');
    pr.b.classList.add('drag');
    this.tmsg.innerHTML = `<b>${h.name} · ${sk.name}</b>`;
    this.tmsg.classList.remove('hidden');
    Sfx.play('click');
  },

  updateDrag(p) {
    const d = this.drag;
    if (!d) return;
    d.x = p.x; d.y = p.y;
    d.over = p.y < 430 && p.y > 64; // 전장 위에 있는가
    const fy = clamp(p.y + 30, CONST.FIELD_Y0, CONST.FIELD_Y1); // 손가락 아래 바닥 지점 (손가락에 가리지 않게 살짝 위를 가리킴)
    d.fx = p.x; d.fy = fy;
    d.unit = null;
    const t = d.sk.target;
    if (t === 'enemy' || t === 'ally') {
      const list = t === 'enemy' ? this.sim.aliveEnemies() : this.sim.aliveHeroes();
      let best = null, bd = 90;
      for (const u of list) { const dd = Math.hypot(u.x - p.x, (u.y - 40) - p.y); if (dd < bd) { bd = dd; best = u; } }
      d.unit = best;
    }
  },

  endDrag(p) {
    if (p) this.updateDrag(p); // 놓은 위치로 최종 대상 갱신
    const d = this.drag;
    this.drag = null;
    Game.ui.classList.remove('dragging');
    d.b.classList.remove('drag');
    this.tmsg.classList.add('hidden');
    if (!d.over) { Sfx.play('back'); Game.toast('취소', 600); return; }
    const t = d.sk.target;
    let spec;
    if (t === 'enemy' || t === 'ally') { if (!d.unit) { Sfx.play('back'); Game.toast('대상이 없어요', 900); return; } spec = { unit: d.unit }; }
    else if (t === 'area_enemy' || t === 'area_ally') spec = { x: d.fx, y: d.fy };
    else spec = this.sim.resolveTarget(d.h, d.slot) || {};
    if (this.sim.cast(d.h, d.slot, spec)) { Sfx.play('skill'); this.slowmo = CONST.CONFIRM_SLOWMO_SEC; }
    else this.explainCant(d.h, d.slot);
  },

  // ------------------------------------------------------------ 회복약 (초상화/아군 탭)
  startPotion() {
    if (this.sim.outcome) return;
    if (this.run.potions <= 0) { Game.toast('회복약이 없어요.', 900); return; }
    this.potionPick = true;
    this.tmsg.innerHTML = '회복약을 누구에게 쓸까요?';
    this.tmsg.classList.remove('hidden');
    Game.ui.classList.add('potion-pick');
  },
  endPotion() { this.potionPick = false; this.tmsg.classList.add('hidden'); Game.ui.classList.remove('potion-pick'); },
  usePotionOn(h) {
    if (!h.alive) return;
    this.run.potions--;
    this.sim._heal(null, h, h.maxHp * REWARD.potionHealPct);
    Sfx.play('heal');
    this.endPotion();
  },

  onChip(u) {
    if (!u.alive) return;
    Sfx.play('click');
    this.sim.focus = this.sim.focus === u ? null : u;
    if (this.sim.focus) this.popup(u.x, this.unitTop(u) - 18, '집중 공격!', '#ff8aa0', 18, { label: true });
  },

  drawMoveMark(ctx, x, y, t, a) {
    ctx.save(); ctx.globalAlpha = a;
    ctx.strokeStyle = '#c8f0ff'; ctx.lineWidth = 2.5;
    const r = 16 + Math.sin(t * 6) * 2;
    ctx.beginPath(); ctx.ellipse(x, y, r, r / CONST.Y_WEIGHT, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.lineTo(x + 6, y); ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4); ctx.stroke();
    ctx.restore();
  },

  unitAt(p) {
    const all = this.sim.enemies.concat(this.sim.heroes).filter((u) => u.alive);
    let best = null, bd = 1e9;
    for (const u of all) {
      const s = getSprite(u.sprite);
      const sc = this.unitScale(u);
      const w = s.w * sc * 0.8, h = s.h * sc;
      if (p.x >= u.x - w / 2 && p.x <= u.x + w / 2 && p.y >= u.y - h && p.y <= u.y + 6) { const d = Math.abs(p.x - u.x) + Math.abs(p.y - u.y + h / 2) * 0.3; if (d < bd) { bd = d; best = u; } }
    }
    return best;
  },

  pointerDown(p) {
    if (this.potionPick) { const u = this.unitAt(p); if (u && u.side === 'hero') this.usePotionOn(u); else { Sfx.play('back'); this.endPotion(); } return; }
    const u = this.unitAt(p);
    if (u && u.side === 'enemy') this.onChip(u); // 적을 탭하면 집중 공격
    else if (u && u.side === 'hero' && !this.sim.outcome) this.cmdPress = { h: u, x0: p.x, y0: p.y, el: null };
  },
  pointerMove(p) {
    const pr = this.cmdPress;
    if (!pr || pr.el) return;
    if (!this.cmdDrag && Math.hypot(p.x - pr.x0, p.y - pr.y0) > 10) this.startCmd(pr);
    if (this.cmdDrag) this.updateCmd(p);
  },
  pointerUp(p) {
    const pr = this.cmdPress;
    if (!pr || pr.el) return;
    this.cmdPress = null;
    if (this.cmdDrag) this.endCmd(p);
  },

  openPause() {
    if (this.sim.outcome) return;
    this.paused = true;
    const box = el('div', 'pause-box');
    box.appendChild(el('div', 'modal-title', '일시정지'));
    const st = el('div', 'pause-stats');
    st.innerHTML = this.sim.heroes.map((h) => `<div><b>${h.name}</b> 피해 ${Math.round(h.stats.dealt)} · 회복 ${Math.round(h.stats.healed)}</div>`).join('');
    box.appendChild(st);
    const row = el('div', 'btn-col');
    row.appendChild(btn('▶ 계속하기', 'primary', () => { Game.closeModal(); this.paused = false; }, { id: 'pause-resume' }));
    row.appendChild(btn('⚙ 자동 전략 편집', '', () => openStrategyEditor(this.run, () => { this.sim.strategy = this.run.strategy; this.openPause(); }), { id: 'pause-strategy' }));
    row.appendChild(btn(`효과음: ${Game.settings.sound ? '켬' : '끔'}`, '', (e) => { Game.settings.sound = !Game.settings.sound; Sfx.enabled = Game.settings.sound; Game.saveSettings(); e.target.innerHTML = `효과음: ${Game.settings.sound ? '켬' : '끔'}`; }, { id: 'pause-sound' }));
    row.appendChild(btn('원정 포기', 'danger', () => this.confirmGiveUp(), { id: 'pause-giveup' }));
    box.appendChild(row);
    Game.modal(box, { dim: true });
  },

  confirmGiveUp() {
    const box = el('div', 'confirm-box');
    box.appendChild(el('div', 'modal-title', '정말 포기할까요?'));
    box.appendChild(el('p', '', '이번 원정은 패배로 기록됩니다.'));
    const row = el('div', 'btn-row');
    row.appendChild(btn('돌아가기', 'ghost', () => this.openPause(), { sfx: 'back', id: 'giveup-no' }));
    row.appendChild(btn('포기', 'danger', () => { Game.closeModal(); this.finish('lose', true); }, { id: 'giveup-yes' }));
    box.appendChild(row);
    Game.modal(box, { dim: true });
  },

  // ------------------------------------------------------------ 진행
  update(dtReal) {
    this.t += dtReal;
    if (this.hitstop > 0) { this.hitstop -= dtReal; this.updateFx(dtReal * 0.2); this.updateHud(); return; }
    let scale = this.speed;
    if (this.paused || Game.modalOpen || this.potionPick) scale = 0;
    if (this.drag || this.cmdDrag) scale *= CONST.DRAG_SLOWMO;
    // 위험 순간: 아군이 차지 범위 안에 있으면 슬로모션
    this.danger = null;
    for (const e of this.sim.enemies) if (e.alive && e.charge) {
      const inZone = this.sim.aliveHeroes().filter((h) => this.sim.inChargeZone(h, e.charge)).length;
      if (inZone && (!this.danger || e.charge.t < this.danger.t)) this.danger = { e, t: e.charge.t, n: inZone };
    }
    if (this.danger && !this.drag) scale *= CONST.DANGER_SLOWMO;
    if (this.slowmo > 0) { this.slowmo -= dtReal; scale *= CONST.CONFIRM_SLOWMO_SCALE; }
    if (this.cutin) { this.cutin.t += dtReal; if (this.cutin.t < this.cutin.dur) scale *= 0.12; else this.cutin = null; }
    scale *= Game.debug.simMult;
    this.acc += Math.min(dtReal, 0.1) * scale;
    let steps = 0;
    while (this.acc >= CONST.SIM_DT && steps < 240) {
      this.sim.step(CONST.SIM_DT);
      this.acc -= CONST.SIM_DT;
      steps++;
      this.consumeEvents();
    }
    this.shake = Math.max(0, this.shake - dtReal * 30);
    this.updateFx(dtReal * (scale > 0 ? Math.min(scale, 2) : 0.15));
    if (this.banner) { this.banner.t += dtReal; if (this.banner.t > this.banner.dur) this.banner = null; }
    if (this.endTimer > 0) { this.endTimer -= dtReal; if (this.endTimer <= 0) this.finish(this.sim.outcome); }
    if (this.drag && !this.drag.h.alive) { this.drag.over = false; this.endDrag(null); }
    this.updateHud();
  },

  consumeEvents() {
    const ev = this.sim.events;
    if (this.breakHintPending && !Game.modalOpen && this.sim.enemies.some((e) => e.alive && e.poiseMax && e.x < 960)) { this.breakHintPending = false; Game.hint('break'); }
    if (!ev.length) return;
    for (const e of ev) this.onEvent(e);
    ev.length = 0;
  },

  unitScale(u) { return u.def.abilities && u.def.abilities.includes('boss') ? CONST.SPRITE_SCALE * 1.15 : CONST.SPRITE_SCALE; },
  unitTop(u) { return u.y - getSprite(u.sprite).h * this.unitScale(u); },

  popup(x, y, text, color, size, opts) {
    if (opts && opts.label) {
      for (const q of this.popups) if (q.label && q.t < 0.5 && Math.abs(q.x - x) < 120 && Math.abs(q.y - y) < 20) y = q.y - 22;
      return this.popups.push(Object.assign({ x, y, text, color, size: size || 20, t: 0, dur: 0.9, vy: -40 }, opts));
    }
    this.popups.push(Object.assign({ x: x + (Math.random() - 0.5) * 16, y, text, color, size: size || 20, t: 0, dur: 0.9, vy: -60 }, opts || {}));
  },

  onEvent(e) {
    const run = this.run;
    switch (e.type) {
      case 'hit': {
        const u = e.target;
        const y = this.unitTop(u) + 6;
        if (e.shielded) { this.popup(u.x, y, '보호막', '#cfe6ff', 16); break; }
        if (e.dot) this.popup(u.x, y + 10, String(e.amount), STATUS[e.dot].color, 15, { dur: 0.7 });
        else if (e.crit) { this.popup(u.x, y - 6, e.amount + '!', '#ffd34a', 30, { crit: true }); Sfx.play('crit'); this.hitstop = Math.max(this.hitstop, CONST.HITSTOP_MS / 1000 * 1.4); this.shake = Math.max(this.shake, 4); }
        else { this.popup(u.x, y, String(e.amount), u.side === 'hero' ? '#ff8a7a' : '#ffffff', e.skill ? 24 : 19); Sfx.play('hit'); if (e.skill) this.hitstop = Math.max(this.hitstop, CONST.HITSTOP_MS / 1000); this.shake = Math.max(this.shake, e.skill ? 3 : 1.5); }
        if (!e.dot) this.spark(u.x, u.y - 30 * (u.size || 1), e.crit ? 14 : 7, e.crit ? '#ffe066' : '#fff6c0');
        break;
      }
      case 'heal':
        if (!e.quiet || e.amount >= 8) this.popup(e.target.x, this.unitTop(e.target) + 4, '+' + e.amount, '#6fe08a', e.quiet ? 15 : 22);
        if (!e.quiet) { Sfx.play('heal'); this.sparkle(e.target.x, e.target.y - 30, '#9cf0a8', 10); }
        break;
      case 'death': {
        const u = e.unit;
        this.smoke(u.x, u.y - 20, u.size || 1);
        Sfx.play('death');
        if (u.side === 'hero') { Game.toast(`💀 ${u.name} 쓰러짐`, 2400); run.stats.deathsAt[u.key] = `${this.node.stage}스테이지`; this.shake = 6; }
        break;
      }
      case 'projectile':
        this.fx.push({ type: 'proj', kind: e.kind, x0: e.from.x + 14 * e.from.face, y0: e.from.y - 40, to: e.to, t: 0, dur: e.travel });
        Sfx.play(e.kind === 'soldam' ? 'magic' : 'shoot');
        break;
      case 'dash': this.smoke(e.unit.x, e.unit.y - 6, 0.5); break;
      case 'cast': this.castFx(e); break;
      case 'ult': this.cutin = { hero: e.unit, name: e.skill.name, t: 0, dur: 0.85 }; Sfx.play('ult'); break;
      case 'ultReady': this.popup(e.unit.x, this.unitTop(e.unit) - 8, '필살기 준비!', '#ffd34a', 15); break;
      case 'status':
        if (e.status === 'stun') this.popup(e.target.x, this.unitTop(e.target) - 4, '기절!', STATUS.stun.color, 18);
        else if (['bleed', 'burn', 'vuln'].includes(e.status)) this.popup(e.target.x, this.unitTop(e.target) - 2, STATUS[e.status].name, STATUS[e.status].color, 14, { dur: 0.7 });
        break;
      case 'chargeStart':
        Sfx.play('charge');
        this.popup(e.unit.x, this.unitTop(e.unit) - 10, '차지!', '#ff5a4a', 24);
        if (!Game.settings.seenHints.charge) Game.hint('charge');
        break;
      case 'chargeImpact':
        Sfx.play('boom');
        this.shake = 12; this.hitstop = 0.12;
        for (let i = 0; i < 18; i++) { const a = Math.random() * 6.28, r = Math.random() * e.r; this.fx.push({ type: 'dust', x: e.cx + Math.cos(a) * r, y: e.cy + Math.sin(a) * r * 0.45, vx: (Math.random() - 0.5) * 120, vy: -40 - Math.random() * 90, t: 0, dur: 0.7 + Math.random() * 0.4 }); }
        this.fx.push({ type: 'flash', t: 0, dur: 0.25, color: 'rgba(255,90,60,' });
        if (e.blocked) this.popup(e.cx, e.cy - 120, '토비가 막았다!', '#7ab8f0', 20);
        else if (!e.hit) this.popup(e.cx, e.cy - 60, '회피!', '#9fd0ff', 24, { crit: true });
        break;
      case 'chargeCancel': Sfx.play('cancel'); this.popup(e.unit.x, this.unitTop(e.unit) - 14, '캔슬!', '#ffd34a', 30, { crit: true }); this.hitstop = 0.1; break;
      case 'callStart': this.popup(e.unit.x, this.unitTop(e.unit) - 10, '동료 호출!', '#ffb04a', 18); Sfx.play('summon'); break;
      case 'callCancel': this.popup(e.unit.x, this.unitTop(e.unit) - 10, '호출 저지!', '#ffd34a', 20); Sfx.play('cancel'); break;
      case 'summon': this.smoke(e.unit.x, e.unit.y - 20, 0.8); break;
      case 'shake': this.popup(e.unit.x, this.unitTop(e.unit) - 14, '흔들림!', '#ffb050', 20, { label: true }); break;
      case 'interrupt': Sfx.play('click'); break; // 진행은 머리 위 끊기 칸으로 표시
      case 'enrageStack': this.popup(e.unit.x, this.unitTop(e.unit) - 18, `격노 ${e.n}`, '#ff6a5a', 18, { label: true }); break;
      case 'crushWarn': if (!Game.settings.seenHints.crush) Game.hint('crush'); this.popup(e.unit.x, this.unitTop(e.unit) - 18, '짓눌림!', '#ff9a6a', 17, { label: true }); break;
      case 'bossLeap': this.popup(e.unit.x, this.unitTop(e.unit) - 18, '덮치기!', '#ff9a6a', 18, { label: true }); this.shake = Math.max(this.shake, 6); break;
      case 'armorUp': this.popup(e.unit.x, this.unitTop(e.unit) - 18, '방어 강화!', '#cfe6ff', 18, { label: true }); break;
      case 'immune': this.popup(e.unit.x, this.unitTop(e.unit) - 10, '면역', '#cfcfcf', 15); break;
      case 'break':
        this.popup(e.unit.x, this.unitTop(e.unit) - 24, '그로기!', '#ffd34a', 34, { crit: true, dur: 1.2 });
        this.banner = { text: '그로기!', sub: `${e.unit.name} 무방비`, t: 0, dur: 1.3 };
        Sfx.play('crit'); this.shake = 8; this.hitstop = 0.12;
        this.fx.push({ type: 'flash', t: 0, dur: 0.3, color: 'rgba(255,220,120,' });
        break;
      case 'revive': this.popup(e.unit.x, this.unitTop(e.unit) - 20, '부활!', '#9cf0a8', 24, { crit: true }); this.sparkle(e.unit.x, e.unit.y - 30, '#9cf0a8', 20); Sfx.play('heal'); break;
      case 'passive': this.popup(e.unit.x, this.unitTop(e.unit) - 22, e.name, '#fff6c0', 16, { label: true }); break;
      case 'breakEnd': this.popup(e.unit.x, this.unitTop(e.unit) - 10, '방어 태세', '#9fd0ff', 16); break;
      case 'enrage': this.popup(e.unit.x, this.unitTop(e.unit) - 10, '광폭화!', '#ff4a3a', 22); break;
      case 'warcry': this.popup(e.unit.x, this.unitTop(e.unit) - 10, '함성!', '#ffb04a', 18); this.shake = 4; break;
      case 'phase': this.banner = { text: e.name, sub: `${e.unit.name}의 패턴이 바뀐다!`, t: 0, dur: 2.0, danger: true }; Sfx.play('phase'); this.shake = 10; break;
      case 'wave': if (e.index > 0) this.banner = { text: `웨이브 ${e.index + 1}/${e.total}`, sub: '적이 몰려온다!', t: 0, dur: 1.4 }; break;
      case 'end':
        this.endTimer = e.outcome === 'win' ? 1.3 : 1.6;
        if (this.drag) { this.drag.over = false; this.endDrag(null); }
        this.banner = e.outcome === 'win' ? { text: '승리!', sub: '', t: 0, dur: 2 } : { text: '전멸…', sub: '', t: 0, dur: 2, danger: true };
        Sfx.play(e.outcome === 'win' ? 'win' : 'lose');
        break;
      default: break;
    }
  },

  castFx(e) {
    const h = e.unit, sk = e.skill, spec = e.spec || {};
    Sfx.play(sk.fx === 'starbolt' || sk.fx === 'meteor' || sk.fx === 'nova' ? 'magic' : 'skill');
    this.popup(h.x, this.unitTop(h) - 16, sk.name, '#fff0a0', 16, { dur: 0.8, label: true });
    const tu = spec.unit;
    switch (sk.fx) {
      case 'slash': case 'bash': case 'flurry':
        this.fx.push({ type: 'slash', x: tu ? tu.x : h.x + 40 * h.face, y: (tu ? tu.y : h.y) - 36, t: 0, dur: sk.fx === 'flurry' ? 0.75 : 0.3, color: sk.fx === 'bash' ? '#9fd0ff' : '#ffffff', multi: sk.fx === 'flurry' });
        break;
      case 'spin': this.fx.push({ type: 'spin', x: h.x, y: h.y, r: sk.areaR, t: 0, dur: 0.4 }); break;
      case 'pierce': case 'starbolt': case 'snipe': if (tu) this.fx.push({ type: 'proj', kind: sk.fx, x0: h.x + 14 * h.face, y0: h.y - 40, to: tu, t: 0, dur: e.delay, big: true }); break;
      case 'meteor': for (let i = 0; i < 7; i++) { const a = Math.random() * 6.28, r = Math.random() * sk.areaR; this.fx.push({ type: 'meteor', tx: spec.x + Math.cos(a) * r, ty: spec.y + Math.sin(a) * r * 0.45, t: -i * 0.06, dur: 0.5 }); } this.fx.push({ type: 'zone', x: spec.x, y: spec.y, r: sk.areaR, t: 0, dur: 0.7, color: '255,180,80' }); break;
      case 'arrowrain': for (let i = 0; i < 16; i++) { const a = Math.random() * 6.28, r = Math.random() * sk.areaR; this.fx.push({ type: 'arrowdrop', tx: spec.x + Math.cos(a) * r, ty: spec.y + Math.sin(a) * r * 0.45, t: -Math.random() * 0.25, dur: 0.45 }); } this.fx.push({ type: 'zone', x: spec.x, y: spec.y, r: sk.areaR, t: 0, dur: 0.6, color: '255,220,140' }); break;
      case 'nova':
        this.fx.push({ type: 'flash', t: 0, dur: 0.5, color: 'rgba(200,170,255,' });
        for (const en of this.sim.aliveEnemies()) for (let i = 0; i < 3; i++) this.fx.push({ type: 'meteor', tx: en.x + (Math.random() - 0.5) * 40, ty: en.y, t: -i * 0.08 - Math.random() * 0.1, dur: 0.4, big: true });
        break;
      case 'heal': if (tu) this.sparkle(tu.x, tu.y - 30, '#9cf0a8', 14); break;
      case 'aoeheal': this.fx.push({ type: 'zone', x: spec.x, y: spec.y, r: sk.areaR, t: 0, dur: 0.7, color: '140,240,160' }); break;
      case 'taunt': this.fx.push({ type: 'zone', x: h.x, y: h.y, r: 70, t: 0, dur: 0.5, color: '200,106,240' }); this.popup(h.x, this.unitTop(h) - 30, '이리 와!', '#e0a0ff', 20); break;
      case 'wall': for (const a of this.sim.aliveHeroes()) this.fx.push({ type: 'shield', unit: a, t: 0, dur: 1.0 }); break;
      case 'tree': { const c = this.sim.aliveHeroes(); const mx = c.reduce((s, a) => s + a.x, 0) / Math.max(1, c.length); this.fx.push({ type: 'tree', x: mx - 40, y: CONST.FIELD_Y0 + 10, t: 0, dur: 1.6 }); break; }
      default: break;
    }
  },

  spark(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 160;
      this.fx.push({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, t: 0, dur: 0.25 + Math.random() * 0.2, color });
    }
  },
  sparkle(x, y, color, n) {
    for (let i = 0; i < n; i++) this.fx.push({ type: 'sparkle', x: x + (Math.random() - 0.5) * 40, y: y + (Math.random() - 0.5) * 30, vy: -30 - Math.random() * 40, t: -Math.random() * 0.2, dur: 0.7, color });
  },
  smoke(x, y, size) {
    for (let i = 0; i < 12; i++) this.fx.push({ type: 'smoke', x: x + (Math.random() - 0.5) * 30 * size, y: y + (Math.random() - 0.5) * 20, vx: (Math.random() - 0.5) * 40, vy: -20 - Math.random() * 40, r: (8 + Math.random() * 10) * size, t: 0, dur: 0.8 + Math.random() * 0.4 });
  },

  updateFx(dt) {
    for (let i = this.fx.length - 1; i >= 0; i--) {
      const f = this.fx[i];
      f.t += dt;
      if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; if (f.type === 'spark' || f.type === 'dust') f.vy += 300 * dt; }
      else if (f.vy !== undefined && f.type === 'sparkle') f.y += f.vy * dt;
      if (f.t >= f.dur) this.fx.splice(i, 1);
    }
    for (let i = this.popups.length - 1; i >= 0; i--) {
      const p = this.popups[i];
      p.t += dt;
      p.y += p.vy * dt * (1 - p.t / p.dur);
      if (p.t >= p.dur) this.popups.splice(i, 1);
    }
  },

  finish(outcome, gaveUp) {
    if (this.finished) return;
    this.finished = true;
    const run = this.run;
    const sum = this.sim.summary();
    for (const h of sum.heroes) {
      const rh = run.heroes[h.id];
      rh.hp = h.hp;
      if (!h.alive) rh.dead = true; // 영구 사망
      run.stats.dealt[h.id] += h.stats.dealt;
      run.stats.healed[h.id] += h.stats.healed;
    }
    run.stats.kills += sum.kills;
    run.stats.battles++;
    if (run.fruit && run.fruit.battles > 0) { run.fruit.battles--; if (run.fruit.battles <= 0) run.fruit = null; }
    if (outcome === 'win' && !gaveUp) {
      grantBattleLoot(run, this.node);
      if (this.node.type === 'boss') { run.result = 'victory'; Game.go('result'); }
      else if (this.node.fromEvent) { Game.go('reward', { node: this.node, goldOnly: true }); }
      else Game.go('reward', { node: this.node });
    } else {
      run.result = gaveUp ? 'giveup' : 'defeat';
      Game.go('result');
    }
  },

  // ------------------------------------------------------------ HUD 갱신
  // ------------------------------------------------------------ HUD 갱신
  updateHud() {
    const sim = this.sim;
    this.stageLabel.textContent = `던전 ${this.node.stage}/${CONST.STAGES} · 웨이브 ${sim.waveIndex + 1}/${sim.waves.length}`;
    this.potionBtn.innerHTML = `🧪 ${this.run.potions}`;
    this.potionBtn.disabled = this.run.potions <= 0;
    // 위험 경고
    if (this.danger) {
      this.warn.classList.remove('hidden');
      const txt = `⚠ ${this.danger.e.name} 차지 ${Math.max(0, this.danger.t).toFixed(1)}초`;
      if (this.warn.dataset.t !== txt) { this.warn.dataset.t = txt; this.warn.innerHTML = `<b>${txt}</b>`; }
    } else this.warn.classList.add('hidden');
    // 적 칩
    const alive = sim.enemies.filter((u) => u.alive).sort((a, b) => a.x - b.x);
    const seen = new Set();
    alive.forEach((u, idx) => {
      seen.add(u.uid);
      let c = this.chipEls[u.uid];
      if (!c) {
        const root = el('button', 'chip');
        root.type = 'button';
        root.dataset.uid = u.uid;
        root.appendChild(portraitCanvas(u.sprite, 30, { flip: true }));
        const body = el('div', 'chip-body');
        const hp = bar(1, 'hp enemy'); body.appendChild(hp);
        const st = el('div', 'chip-st', ''); body.appendChild(st);
        root.appendChild(body);
        const ch = bar(0, 'charge'); root.appendChild(ch);
        const po = u.poiseMax ? bar(1, 'poise') : null; if (po) body.appendChild(po);
        if (u.poiseMax) root.appendChild(el('div', 'chip-armor', `🛡${Math.round(u.armor * 100)}`));
        root.appendChild(el('div', 'chip-focus', '집중'));
        root.addEventListener('click', (e) => { e.stopPropagation(); this.onChip(u); });
        if (u.def.abilities.includes('boss')) root.classList.add('boss');
        this.chipsWrap.appendChild(root);
        c = this.chipEls[u.uid] = { root, hp, st, ch, po, last: '' };
      }
      c.root.style.order = idx;
      setBar(c.hp, u.hp / u.maxHp);
      if (c.po) { setBar(c.po, u.broken > 0 ? u.broken / CONST.BREAK_DUR : u.poise / u.poiseMax); c.po.classList.toggle('broken', u.broken > 0); }
      c.root.classList.toggle('broken', u.broken > 0);
      c.root.classList.toggle('shaken', u.shaken > 0 && !(u.broken > 0));
      const s = this.statusIcons(u);
      if (s !== c.last) { c.st.innerHTML = s; c.last = s; }
      const casting = u.charge || u.call;
      c.root.classList.toggle('charging', !!casting);
      if (casting) setBar(c.ch, 1 - casting.t / casting.total);
      c.root.classList.toggle('focused', sim.focus === u);
      const d = this.drag;
      c.root.classList.toggle('inarea', !!d && d.over && ((d.unit === u) || ((d.sk.target === 'area_enemy') && sim.unitsInArea(d.h, d.slot, d.fx, d.fy).includes(u))));
    });
    for (const uid in this.chipEls) if (!seen.has(+uid)) { this.chipEls[uid].root.remove(); delete this.chipEls[uid]; }
    // 캐릭터 묶음
    for (const h of sim.heroes) {
      const g = this.groups[h.uid];
      setBar(g.hp, h.hp / h.maxHp);
      g.hp.classList.toggle('low', h.hp / h.maxHp < 0.3);
      g.root.classList.toggle('dead', !h.alive);
      g.root.classList.toggle('pick', !!this.potionPick && h.alive);
      const s = this.statusIcons(h);
      if (s !== g.last) { g.stat.innerHTML = s; g.last = s; }
      const st = this.run.strategy[h.key] || AI_PRESETS[h.key];
      for (const slot of ['s1', 's2', 'ult']) {
        const b = g.btns[slot];
        let frac, txt = '';
        if (slot === 'ult') { frac = 1 - h.ult / 100; if (h.ult < 100) txt = Math.floor(h.ult) + '%'; }
        else { frac = h.cds[slot] / sim.skillCdMax(h, slot); if (h.cds[slot] > 0) txt = String(Math.ceil(h.cds[slot])); }
        b.style.setProperty('--cd', clamp(frac, 0, 1).toFixed(3));
        const cdEl = b.children[2];
        if (cdEl.textContent !== txt) cdEl.textContent = txt;
        const ready = sim.canCast(h, slot);
        const hint = slot === 's2' ? sim.skillHint(h, slot) : '';
        const auto = sim.autoMode && st[slot] && st[slot].auto;
        let tag = '';
        const sk = sim.skillDef(h, slot);
        const dmgSkill = sk.power > 0 && sk.target !== 'self' && sk.target !== 'party';
        const breakNow = dmgSkill && sim.enemies.some((e) => e.alive && e.broken > 0);
        if (ready && breakNow && slot !== 's1') tag = '그로기!';
        else if (ready && hint === 'now') tag = '지금!';
        else if (ready && hint === 'hint') tag = '추천!';
        
        const tagEl = b.children[0];
        if (tagEl.textContent !== tag) tagEl.textContent = tag;
        b.classList.toggle('ready', ready);
        b.classList.toggle('cooling', txt !== '');
        b.classList.toggle('hint', ready && hint === 'hint');
        b.classList.toggle('now', ready && (hint === 'now' || (breakNow && slot !== 's1')));
        b.classList.toggle('glow', ready && slot === 'ult');
        b.classList.toggle('auto', !!auto);
        const kind = b.children[4];
        const kt = auto ? (slot === 's1' ? '① 자동' : slot === 's2' ? '② 자동' : '③ 자동') : (slot === 's1' ? '① 기본' : slot === 's2' ? '② 상황' : '③ 필살기');
        if (kind.textContent !== kt) kind.textContent = kt;
      }
    }
  },

  // ------------------------------------------------------------ 렌더
  render(ctx) {
    const sim = this.sim;
    const t = this.t;
    ctx.save();
    if (this.shake > 0) ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    this.drawBackground(ctx, Math.sin(t * 0.3) * 6, t);
    // 차지 위험 범위 (원형)
    for (const e of sim.enemies) {
      if (!e.alive || !e.charge) continue;
      const c = e.charge, prog = 1 - c.t / c.total;
      const pulse = 0.35 + Math.sin(t * (10 + prog * 20)) * 0.15 + prog * 0.3;
      ctx.fillStyle = `rgba(220,40,30,${pulse * 0.5})`;
      this.floorEllipse(ctx, c.cx, c.cy, c.r, c.r * 0.45);
      ctx.strokeStyle = `rgba(255,120,90,${0.6 + pulse * 0.4})`; ctx.lineWidth = 2.5; ctx.setLineDash([7, 5]);
      ctx.beginPath(); ctx.ellipse(c.cx, c.cy, c.r, c.r * 0.45, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = `rgba(255,60,40,${0.25 + prog * 0.3})`;
      this.floorEllipse(ctx, c.cx, c.cy, c.r * prog, c.r * 0.45 * prog);
    }
    // 집중 공격 표시
    if (sim.focus && sim.focus.alive) {
      const f = sim.focus, r = 26 + Math.sin(t * 6) * 2, y = f.y - getSprite(f.sprite).h * this.unitScale(f) * 0.5;
      ctx.strokeStyle = 'rgba(255,77,109,0.9)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(f.x, f.y + 2, 30 * (f.size || 1), 10, 0, 0, Math.PI * 2); ctx.stroke();
      for (const a of [0, 1.57, 3.14, 4.71]) { ctx.beginPath(); ctx.moveTo(f.x + Math.cos(a) * (r - 6), y + Math.sin(a) * (r - 6)); ctx.lineTo(f.x + Math.cos(a) * (r + 7), y + Math.sin(a) * (r + 7)); ctx.stroke(); }
    }
    // 끌기 미리보기 (범위)
    const d = this.drag;
    if (d && d.over && (d.sk.target === 'area_enemy' || d.sk.target === 'area_ally' || d.sk.target === 'self_area')) {
      const cx = d.sk.target === 'self_area' ? d.h.x : d.fx, cy = d.sk.target === 'self_area' ? d.h.y : d.fy;
      const col = d.sk.target === 'area_ally' ? '120,240,150' : '255,210,80';
      const r = d.sk.areaR, ry = r / CONST.Y_WEIGHT;
      ctx.fillStyle = `rgba(${col},${0.16 + Math.sin(t * 6) * 0.05})`; this.floorEllipse(ctx, cx, cy, r, ry);
      ctx.strokeStyle = `rgba(${col},0.95)`; ctx.lineWidth = 2.5; ctx.setLineDash([8, 6]); ctx.lineDashOffset = -t * 30;
      ctx.beginPath(); ctx.ellipse(cx, cy, r, ry, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
    const units = sim.heroes.concat(sim.enemies).filter((u) => u.alive);
    units.sort((a, b) => a.y - b.y);
    const inArea = d && d.over && d.sk.areaR ? new Set(sim.unitsInArea(d.h, d.slot, d.fx, d.fy).map((u) => u.uid)) : null;
    for (const u of units) this.drawUnit(ctx, u, t, (inArea && inArea.has(u.uid)) || (d && d.unit === u));
    this.drawFx(ctx);
    this.drawPopups(ctx);
    ctx.restore();
    for (const f of this.fx) if (f.type === 'flash') { ctx.fillStyle = f.color + (0.5 * (1 - f.t / f.dur)).toFixed(3) + ')'; ctx.fillRect(0, 0, 960, 540); }
    if (this.danger) {
      const a = 0.2 + Math.sin(t * 12) * 0.1;
      const g = ctx.createRadialGradient(480, 260, 260, 480, 260, 560);
      g.addColorStop(0, 'rgba(200,0,0,0)'); g.addColorStop(1, `rgba(200,0,0,${a})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, 960, 540);
    }
    if (d) { // 끌기: 슬로모션 톤 + 버튼에서 손가락까지 선
      ctx.fillStyle = 'rgba(30,60,90,0.22)'; ctx.fillRect(0, 0, 960, 540);
      const br = d.b.getBoundingClientRect();
      const bp = Input.toLogical({ clientX: br.left + br.width / 2, clientY: br.top });
      ctx.strokeStyle = d.over ? 'rgba(156,240,168,0.95)' : 'rgba(255,255,255,0.5)'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.setLineDash([2, 10]);
      ctx.beginPath(); ctx.moveTo(bp.x, bp.y); ctx.quadraticCurveTo((bp.x + d.x) / 2, Math.min(bp.y, d.y) - 60, d.x, d.y); ctx.stroke(); ctx.setLineDash([]);
      if (d.unit) this.drawTargetArc(ctx, d.h, d.unit, t);
    }
    const cd = this.cmdDrag;
    if (cd) {
      ctx.fillStyle = 'rgba(30,60,90,0.22)'; ctx.fillRect(0, 0, 960, 540);
      ctx.strokeStyle = !cd.over ? 'rgba(255,255,255,0.5)' : cd.h.actLock > 0 ? 'rgba(255,180,90,0.95)' : 'rgba(200,240,255,0.95)'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.setLineDash([2, 10]);
      ctx.beginPath(); ctx.moveTo(cd.h.x, cd.h.y - 20); ctx.lineTo(cd.unit ? cd.unit.x : cd.fx, cd.unit ? cd.unit.y - 20 : cd.fy); ctx.stroke(); ctx.setLineDash([]);
      if (cd.over && cd.unit) this.drawTargetArc(ctx, cd.h, cd.unit, t);
      else if (cd.over) this.drawMoveMark(ctx, cd.fx, cd.fy, t, 1);
    }
    for (const h of sim.heroes) if (h.alive && h.cmd && h.cmd.type === 'move' && Math.hypot(h.x - h.cmd.x, h.y - h.cmd.y) > 6) this.drawMoveMark(ctx, h.cmd.x, h.cmd.y, t, 0.6);
    if (this.potionPick) { ctx.fillStyle = 'rgba(20,40,30,0.25)'; ctx.fillRect(0, 0, 960, 540); }
    this.drawBanner(ctx);
    this.drawCutin(ctx);
  },

  floorEllipse(ctx, x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, 0, Math.PI * 2); ctx.fill(); },

  drawBackground(ctx, camX, t) {
    const W = 960, F = CONST;
    ctx.fillStyle = '#231c33'; ctx.fillRect(0, 0, W, 540);
    const ox1 = camX * 0.3;
    for (let row = 0; row < 9; row++) {
      const y = 40 + row * 34, off = (row % 2) * 44;
      for (let x = -100 + off + ox1; x < W + 100; x += 88) { ctx.fillStyle = row % 3 === 0 ? '#2e2642' : '#2b2340'; ctx.fillRect(Math.round(x), y, 84, 30); ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(Math.round(x), y, 84, 3); }
    }
    for (const tx0 of [110, 470, 850]) {
      const tx = tx0 + ox1;
      const fl = 0.88 + Math.sin(t * 9 + tx0) * 0.07 + Math.sin(t * 21 + tx0 * 2) * 0.05;
      const g = ctx.createRadialGradient(tx, 150, 6, tx, 150, 150 * fl);
      g.addColorStop(0, 'rgba(255,170,80,0.42)'); g.addColorStop(0.5, 'rgba(255,140,60,0.12)'); g.addColorStop(1, 'rgba(255,140,60,0)');
      ctx.fillStyle = g; ctx.fillRect(tx - 170, 0, 340, 340);
      ctx.fillStyle = '#5e3a20'; ctx.fillRect(tx - 3, 150, 6, 26);
      const fh = 12 + Math.sin(t * 14 + tx0) * 3;
      ctx.fillStyle = '#ff9a2a'; ctx.fillRect(tx - 4, 148 - fh, 8, fh); ctx.fillStyle = '#ffe066'; ctx.fillRect(tx - 2, 148 - fh * 0.6, 4, fh * 0.6);
    }
    const ox2 = camX * 0.6;
    for (const px0 of [290, 690]) {
      const px = px0 + ox2;
      ctx.fillStyle = '#3a3152'; ctx.fillRect(px - 16, 70, 32, 220); ctx.fillStyle = '#463c62'; ctx.fillRect(px - 16, 70, 8, 220);
      ctx.fillStyle = '#4c4268'; ctx.fillRect(px - 22, 62, 44, 12); ctx.fillRect(px - 22, 282, 44, 14);
    }
    // 바닥 (자유 이동 영역)
    const top = F.FIELD_Y0 - 30;
    const g2 = ctx.createLinearGradient(0, top, 0, 540);
    g2.addColorStop(0, '#3b3150'); g2.addColorStop(1, '#221b30');
    ctx.fillStyle = g2; ctx.fillRect(0, top, W, 540 - top);
    ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 2;
    for (let x = -300; x < W + 300; x += 80) { ctx.beginPath(); ctx.moveTo(x + camX, top); ctx.lineTo(x * 1.35 - 160 + camX * 1.3, 540); ctx.stroke(); }
    for (const y of [top + 30, top + 75, top + 130, top + 200]) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(0, top, W, 3);
    for (const dd of this.dust) {
      const x = (dd.x + t * 8 * dd.s + camX * 0.8) % 980 - 10, y = dd.y + Math.sin(t * dd.s + dd.p) * 10;
      ctx.fillStyle = `rgba(255,230,190,${0.15 + 0.15 * Math.sin(t * 2 + dd.p)})`; ctx.fillRect(x, y, 2, 2);
    }
  },

  drawUnit(ctx, u, t, highlight) {
    const enemy = u.side === 'enemy';
    const sc = this.unitScale(u);
    let x = u.x, y = u.y;
    if (u.anim.lunge > 0) { const k = clamp(Math.sin((1 - u.anim.lunge / 0.25) * Math.PI), 0, 1); x += u.anim.lungeX * k; y += (u.anim.lungeY || 0) * k * 0.5; }
    if (u.anim.hurt > 0) x += -u.face * u.anim.hurt * 30;
    const s = getSprite(u.sprite);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    this.floorEllipse(ctx, x, u.y + 2, s.w * sc * 0.36, 7 * (enemy ? u.size : 1));
    if (highlight) { ctx.strokeStyle = '#ffd34a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(x, u.y + 2, s.w * sc * 0.42 + Math.sin(t * 8) * 2, 10, 0, 0, Math.PI * 2); ctx.stroke(); }
    if (this.potionPick && !enemy) { ctx.strokeStyle = '#9cf0a8'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(x, u.y + 2, s.w * sc * 0.42, 10, 0, 0, Math.PI * 2); ctx.stroke(); }
    const blinking = ((t + u.uid * 1.37) % 3.6) < 0.13;
    let tint = null, tintAlpha = 0;
    if (u.anim.hurt > 0.08) tint = 'white';
    if (u.charge && Math.floor(t * (6 + (1 - u.charge.t / u.charge.total) * 14)) % 2 === 0) tint = 'white';
    if (!tint && u.statuses.enrage) { tint = 'red'; tintAlpha = 0.25 + Math.sin(t * 8) * 0.1; }
    const squash = u.anim.cast > 0 ? 1 + Math.sin((u.anim.cast / 0.3) * Math.PI) * 0.06 : (u.anim.hurt > 0 ? 0.94 : 1);
    const walk = u.moving ? Math.abs(Math.sin(t * 12 + u.uid)) * 3 : 0;
    const so = { scale: sc, flip: u.face < 0, t: t * (u.statuses.stun ? 0.2 : 1), phase: u.uid, blinking, squash };
    if (tint === 'white') { // 피격/차지 섬광: 원래 그림 위에 반투명 흰색
      drawSprite(ctx, u.sprite, x, y - walk, so);
      drawSprite(ctx, u.sprite, x, y - walk, Object.assign({}, so, { tint: 'white', alpha: u.charge ? 0.7 : 0.5 }));
    } else drawSprite(ctx, u.sprite, x, y - walk, Object.assign(so, { tint, tintAlpha }));
    if (u.moving && Math.random() < 0.08) this.fx.push({ type: 'dust', x: u.x - u.face * 8, y: u.y, vx: -u.face * 20, vy: -20, t: 0, dur: 0.4 });
    const top = y - s.h * sc;
    if (u.statuses.stun) for (let i = 0; i < 3; i++) { const a = t * 5 + i * 2.1; ctx.fillStyle = '#ffd34a'; ctx.fillRect(x + Math.cos(a) * 16 - 2, top - 4 + Math.sin(a) * 4, 5, 5); }
    const bw = enemy ? 34 + u.size * 10 : 34;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - bw / 2 - 1, top - 10, bw + 2, 6);
    ctx.fillStyle = enemy ? '#e0524a' : '#6fd86a'; ctx.fillRect(x - bw / 2, top - 9, bw * (u.hp / u.maxHp), 4);
    if (u.poiseMax) {
      const pf = u.broken > 0 ? u.broken / CONST.BREAK_DUR : u.poise / u.poiseMax;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - bw / 2 - 1, top - 4, bw + 2, 5);
      ctx.fillStyle = u.broken > 0 ? '#ffd34a' : u.shaken > 0 ? '#ffb050' : '#5aa8ff'; ctx.fillRect(x - bw / 2, top - 3, bw * pf, 3);
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; for (let i = 1; i < 5; i++) ctx.fillRect(x - bw / 2 + bw * i / 5 - 0.5, top - 4, 1, 5); // 5칸 눈금
      if (u.charge || u.call) { // 끊기 칸: 빈 원 → 채워진 원
